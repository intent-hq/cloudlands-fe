appId: app.cloudlands.intent
productName: Intent
directories:
  output: dist-electron
  buildResources: build

# Code signing hooks
# beforePack: Checks staged Mac architectures and compiles the native macOS 26 icon
# afterPack: Checks copied Mac binaries and signs sidecar BEFORE main app signing
# afterSign: Submits signed app to Apple for notarization
beforePack: scripts/desktop-before-pack.mjs
afterPack: scripts/sign-sidecar.js
afterSign: scripts/notarize.js

files:
  - dist/**/*
  # Incremental-compile state for tsc (build:main / build:preload); lives in
  # dist so `rm -rf dist` also clears it, but must not ship in the package.
  - '!dist/*.tsbuildinfo'
  # Dev-startup readiness sentinels (scripts/dev-ready.js); dev-only.
  - '!dist/.dev-ready-*'
  - package.json
  - node_modules/**/*
  - resources/**/*
  - '!resources/sidecar/**'
  # tailcat ships via extraResources (tailcat/), not asar.
  - '!resources/tailcat/**'
  # Speech helper ships via mac.extraResources (speech-helper/), not asar.
  - '!resources/speech-helper/**'
  # Keychain helper ships via mac.extraResources (keychain-helper/), not asar.
  - '!resources/keychain-helper/**'
  - '!resources/desktop-helper/**'

# Bundle the intentd binary into the packaged app
# Runtime path: process.resourcesPath/intentd/intentd (intentd.exe on Windows)
extraResources:
  - from: resources/sidecar
    to: intentd
    filter:
      - '**/*'
      # Keep the fetch-sidecar stamp (build machinery with a timestamp) out of
      # packaged builds so identical pinned binaries produce identical artifacts.
      - '!.intentd-fetch-stamp.json'
  # Version pin for the bundled sidecar, read at runtime from
  # process.resourcesPath/intentd.version (see intentd-version-pin.ts).
  - from: intentd.version
    to: intentd.version
  # tailcat tunnel client (staged per packaging target by
  # scripts/fetch-tailcat.cjs with its BSD-3-Clause LICENSE as tailcat.LICENSE
  # next to the binary). The ${os}-${arch} macros pick the matching binary per
  # built artifact, so a multi-platform run never ships the build host's
  # binary into a foreign artifact.
  # Runtime path: process.resourcesPath/tailcat/tailcat (tailcat.exe on Windows)
  - from: 'resources/tailcat/${os}-${arch}'
    to: tailcat
    filter:
      - '**/*'
      # Keep the fetch stamp (build machinery with a hash+timestamp) out of
      # packaged builds so identical pinned binaries produce identical artifacts.
      - '!.tailcat-fetch-stamp.json'

# Unpack renderer files from asar to avoid MIME type issues
# Unpack Express and related modules for HTTP MCP Bridge
# Unpack native modules to ensure prebuilds are accessible
asarUnpack:
  - dist/renderer/**/*
  - resources/**/*
  - node_modules/express/**/*
  - node_modules/body-parser/**/*
  - node_modules/mime/**/*
  - node_modules/mime-types/**/*
  - node_modules/mime-db/**/*
  - node_modules/node-pty/**/*

# Skip native module rebuild to avoid hanging on cpu-features
buildDependenciesFromSource: false
npmRebuild: false

protocols:
  - name: intent
    schemes:
      - intent

mac:
  # The entry point selects one native architecture per runner; no cross-builds.
  artifactName: '${productName}-${version}-${arch}-mac.${ext}'
  files:
    # node-pty is rebuilt for this Electron/CPU. Never ship foreign fallback prebuilds.
    - '!node_modules/node-pty/prebuilds/**/*'
    - '!node_modules/node-pty/build/Debug/**/*'
  category: public.app-category.developer-tools
  icon: src/assets/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The keychain sync helper is signed by the afterPack hook (sign-sidecar.js)
  # with RESTRICTED keychain entitlements (application-identifier +
  # keychain-access-groups) and an embedded provisioning profile. Exclude it
  # from electron-builder's own deep-sign pass, which would otherwise re-sign
  # the bundle with the main app entitlements above and destroy that signature.
  # The pre-signed bundle is sealed as-is into the outer app signature.
  signIgnore:
    - 'Resources/keychain-helper/intent-keychain-helper\.app'
  # Bundle the macOS speech transcription helper (built by
  # scripts/build-speech-helper.cjs; signed by the afterPack hook).
  # Runtime path: process.resourcesPath/speech-helper/intent-speech-helper
  extraResources:
    - from: 'resources/desktop-helper/darwin-${arch}'
      to: desktop-helper
    - from: build/macos-icon/Assets.car
      to: Assets.car
    # Runtime Dock icon. Finder and Applications continue to use Assets.car/icon.icns.
    - from: src/assets/icons/app-icon/Icon-1024.png
      to: app-icon.png
    - from: resources/speech-helper
      to: speech-helper
    # Bundle the iCloud-keychain sync helper (built by
    # scripts/build-keychain-helper.cjs; signed — with an embedded Developer ID
    # provisioning profile when available — by the afterPack hook).
    # Runtime path: process.resourcesPath/keychain-helper/
    #   intent-keychain-helper.app/Contents/MacOS/intent-keychain-helper
    - from: resources/keychain-helper
      to: keychain-helper
  # Microphone usage string shown by the one-time macOS TCC prompt
  # (voice dictation; pairs with com.apple.security.device.audio-input)
  extendInfo:
    # macOS 26 uses the native Assets.car icon. Older versions use icon.icns.
    CFBundleIconName: Intent
    CFBundleIconFile: icon.icns
    NSMicrophoneUsageDescription: Intent uses the microphone to transcribe your voice into text for dictation.
    # Speech recognition usage string for the OS dictation engine (local
    # Speech.framework transcription via the bundled speech helper).
    NSSpeechRecognitionUsageDescription: Intent uses macOS speech recognition to transcribe your voice into text for dictation.
  # Code signing - requires Apple Developer certificate
  # Set APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD env vars for notarization
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  # No custom requirements - codesign derives DR from the actual signing certificate
  notarize: true
  # intentd sidecar is signed via afterPack hook (scripts/sign-sidecar.js)
  # before the main app seal is created, preventing "nested code modified" errors
  target:
    - dmg
    - zip

# Notarization configuration (requires Apple Developer account)
# To enable notarization:
# 1. Set notarize: true above
# 2. Set these environment variables:
#    - APPLE_ID: Your Apple ID email
#    - APPLE_APP_SPECIFIC_PASSWORD: App-specific password from appleid.apple.com
#    - APPLE_TEAM_ID: Your 10-character Team ID
# Or use these in afterSign hook with @electron/notarize package

dmg:
  artifactName: '${productName}-${version}-${arch}.${ext}'
  window:
    width: 540
    height: 360
  iconSize: 120
  iconTextSize: 14
  contents:
    - x: 150
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  extraResources:
    - from: 'resources/desktop-helper/win32-${arch}'
      to: desktop-helper
  icon: src/assets/icons/icon.ico
  # Production stays unsigned; the retired hook rejects the old DigiCert flag.
  # Manual builds explicitly select scripts/windows-builder.cjs for unsigned/Azure.
  # Keep the existing installed updater publisher until native migration acceptance.
  signtoolOptions:
    sign: scripts/windows-sign.cjs
    publisherName: 'Clement Pang'
    signingHashAlgorithms: [sha256]
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  # GitHub replaces spaces in uploaded asset names. The generic updater feed
  # must already reference that exact name when electron-builder generates it.
  artifactName: '${productName}.Setup.${version}.${ext}'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: '${productName}.${version}.${ext}'

linux:
  icon: src/assets/icons/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64

publish:
  provider: generic
  url: https://github.com/intent-hq/cloudlands-releases/releases/download/stable
