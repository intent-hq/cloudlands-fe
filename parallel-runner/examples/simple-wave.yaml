# Simple Wave Example
# A basic configuration showing the minimal required fields

title: "Simple Parallel Wave"
description: "A simple example of parallel agent execution"

packages:
  - id: "task1"
    name: "First Task"
    description: "just say hi"

  - id: "task2"
    name: "Second Task"
    description: "just say hi"

  - id: "task3"
    name: "Third Task"
    description: "just say hi"
    dependencies: ["task1"]

# Optional configuration
config:
  maxParallel: 2
  timeoutMinutes: 15

# Model configuration
model: "opus4.1"
