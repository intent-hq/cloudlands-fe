# TypeScript Fixes Template
# Reusable prompts and configuration for TypeScript error fixing

packageDefaults:
  timeout: 30
  retries: 2

prompts:
  - name: "setup"
    template: |
      You are fixing TypeScript errors in the experimental/amelia/workspaces directory.

      IMPORTANT RULES:
      1. Only modify files in experimental/amelia/workspaces
      2. Run verification commands before and after changes
      3. Document what was fixed
      4. If you can't fix something, document why

  - name: "analyze"
    template: |
      First, analyze the current state:

      1. Run: npm run check 2>&1 | grep -A 2 "{package_id}"
      2. Identify the specific errors to fix
      3. Plan your approach

  - name: "fix"
    template: |
      Now fix the errors:

      {package_description}

      Remember to:
      - Make minimal changes
      - Preserve existing functionality
      - Add type annotations where needed
      - Use proper TypeScript patterns

  - name: "verify"
    template: |
      Verify your fixes:

      1. Run: npm run check
      2. Confirm errors are reduced
      3. Run any relevant tests
      4. Document what was fixed

config:
  continueOnError: false
  runTests: true
