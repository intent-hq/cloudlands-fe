name: Cache pnpm store
description: >-
  Restores and saves the pnpm store keyed on the lockfile, through ./.github/actions/cache
  (WarpBuild's cache on WarpBuild Linux and macOS runners, GitHub's elsewhere).
  Replaces setup-node's `cache: pnpm`; run it after pnpm and Node are set up and
  before `pnpm install`.
runs:
  using: composite
  steps:
    # The store path goes through the job environment, not a step output: the
    # nested cache action re-reads `path` in its post (save) step, after this
    # composite's step outputs are gone.
    - shell: bash
      run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: ./.github/actions/cache
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-
