name: Packaged smoke boundary admission
on:
  push:
    branches: [diagnostic/b76t-packaged-readiness]
    paths: [.github/workflows/b76t-packaged-admission.yml]
permissions:
  contents: read
concurrency:
  group: b76t-boundary-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    if: >-
      github.repository == 'intent-hq/cloudlands-fe' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diagnostic/b76t-packaged-readiness' &&
      github.actor == 'panghy' && github.triggering_actor == 'panghy' &&
      github.run_attempt == 1 &&
      github.event.before == 'b7997f3e2e8dd80d0fd6c36752e4ad230fcace9d' &&
      github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: gh-linux-8x
    timeout-minutes: 8
    env:
      B76_EVENT_BEFORE_SHA: ${{ github.event.before }}
      B76_EVENT_AFTER_SHA: ${{ github.event.after }}
    steps:
      - name: Admit guest and exercise only the boundary canary
        id: admit
        env:
          B76_CONTEXT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        timeout-minutes: 4
        run: |
          # Invoked by trap finish EXIT; ShellCheck cannot follow this indirect call.
          # shellcheck disable=SC2317
          finish() {
            local primary=$? write_status=not_attempted sync_status=not_attempted verdict
            trap - EXIT INT TERM
            set +e
            verdict=$primary
            printf 'primary_exit=%s\npid=%s\nend_epoch=%s\n' "$primary" "$$" "$EPOCHREALTIME" > "${prefix}.primary-exit.native"
            write_status=$?
            if [[ "$write_status" == 0 ]]; then /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "${prefix}.primary-exit.native"; sync_status=$?; fi
            if [[ "$primary" == 0 && ( "$write_status" != 0 || "$sync_status" != 0 ) ]]; then verdict=74; fi
            printf 'primary=%s receipt_write=%s receipt_sync=%s wrapper_exit_intent=%s\n' "$primary" "$write_status" "$sync_status" "$verdict"
            local log_status=$?
            if [[ "$verdict" == 0 && "$log_status" != 0 ]]; then verdict=74; fi
            exit "$verdict"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          readonly root="${RUNNER_TEMP}/b76t-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly prefix="${root}.admit"
          set -euo pipefail
          set -o noclobber
          umask 077
          printf 'pid=%s\nstart_epoch=%s\ncwd=%s\n' "$$" "$EPOCHREALTIME" "$PWD" > "${prefix}.start.native"
          /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "${prefix}.start.native"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 78
          [[ "$RUNNER_TEMP" == /home/runner/work/_temp ]] || exit 78
          /usr/bin/timeout --kill-after=1s 8s /usr/bin/python3 -I -S -B - "$root" <<'B76_SOURCES'
          import base64, hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          payloads = {'identity.py': {'sha256': 'ba310d563a592b97b6ca88d2d25ea3a4cead3ba1439cba52352d8679f0e9c0b9', 'data': ''}, 'boundary.py': {'sha256': '603f116a79c05dd44b86260beac7441b47b1b1d996719208364f3da7380b789a', 'data': ''}, 'canary.py': {'sha256': '85b3699e9803fe0d4907b75bd1a1d196a58d944406cb9e759ef60d43e5219b6e', 'data': ''}}
          decoded = {}
          for name, record in payloads.items():
              data = base64.b64decode(record['data'], validate=True)
              assert hashlib.sha256(data).hexdigest() == record['sha256']
              decoded[name] = data
          scope = {'__name__': 'owned_staging_only'}
          exec(compile(decoded['boundary.py'], '<frozen-boundary>', 'exec'), scope)
          owner = scope['create_owned_root'](root, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          bindings = {}
          for name, record in payloads.items():
              data = base64.b64decode(record['data'], validate=True)
              assert hashlib.sha256(data).hexdigest() == record['sha256']
              with (root / name).open('xb') as f:
                  f.write(data); f.flush(); os.fsync(f.fileno())
              bindings[name] = record['sha256']
          with (root / 'source-bindings.json').open('x') as f:
              json.dump(bindings, f); f.flush(); os.fsync(f.fileno())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ownership_token=' + owner['token'] + '\n'); f.flush(); os.fsync(f.fileno())
          B76_SOURCES
          read -r owner_token < "$root/ownership.token"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/python3 -I -S -B "$root/identity.py" "$root/identity" "$0" /usr/bin/bash > "$root/identity.stdout" 2> "$root/identity.stderr"
          identity_exit=$?
          printf 'supervised_exit=%s\n' "$identity_exit" > "$root/identity.direct.native"
          identity_write=$?
          identity_sync=not_attempted
          if [[ "$identity_write" == 0 ]]; then /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "$root/identity.direct.native"; identity_sync=$?; fi
          printf 'identity=%s receipt_write=%s receipt_sync=%s\n' "$identity_exit" "$identity_write" "$identity_sync"
          if [[ "$identity_exit" != 0 ]]; then exit "$identity_exit"; fi
          if [[ "$identity_write" != 0 || "$identity_sync" != 0 ]]; then exit 74; fi
          set -e
          printf 'requested_epoch=%s\n' "$EPOCHREALTIME" > "$root/setup.request.native"
          /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "$root/setup.request.native"
          set +e
          /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/sudo -n /usr/bin/env -i PATH=/usr/bin:/bin B76_OWNER_TOKEN="$owner_token" /usr/bin/python3 -I -S -B "$root/boundary.py" setup "$root" > "$root/setup.stdout" 2> "$root/setup.stderr"
          setup_exit=$?
          printf 'supervised_exit=%s\n' "$setup_exit" > "$root/setup.direct.native"
          setup_write=$?
          setup_sync=not_attempted
          if [[ "$setup_write" == 0 ]]; then /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "$root/setup.direct.native"; setup_sync=$?; fi
          printf 'setup=%s receipt_write=%s receipt_sync=%s\n' "$setup_exit" "$setup_write" "$setup_sync"
          if [[ "$setup_exit" != 0 ]]; then exit "$setup_exit"; fi
          if [[ "$setup_write" != 0 || "$setup_sync" != 0 ]]; then exit 74; fi
          exit 0

      - name: Settle recorded owned resources and bound receipt upload
        id: settle
        env:
          B76_OWNER_TOKEN: ${{ steps.admit.outputs.ownership_token }}
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 2
        run: |
          # Invoked by trap finish EXIT; ShellCheck cannot follow this indirect call.
          # shellcheck disable=SC2317
          finish() {
            local primary=$? write_status=not_attempted sync_status=not_attempted verdict
            trap - EXIT INT TERM
            set +e
            verdict=$primary
            printf 'primary_exit=%s\npid=%s\nend_epoch=%s\n' "$primary" "$$" "$EPOCHREALTIME" > "${prefix}.primary-exit.native"
            write_status=$?
            if [[ "$write_status" == 0 ]]; then /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "${prefix}.primary-exit.native"; sync_status=$?; fi
            if [[ "$primary" == 0 && ( "$write_status" != 0 || "$sync_status" != 0 ) ]]; then verdict=74; fi
            printf 'primary=%s receipt_write=%s receipt_sync=%s wrapper_exit_intent=%s\n' "$primary" "$write_status" "$sync_status" "$verdict"
            local log_status=$?
            if [[ "$verdict" == 0 && "$log_status" != 0 ]]; then verdict=74; fi
            exit "$verdict"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          readonly root="${RUNNER_TEMP}/b76t-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly prefix="${root}.settle-${BASHPID}-${EPOCHREALTIME/./-}"
          set -euo pipefail
          set -o noclobber
          umask 077
          printf 'pid=%s\nstart_epoch=%s\ncwd=%s\n' "$$" "$EPOCHREALTIME" "$PWD" > "${prefix}.start.native"
          /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "${prefix}.start.native"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 78
          [[ "$RUNNER_TEMP" == /home/runner/work/_temp ]] || exit 78
          settle_exit=0
          settle_write=0
          settle_sync=0
          if [[ -n "${B76_OWNER_TOKEN:-}" ]]; then
            /usr/bin/timeout --kill-after=1s 5s /usr/bin/python3 -I -S -B - "$root" <<'B76_SETTLE_GUARD'
          import hashlib, pathlib, sys, runpy
          root = pathlib.Path(sys.argv[1]); assert root.resolve() == root and not root.is_symlink()
          assert hashlib.sha256((root / 'boundary.py').read_bytes()).hexdigest() == '603f116a79c05dd44b86260beac7441b47b1b1d996719208364f3da7380b789a'
          scope = runpy.run_path(str(root / 'boundary.py'), run_name='ownership_guard')
          scope['verify_owned_root'](root)
          B76_SETTLE_GUARD
            set +e
            /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/sudo -n /usr/bin/env -i PATH=/usr/bin:/bin B76_OWNER_TOKEN="$B76_OWNER_TOKEN" /usr/bin/python3 -I -S -B "$root/boundary.py" settle "$root" > "$root/settle.stdout" 2> "$root/settle.stderr"
          settle_exit=$?
          printf 'supervised_exit=%s\n' "$settle_exit" > "$root/settle.direct.native"
          settle_write=$?
          settle_sync=not_attempted
          if [[ "$settle_write" == 0 ]]; then /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "$root/settle.direct.native"; settle_sync=$?; fi
          printf 'settle=%s receipt_write=%s receipt_sync=%s\n' "$settle_exit" "$settle_write" "$settle_sync"
          else
            printf 'no successful root-creation token; pre-existing root/state are not consumed\n'
          fi
          set +e
          /usr/bin/timeout --kill-after=1s 10s /usr/bin/python3 -I -S -B - "$root" "$prefix" <<'B76_UPLOAD_SCOPE'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1]); native = pathlib.Path(sys.argv[2])
          files = [pathlib.Path(str(native) + '.start.native')]
          missing = []
          if os.environ.get('B76_OWNER_TOKEN'):
              assert root.is_dir()
              # Ownership was verified before settlement; never collect a root lacking that step token.
              for suffix in ['.admit.start.native', '.admit.primary-exit.native']:
                  expected = pathlib.Path(str(root) + suffix)
                  if expected.is_file(): files.append(expected)
                  else: missing.append(str(expected))
              for pattern in ['*.json', '*.native', '*.stdout', '*.stderr']: files.extend(root.glob(pattern))
          assert files and len(files) <= 256
          records = []
          for path in sorted(files):
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes(); assert len(data) <= 256 * 1024
              records.append({'path': str(path), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          assert sum(x['bytes'] for x in records) <= 4 * 1024 * 1024 - 4096
          # Reserve4KiB for the settlement wrapper's final native receipt after this scan.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('artifact_ok=true\nartifact_paths<<B76_PATHS\n' + '\n'.join(str(x) for x in files) + '\n' + str(native) + '.primary-exit.native\nB76_PATHS\n'); f.flush(); os.fsync(f.fileno())
          print(json.dumps({'smallUploadFilesBeforeSettlementNativeFinalization': records, 'maxBytes': 4 * 1024 * 1024, 'missingMandatoryNative': missing}), flush=True)
          sys.exit(74 if missing else 0)
          B76_UPLOAD_SCOPE
          scope_exit=$?
          printf 'small_upload_scope_actual=%s\n' "$scope_exit"
          if [[ "$settle_exit" != 0 ]]; then exit "$settle_exit"; fi
          if [[ "$settle_write" != 0 || "$settle_sync" != 0 ]]; then exit 74; fi
          exit "$scope_exit"

      - name: Preserve small admission receipts
        id: upload
        if: ${{ always() && steps.settle.outputs.artifact_ok == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b76t-admission-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: ${{ steps.settle.outputs.artifact_paths }}
      - name: Record provider upload result and final verdict
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 1
        env:
          B76_FACTS_OUTCOME: ${{ steps.admit.outcome }}
          B76_SETTLEMENT_OUTCOME: ${{ steps.settle.outcome }}
          B76_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          B76_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          B76_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          B76_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          finish() {
            local primary=$? write_status=not_attempted sync_status=not_attempted verdict
            trap - EXIT INT TERM
            set +e
            verdict=$primary
            printf 'primary_exit=%s\npid=%s\nend_epoch=%s\n' "$primary" "$$" "$EPOCHREALTIME" > "${prefix}.primary-exit.native"
            write_status=$?
            if [[ "$write_status" == 0 ]]; then /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "${prefix}.primary-exit.native"; sync_status=$?; fi
            if [[ "$primary" == 0 && ( "$write_status" != 0 || "$sync_status" != 0 ) ]]; then verdict=74; fi
            printf 'primary=%s receipt_write=%s receipt_sync=%s wrapper_exit_intent=%s\n' "$primary" "$write_status" "$sync_status" "$verdict"
            local log_status=$?
            if [[ "$verdict" == 0 && "$log_status" != 0 ]]; then verdict=74; fi
            exit "$verdict"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          readonly root="${RUNNER_TEMP}/b76t-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly prefix="${root}.upload-receipt"
          set -euo pipefail
          set -o noclobber
          umask 077
          printf 'pid=%s\nstart_epoch=%s\ncwd=%s\n' "$$" "$EPOCHREALTIME" "$PWD" > "${prefix}.start.native"
          /usr/bin/timeout --kill-after=1s 5s /usr/bin/sync -f "${prefix}.start.native"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 78
          [[ "$RUNNER_TEMP" == /home/runner/work/_temp ]] || exit 78
          /usr/bin/timeout --signal=TERM --kill-after=5s 30s /usr/bin/python3 -I -S -B - <<'PYUPLOAD'
          import json, os, sys
          keys = ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'B76_FACTS_OUTCOME',
                  'B76_SETTLEMENT_OUTCOME', 'B76_UPLOAD_OUTCOME', 'B76_ARTIFACT_ID', 'B76_ARTIFACT_DIGEST', 'B76_ARTIFACT_URL']
          receipt = {key: os.environ.get(key) for key in keys}
          text = json.dumps(receipt, sort_keys=True)
          print(text, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Admission upload receipt\n```json\n' + text + '\n```\n')
              summary.flush()
              os.fsync(summary.fileno())
          sys.exit(0 if receipt['B76_FACTS_OUTCOME'] == receipt['B76_SETTLEMENT_OUTCOME'] == receipt['B76_UPLOAD_OUTCOME'] == 'success' and receipt['B76_ARTIFACT_ID'] and receipt['B76_ARTIFACT_DIGEST'] else 74)
          PYUPLOAD
