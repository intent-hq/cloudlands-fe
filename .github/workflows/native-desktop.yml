name: Native desktop helpers
on:
  pull_request:
    paths:
      - 'native/desktop/**'
      - 'scripts/build-desktop-helper.mjs'
      - 'scripts/desktop-before-pack.mjs'
      - '.github/workflows/native-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
          - runner: windows-latest
            platform: win32
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - run: node scripts/build-desktop-helper.mjs
      - name: Verify macOS permission prompt policy
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc native/desktop/macos/PermissionPrompts.swift native/desktop/tests/macos/main.swift -o /tmp/desktop-permission-tests
          /tmp/desktop-permission-tests
      - name: Compile macOS cursor movement functional test
        if: runner.os == 'macOS'
        run: xcrun swiftc -parse-as-library native/desktop/tests/macos/PointerMove.swift -o /tmp/desktop-pointer-tests
      - name: Observe native Windows capture and input
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: dotnet run --project native/desktop/tests/windows/DesktopFunctional.csproj -c Release -- resources/desktop-helper/win32-x64/intent-desktop-helper.exe
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows' && always()
        with:
          name: desktop-native-windows-evidence
          path: native/desktop/tests/windows/artifacts/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-helper-${{ matrix.platform }}
          path: resources/desktop-helper/
          if-no-files-found: error
