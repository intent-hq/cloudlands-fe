name: Intent - Upload Banner

on:
  workflow_dispatch:
    inputs:
      banner_json:
        description: 'Banner JSON array (leave empty to clear). Example: [{"id":"my-banner","startAt":"2026-03-05T00:00:00Z","endAt":"2026-03-19T23:59:59Z","priority":1,"dismissable":true,"message":"Hello world","buttons":[]}]'
        required: false
        type: string

# OIDC token for GCP Workload Identity Federation
permissions:
  id-token: write
  contents: read

concurrency:
  group: intent-banner
  cancel-in-progress: true

jobs:
  upload-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate with GCP (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.INTENT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.INTENT_GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Build banner JSON
        id: banner
        run: |
          BANNER_FILE=$(mktemp)
          INPUT='${{ inputs.banner_json }}'

          if [ -z "$INPUT" ]; then
            echo '[]' > "$BANNER_FILE"
            echo "action=clear" >> "$GITHUB_OUTPUT"
          else
            # Validate it's valid JSON
            if ! echo "$INPUT" | jq . > /dev/null 2>&1; then
              echo "❌ Error: Invalid JSON"
              echo "$INPUT"
              exit 1
            fi
            echo "$INPUT" | jq . > "$BANNER_FILE"
            echo "action=set" >> "$GITHUB_OUTPUT"
          fi

          echo "file=$BANNER_FILE" >> "$GITHUB_OUTPUT"
          echo "📋 Banner contents:"
          cat "$BANNER_FILE" | jq .

      - name: Upload banner to GCS
        run: |
          gcloud storage cp "${{ steps.banner.outputs.file }}" \
            "gs://${{ secrets.INTENT_GCS_BUCKET }}/banner.json" \
            --content-type="application/json"

      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache "${{ secrets.INTENT_CLOUD_CDN_URL_MAP }}" \
            --path "/banner.json" \
            --project="${{ secrets.INTENT_GCP_PROJECT }}" \
            --quiet

      - name: Post summary
        run: |
          ACTION="${{ steps.banner.outputs.action }}"

          echo "## 📢 Banner ${ACTION^}d" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACTION" = "set" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${{ steps.banner.outputs.file }}" | jq . >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Banner has been **cleared**." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🌐 **CDN URL:** https://cdn.augmentcode.com/banner.json" >> "$GITHUB_STEP_SUMMARY"