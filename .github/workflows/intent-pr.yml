name: Intent PR Checks

on:
  pull_request:
    branches: ['main']
  merge_group:

env:
  # Burst the Linux jobs to WarpBuild when more than this many Linux
  # jobs are queued/running ahead of this run (see the route job). Note
  # that jobs still blocked on `needs` are invisible to the jobs API, so
  # a queued run ahead of us counts only its utility jobs (pr-title /
  # conflict-markers / gate when routed to tinybox) — one fully queued
  # PR run is already enough to clear this threshold, which is intended:
  # it means tinybox is at least one full run behind. Bursted jobs
  # (utility included) don't carry the self-hosted+Linux labels and stop
  # counting toward the depth, so the system naturally falls back to
  # tinybox as it frees up.
  LINUX_BURST_THRESHOLD: 2

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides where the Linux jobs — heavy (checks / build-web / test) and
  # utility (pr-title / conflict-markers / gate) — run: the local tinybox
  # runner normally, or WarpBuild ephemeral runners when the tinybox queue
  # is backed up. Runs on a small WarpBuild ephemeral runner so the burst
  # decision is independent of the tinybox queue: when the probe ran on
  # tinybox it queued behind the very backlog it measures (and deadlocked
  # entirely with tinybox offline). The probe fails open to tinybox on API
  # errors; if the job itself fails (runner outage, timeout), the routed
  # jobs are skipped and need a re-run — a deliberate trade-off.
  route:
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions queue; job-level so the other jobs don't inherit
      # it. The probe (and the optional cross-repo CI_QUEUE_READ_TOKEN)
      # runs on third-party WarpBuild ephemeral runners — an accepted
      # trade-off.
      actions: read
    outputs:
      checks_labels: ${{ steps.decide.outputs.checks_labels }}
      build_labels: ${{ steps.decide.outputs.build_labels }}
      test_labels: ${{ steps.decide.outputs.test_labels }}
      utility_labels: ${{ steps.decide.outputs.utility_labels }}
      linux_burst: ${{ steps.decide.outputs.linux_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v7
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
        with:
          # tinybox serves several repos on one runner slot, so the probe
          # wants to size the queue across all of them — but the default
          # GITHUB_TOKEN is repo-scoped and can only see cloudlands-fe. Set
          # the CI_QUEUE_READ_TOKEN secret (fine-grained PAT with
          # actions:read on the sibling repos) to enable cross-repo
          # counting; without it those repos are skipped and contribute 0.
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            const tinybox = ["self-hosted", "Linux", "X64"];
            // The heavy jobs (checks / build-web / test) are pnpm/Node
            // workloads sized per WarpBuild usage recommendations: checks
            // showed low CPU and memory (4x), build-web low memory (8x),
            // and test keeps the 16x for vitest parallelism. None need the
            // 32x sized for intentd's instrumented Rust coverage suites.
            const checksBurst = ["warp-ubuntu-latest-x64-4x"];
            const buildBurst = ["warp-ubuntu-latest-x64-8x"];
            const testBurst = ["warp-ubuntu-latest-x64-16x"];
            // The utility jobs (pr-title / conflict-markers / gate) are
            // seconds-long; a 2x runner is plenty when bursting.
            const utilityBurst = ["warp-ubuntu-latest-x64-2x"];
            const threshold = parseInt(process.env.THRESHOLD || "2", 10);
            // Count self-hosted Linux jobs that are queued or running in
            // queued/in-progress runs: a running job occupies the single
            // tinybox slot just as much as a queued one. WarpBuild jobs —
            // including this route job and bursted heavy jobs — don't match
            // the self-hosted+Linux label filter, so they never inflate the
            // depth.
            const owner = context.repo.owner;
            const repos = ["intentd", "cloudlands-fe", "monorepo"];
            let depth = 0;
            for (const repo of repos) {
              try {
                for (const status of ["queued", "in_progress"]) {
                  const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 20 });
                  for (const run of runs.data.workflow_runs.filter(r => r.id !== context.runId).slice(0, 10)) {
                    const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
                    depth += jobs.data.jobs.filter(j => (j.status === "queued" || j.status === "in_progress") && j.labels.includes("self-hosted") && j.labels.includes("Linux")).length;
                  }
                }
              } catch (e) {
                core.info(`queue probe skipped ${repo}: ${e.message}`);
              }
            }
            const useBurst = depth > threshold;
            core.info(`linux queue depth=${depth} threshold=${threshold} burst=${useBurst}`);
            core.setOutput("checks_labels", JSON.stringify(useBurst ? checksBurst : tinybox));
            core.setOutput("build_labels", JSON.stringify(useBurst ? buildBurst : tinybox));
            core.setOutput("test_labels", JSON.stringify(useBurst ? testBurst : tinybox));
            core.setOutput("utility_labels", JSON.stringify(useBurst ? utilityBurst : tinybox));
            core.setOutput("linux_burst", String(useBurst));

  pr-title:
    name: Validate PR Title
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.utility_labels) }}
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (ported from intent-hq/intentd#591; the intentd#588
  # incident: release-plz pushed a branch with '<' x7 / '>' x7 marker lines in
  # CHANGELOG.md, Cargo.lock and Cargo.toml, and no check caught it). Matches
  # the exact line forms git emits — seven '<' or '>' followed by a space and
  # a label — and counts a bare seven-'=' line only when the same file also
  # has both of the other two, so Markdown setext headings / code snippets
  # don't false-positive.
  conflict-markers:
    name: Conflict Markers
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.utility_labels) }}
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Consolidated typecheck + lint job. Previously four separate ubuntu-latest
  # jobs (typecheck-renderer, typecheck-main, typecheck-preload,
  # static-checks); on the single-slot self-hosted Linux runner they would
  # queue serially, each paying its own checkout + pnpm install. One job on
  # the 64-core box runs the shared setup once and all checks back-to-back.
  checks:
    name: Type Check & Lint
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.checks_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        # cache: 'pnpm' only when bursting — ephemeral WarpBuild runners
        # have no persistent pnpm store, so the GH Actions cache is worth
        # the tarball round-trip there. On the non-ephemeral self-hosted
        # runner the local pnpm store persists between runs and the cache
        # would be pure overhead (same as the jobs below).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ needs.route.outputs.linux_burst == 'true' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate build config
        run: pnpm run generate:build-config
      - name: Generate IPC channels
        run: pnpm run generate:ipc-channels
      - name: Generate i18n messages
        run: pnpm run generate:i18n
      - name: Svelte check
        run: pnpm run check
      - name: Type check (renderer)
        run: pnpm run type-check
      - name: Type check (preload)
        run: pnpm exec tsc --noEmit -p tsconfig.preload.json
      - name: ESLint
        run: pnpm run lint
      - name: Accessibility lint
        run: bash scripts/check-accessibility.sh
      - name: workspace:* dispatcher gate
        run: node scripts/check-workspace-event-dispatchers.mjs
      - name: Build main process
        run: pnpm run build:main
      - name: Verify main process has no devDependency imports
        run: |
          # svelte is a devDependency stripped from packaged builds.
          # Hide it and try importing files reachable from the main-
          # process entry. If any module in the chain transitively
          # resolves 'svelte', Node fails with ERR_MODULE_NOT_FOUND —
          # the same crash that occurs inside the packaged app.asar.
          #
          # We cannot import dist/main/index.js directly because it
          # requires 'electron' (unavailable in plain Node), which may
          # error out *before* the resolver reaches the svelte path,
          # producing a false pass (this is exactly the bug that let
          # PR #654 through). Instead we import the specific service
          # modules that sit on the boundary between the main process
          # and renderer-only dependencies.
          mv node_modules/svelte node_modules/svelte.HIDDEN

          FAILED=0
          for MODULE in \
            dist/features/agent/services/stream-manager.js \
            dist/features/agent/main/consolidated-backend.service.js \
            dist/features/agent/main/agent-backend-handler.service.js; do

            EXIT_CODE=0
            OUTPUT=$(node --input-type=module \
              -e "await import('./$MODULE'); process.exit(0);" \
              2>&1) || EXIT_CODE=$?

            if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "Cannot find package 'svelte'"; then
              echo "FAIL: $MODULE"
              echo "$OUTPUT" | head -3
              FAILED=1
            fi
          done

          mv node_modules/svelte.HIDDEN node_modules/svelte

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Main-process modules transitively import svelte. This will crash packaged builds."
            exit 1
          fi

          echo "✓ No svelte imports found in main-process module graph."

  build-web:
    name: Build (web)
    # Moved from m1mac to the self-hosted Linux runner (tinybox, 64 cores /
    # 125 GB) so the single-slot Mac is free for release/signing work.
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.build_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      # The full production renderer build needs more heap than the other
      # jobs; 4096 OOMed, and with sourcemaps the heap flakily grew past
      # the 8192 cap on the old 2-core / 7 GB ubuntu-latest runner
      # (~7.7 GB at death, monorepo#1074), which forced
      # INTENT_DISABLE_SOURCEMAPS=1. Sourcemaps stay enabled on the 125 GB
      # self-hosted runner, but 8192 OOMed here too (the 64-core box runs
      # more build work in parallel), so the cap is 16384 — comfortably
      # within the machine's RAM.
      NODE_OPTIONS: '--max-old-space-size=16384'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        # cache: 'pnpm' only when bursting — no persistent pnpm store on
        # ephemeral WarpBuild runners; on tinybox the local store persists
        # between runs and the GH Actions cache tarball round-trip would
        # only add network time (see checks).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ needs.route.outputs.linux_burst == 'true' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web renderer
        run: pnpm run build:web
      - name: Verify web build output
        run: |
          test -f dist/web/index.html || {
            echo "::error::dist/web/index.html missing — web build did not produce the SPA fallback."
            exit 1
          }
          echo "✓ dist/web/index.html present."

  test:
    # Unsharded on the single-slot self-hosted Linux runner (tinybox): shards
    # would just queue serially on it, so one job avoids the extra
    # checkout/install overhead — vitest parallelism uses the 64 cores
    # within the single job.
    name: Unit Tests
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.test_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        # cache: 'pnpm' only when bursting — no persistent pnpm store on
        # ephemeral WarpBuild runners; redundant on the non-ephemeral
        # self-hosted runner (see checks / build-web).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ needs.route.outputs.linux_burst == 'true' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit

  gate:
    name: Type Check & Test
    runs-on: ${{ fromJSON(needs.route.outputs.utility_labels) }}
    permissions: {}
    if: always()
    needs: [route, checks, build-web, test]
    steps:
      - name: Check results
        run: |
          echo "Architecture gate temporarily disabled; re-enable by restoring the lint:architecture package script and architecture-gate workflow job."
          if [ "${{ needs.checks.result }}" != "success" ] || \
             [ "${{ needs.build-web.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
