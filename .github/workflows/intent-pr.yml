name: Intent PR Checks

on:
  pull_request:
    branches: ['main', 'feat/up-clean-3-shared-controls']
  # PRs run metadata, static consumer contracts, the CI policy test, type/lint
  # and unit tests. The merge queue reruns type/lint and unit tests on the
  # merged tree and adds build, integration and relevant browser/native suites
  # (browser suites also run nightly/manually). Release-shaped diffs retain the
  # existing fast path; CI Gate rejects all other unexpected skips.
  merge_group:

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Number of intent-cache Linux runner slots: the route job bursts the heavy
  # jobs to GitHub-hosted larger runners once this many intent-cache jobs are queued or running
  # ahead of this run. Raise it when slots are added. Jobs still blocked on
  # `needs` are invisible to the jobs API, so a queued run ahead of us may
  # undercount. Bursted jobs don't carry the intent-cache label and stop
  # counting, so routing returns to the slots as they free up.
  LINUX_BURST_THRESHOLD: 2

jobs:
  # Fork PRs skip every checkout/routed job. CI Gate alone still runs without
  # checkout or permissions and fails red for the guarded skips.
  # Decides where the heavy jobs (checks / build-web / test /
  # test-integration) run:
  # the intent-cache runner slots normally, or GitHub-hosted larger runners when every
  # slot is occupied, the fleet is unavailable, or the CI_LINUX_RUNNER_DISABLED
  # repository variable is `true` (ported from intentd's ci.yml route job).
  # Runs on a small GitHub-hosted runner so the burst decision is independent of the
  # slots' queue: probing from a slot would queue behind the very backlog it
  # measures (and deadlock entirely with the slots offline). The probe FAILS
  # OPEN TO GITHUB-HOSTED (gh-linux-8x): on API errors, when no online
  # intent-cache runner is visible, or when an intent-cache job has sat queued
  # past the staleness cutoff, the heavy jobs burst instead of queueing behind
  # an offline fleet — CI must not deadlock when the slots are down. If the job itself fails (runner
  # outage, timeout), the routed jobs are skipped and need a re-run — a
  # deliberate trade-off. The seconds-long jobs (pr-title / conflict-markers
  # / gate) are not routed — they pin directly to ubuntu-24.04. Required
  # test-ct and test-playwright also have fixed hosted runners, but keep
  # route's fail-safe guard.
  route:
    runs-on: ubuntu-24.04
    # Same-repo PRs only (see fork-PR hardening note above); a skip here also
    # skips the routed heavy jobs through their needs.route.result guard.
    # Runs on merge_group (see the trigger comment) — merge groups come from
    # the repo's own ruleset, so no same-repo guard applies there.
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions queue; job-level so the other jobs don't inherit it.
      actions: read
    outputs:
      linux_labels: ${{ steps.decide.outputs.linux_labels }}
      linux_burst: ${{ steps.decide.outputs.linux_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
          LINUX_RUNNER_DISABLED: ${{ vars.CI_LINUX_RUNNER_DISABLED }}
        with:
          # The intent-cache slots serve several repos, so the probe
          # wants to size the queue across all of them — but the default
          # GITHUB_TOKEN is repo-scoped and can only see cloudlands-fe. Set
          # the CI_QUEUE_READ_TOKEN secret (fine-grained PAT with
          # actions:read on the sibling repos) to enable cross-repo counting;
          # without it those repos are skipped and contribute 0. Routing to
          # the slots additionally requires the token to list them: the runners are registered at the ORG level (shared
          # across the repos via a runner group), so the token needs the
          # org-level "Self-hosted runners" read permission for the org
          # list to succeed. The default GITHUB_TOKEN cannot carry that
          # permission, so without a suitably-scoped CI_QUEUE_READ_TOKEN
          # the org list errors and the probe falls back to this repo's own
          # runner list (fine-grained "Administration" repository
          # permission, read) — currently empty, so every run bursts (safe:
          # burst is the fail-open default; it just never uses the slots).
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            // Only the intent-cache slots carry the `intent-cache` label, so no
            // other self-hosted Linux runner picks these jobs up.
            const fleet = ["self-hosted", "linux", "x64", "intent-cache"];
            const hasLabels = (labels) => fleet.every(l => labels.some(x => String(x).toLowerCase() === l));
            // All the routed heavy jobs burst to the 8-core / 32 GB runner:
            // build-web needs well over 8 GB of heap with sourcemaps on
            // (documented OOM history, monorepo#1074), and 32 GB clears its
            // 16 GB Node heap cap comfortably.
            const burst = ["gh-linux-8x"];
            const threshold = parseInt(process.env.THRESHOLD || "2", 10);
            // A self-hosted job queued longer than this has no runner
            // picking it up — treat the fleet as unavailable and burst.
            const staleMs = 15 * 60 * 1000;
            // FAIL OPEN TO BURST: the slots are only selected when the probe
            // positively confirms (a) an online intent-cache runner
            // visible to this repo (org-level list, or the repo-level
            // fallback), (b) no intent-cache job stuck queued past the
            // staleness cutoff, and (c) a free slot (queue depth below both
            // the threshold and the online count). Any probe error — including a token that cannot
            // list runners — routes to burst, so CI cannot queue-deadlock
            // when the fleet is offline or unreadable (mirrors intentd's
            // ci.yml route job).
            let useBurst = true;
            let reason = "fail-open default";
            // CI_LINUX_RUNNER_DISABLED=true forces every heavy job to GitHub-hosted runners.
            if (process.env.LINUX_RUNNER_DISABLED === "true") {
              reason = "disabled for maintenance";
            } else try {
              // The intent-cache fleet is registered at the ORG level (shared
              // across the repos via a runner group), so probe the org
              // runner list first. That call needs the org-level
              // "Self-hosted runners" read permission on the token (see the
              // github-token comment above); when it errors, fall back to
              // the repo-level list, which only sees repo-registered
              // runners (currently none — the degraded mode keeps
              // bursting). An empty list still routes to burst by design
              // (never deadlock on an invisible fleet).
              // NOTE: the org list is NOT scoped to the runner groups this
              // repo can access, so the probe assumes every online
              // intent-cache org runner is in a
              // group visible to this repo. Ops invariant: keep the fleet's
              // group visible to the CI repos, and never register
              // generically-labeled org runners outside it — a matching but
              // inaccessible runner would route jobs onto labels nothing
              // can serve. (Group-scoped listing via the runner-groups API
              // was considered and rejected: it needs extra calls per group
              // and fails on plans without runner-group support, which
              // would silently regress the probe to always-burst.)
              let runners;
              let runnerSource = "org";
              try {
                runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForOrg,
                  { org: context.repo.owner, per_page: 100 }
                );
              } catch (e) {
                core.info(`org runner list failed (${e.message}); falling back to repo-level list`);
                runnerSource = "repo";
                runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForRepo,
                  { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
                );
              }
              const online = runners.filter(r =>
                r.status === "online" &&
                hasLabels((r.labels || []).map(x => x.name))
              );
              if (online.length === 0) {
                reason = `no online intent-cache runner (${runnerSource} list)`;
              } else {
                // Count intent-cache jobs that are queued or running in
                // queued/in-progress runs: a running job occupies a slot just
                // as much as a queued one. GitHub-hosted jobs —
                // including this route job and bursted heavy jobs — don't
                // match the intent-cache label filter, so they never
                // inflate the depth. Sibling-repo probe failures are the
                // documented degraded mode (skip, contribute 0); a failure
                // on this repo's own probe means the depth is unknowable,
                // so it rethrows into the fail-open burst path. A queued
                // job older than staleMs means nothing is draining the
                // queue despite the runner looking online — burst.
                const owner = context.repo.owner;
                const repos = ["intentd", "cloudlands-fe", "intent"];
                let depth = 0;
                let staleQueued = false;
                for (const repo of repos) {
                  try {
                    for (const status of ["queued", "in_progress"]) {
                      const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 20 });
                      for (const run of runs.data.workflow_runs.filter(r => r.id !== context.runId).slice(0, 10)) {
                        const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
                        for (const j of jobs.data.jobs) {
                          if ((j.status === "queued" || j.status === "in_progress") && hasLabels(j.labels || [])) {
                            depth += 1;
                            if (j.status === "queued" && Date.parse(j.created_at) < Date.now() - staleMs) staleQueued = true;
                          }
                        }
                      }
                    }
                  } catch (e) {
                    if (repo === context.repo.repo) throw e;
                    core.info(`queue probe skipped ${repo}: ${e.message}`);
                  }
                }
                if (staleQueued) {
                  reason = `intent-cache job queued past staleness cutoff (fleet not draining) online=${online.length} (${runnerSource} list)`;
                } else {
                  const limit = Math.min(threshold, online.length);
                  useBurst = depth >= limit;
                  reason = `queue depth=${depth} threshold=${limit} online=${online.length} (${runnerSource} list)`;
                }
              }
            } catch (e) {
              useBurst = true;
              reason = `probe failed (${e.message})`;
            }
            core.info(`linux routing: burst=${useBurst} (${reason})`);
            core.setOutput("linux_labels", JSON.stringify(useBurst ? burst : fleet));
            core.setOutput("linux_burst", String(useBurst));

  pr-title:
    name: Validate PR Title
    # Seconds-long job: pinned to the smallest GH-hosted runner rather than
    # routed — not worth a self-hosted slot or a burst decision.
    runs-on: ubuntu-24.04
    # Same-repo PRs only (see fork-PR hardening note above); guarded directly
    # rather than through needs so it isn't delayed behind the route probe.
    # PR-metadata check: pull_request-only, skipped on merge_group (the gate
    # accepts the skip there).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: read
    steps:
      # Intermittent TLS failures reaching api.github.com can kill this action
      # sub-second, before it validates anything — a spurious red that reads
      # like a bad title (intent-hq/monorepo#2098). Tolerate a first-attempt
      # failure and retry once; the retry is authoritative, so a genuinely
      # bad title still fails the job.
      - uses: amannn/action-semantic-pull-request@v6
        id: title_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
      - name: Wait before retrying title validation
        if: steps.title_check.outcome == 'failure'
        run: sleep 15
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.title_check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (ported from intent-hq/intentd#591; the intentd#588
  # incident: release-plz pushed a branch with '<' x7 / '>' x7 marker lines in
  # CHANGELOG.md, Cargo.lock and Cargo.toml, and no check caught it). Matches
  # the exact line forms git emits — seven '<' or '>' followed by a space and
  # a label — and counts a bare seven-'=' line only when the same file also
  # has both of the other two, so Markdown setext headings / code snippets
  # don't false-positive.
  conflict-markers:
    name: Conflict Markers
    # Lightweight job on a standard GitHub-hosted Linux runner.
    runs-on: ubuntu-24.04
    # Same-repo PRs only (see fork-PR hardening note above). PR-diff check:
    # pull_request-only, skipped on merge_group (the gate accepts the skip
    # there).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Release-PR fast path (ported from intentd's ci.yml release-fast-path job;
  # intent-hq/monorepo#1374): release-please PRs change only version strings +
  # changelog (CHANGELOG.md / package.json / .release-please-manifest.json),
  # and intentd sidecar pin bumps (auto-pin-intentd.yml) change only the pin
  # value in intentd.version — in both cases the built/tested code is
  # identical to what main already validated and the heavy jobs (checks /
  # build-web / test / test-integration / test-ct / test-playwright) add no
  # signal — their
  # wall time just delays the release. This job diffs the PR against its base and emits fast_path=true
  # only when the diff has exactly one of those shapes (release: files ⊆
  # {CHANGELOG.md, package.json, .release-please-manifest.json}, pure
  # modifications, and every non-changelog change is a uniform old→new
  # version-string flip; pin bump: intentd.version alone, with nothing but
  # the pin value changed; see scripts/release-pr-fast-path.mjs). The diff
  # shape is the ONLY signal — never branch name or author — so a PR can't
  # spoof its way past the heavy checks: any real code change breaks the shape.
  # Fail-safe, not fail-open: the heavy jobs skip only when the output is
  # exactly 'true' (script error, missing output, or job failure leaves it
  # empty and falls back to full CI), and pr-title / conflict-markers / route
  # / gate still run on every PR. The only required context is "CI Gate"
  # (which always runs), and a job-level skip is safe for every heavy job —
  # including the test and test-ct shard matrices, where skipping the job
  # reports 'skipped' for the whole matrix (no per-leg required contexts
  # exist).
  # The same checkout + base fetch also computes CT relevance: ct_required
  # is 'true' when the PR diff touches a CT-contract path (the one list in
  # scripts/ct-contract-paths.mjs, shared with verify:changed), a CT spec,
  # or a direct local import of a discovered CT spec in either
  # base or head (same module). Fixture changes keep focused local selection
  # but require the hosted suite (see test-ct / gate). Fail-safe the other
  # way round from fast_path: the script prints ct_required=true on any
  # internal error, and the step writes 'true' if the script exits non-zero
  # or prints nothing — a broken relevance check runs CT, never skips it.
  # The job runs on pull_request AND merge_group (see the trigger comment).
  # On merge_group the diff base is merge_group.base_sha: head_sha is the
  # merge of the PR onto the previous entry (or main), so base_sha..head_sha
  # is exactly the entry's own change — the same shape as the pull_request
  # merge ref, so the script needs no event-specific handling (its
  # merge-base fallback covers the shallow checkout either way). ct_required
  # is computed in the queue too, and browser suites execute there.
  # Root and Electron relevance use the same diff and fail-safe behavior.
  release-fast-path:
    name: Release PR Fast Path
    # Lightweight job on a standard GitHub-hosted Linux runner.
    runs-on: ubuntu-24.04
    # Same-repo PRs only (see fork-PR hardening note above); merge groups
    # come from the repo's own ruleset, so no same-repo guard applies there.
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
      ct_required: ${{ steps.ct.outputs.ct_required }}
      root_playwright_required: ${{ steps.root-playwright.outputs.root_playwright_required }}
      electron_required: ${{ steps.electron.outputs.electron_required }}
      portable_fixtures_required: ${{ steps.portable-fixtures.outputs.portable_fixtures_required }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch diff base commit
        # PR base on pull_request; the queue entry's base on merge_group
        # (same fallback as LINT_BASELINE_BASE_REF in test).
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      - name: Evaluate diff shape
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Script contract: prints fast_path=true|false; non-zero exit means
          # no-match. Never fail this step — a broken checker must degrade to
          # full CI, not block the PR.
          out=$(node scripts/release-pr-fast-path.mjs "$BASE_SHA" HEAD) || {
            echo "release-pr-fast-path.mjs exited non-zero — falling back to full CI"
            out="fast_path=false"
          }
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^fast_path=(true|false)$' | tail -n1 || true)
          echo "${line:-fast_path=false}" >> "$GITHUB_OUTPUT"
      - name: Evaluate CT relevance
        id: ct
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Script contract: prints exactly one ct_required=true|false line and
          # always exits 0 (it already reports true on any internal error).
          # Belt and braces here too: a non-zero exit or a missing line also
          # requires CT — a relevance failure must run the suite, never skip it.
          out=$(node scripts/ct-contract-paths.mjs --diff "$BASE_SHA" HEAD) || {
            echo "ct-contract-paths.mjs exited non-zero — requiring CT (fail-safe)"
            out="ct_required=true"
          }
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^ct_required=(true|false)$' | tail -n1 || true)
          echo "${line:-ct_required=true}" >> "$GITHUB_OUTPUT"
      - name: Evaluate root Playwright relevance
        id: root-playwright
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The root suite (playwright.config.ts: test/**/*.spec.ts) is
          # required on merge_group when the diff touches the specs, their
          # fixtures / snapshots / harness helpers (all under test/), the
          # config itself, or the playwright/*-spec-pattern.mjs modules the
          # config reads its testDir/testMatch/testIgnore from (the same set
          # scripts/verify-changed.mjs selects `playwright-full` for). Same
          # base..head diff and flags as ct-contract-paths.mjs. Fail-safe: a
          # git failure requires the suite, never skips it.
          # Keep NUL-delimited paths in a file, never a Bash scalar: otherwise
          # Git quoting or embedded newlines can hide a relevant filename.
          # Node matches whole path records consistently on BSD and GNU hosts.
          changed_paths=$(mktemp)
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --name-only -z --no-renames --diff-filter=ACMD "$BASE_SHA" HEAD > "$changed_paths"; then
            echo "git diff failed — requiring the root Playwright suite (fail-safe)"
            echo "root_playwright_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e 'const fs = require("node:fs"); const paths = fs.readFileSync(process.argv[1], "utf8").split("\0"); const pattern = new RegExp(process.argv[2]); process.exit(paths.some(path => pattern.test(path)) ? 0 : 1);' "$changed_paths" '^(test/|playwright\.config\.ts$|playwright/(app-stubs/|(root|ct)-spec-pattern\.mjs$)|svelte\.config\.js$|package\.json$|pnpm-lock\.yaml$)'; then
            echo "root_playwright_required=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "root_playwright_required=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Evaluate Electron relevance
        id: electron
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Include lifetime, checkout and companion geometry fixtures, the checkout transport,
          # shared harness/config and dependency inputs. --no-renames exposes
          # both sides of a moved test or fixture.
          # Match NUL-separated records without grep's platform-specific anchors.
          changed_paths=$(mktemp)
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --name-only -z --no-renames --diff-filter=ACMD "$BASE_SHA" HEAD > "$changed_paths"; then
            echo "git diff failed — requiring Electron lifetime tests (fail-safe)"
            echo "electron_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e 'const fs = require("node:fs"); const paths = fs.readFileSync(process.argv[1], "utf8").split("\0"); const pattern = new RegExp(process.argv[2]); process.exit(paths.some(path => pattern.test(path)) ? 0 : 1);' "$changed_paths" '^(test/(electron-browser-lifetime[^/]*|fixtures/(browser-lifetime|repository-checkout|dock-placement-native)/|vite-harness-cache\.)|src/(features/backend/main/repository-checkout[^/]*\.ts$|lib/client/live/repository-checkout-transport\.ts$|shared/types/repository-checkout\.ts$|shared/dock-placement\.ts$|main/ipc-schemas\.ts$)|\.github/workflows/(intent-pr|browser-tests)\.yml$|playwright(\.manual)?\.config\.ts$|playwright/(app-stubs/|(root|ct)-spec-pattern\.mjs$)|svelte\.config\.js$|package\.json$|pnpm-lock\.yaml$)'; then
            echo "electron_required=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "electron_required=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Evaluate portable fixture relevance
        id: portable-fixtures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          changed_paths=$(mktemp)
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --name-only -z --no-renames --diff-filter=ACMD "$BASE_SHA" HEAD > "$changed_paths"; then
            echo "portable_fixtures_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -z -E '^(src/features/dev-console/|src/features/backend/main/(backend-connection|__tests__/isolated-test-package)\.test\.ts$|src/main/isolated-test-profile[^/]*\.ts$|src/test/fixtures/isolated-profile-home\.ts$|src/test(-global)?-setup\.ts$|scripts/run-unit-tests\.mjs$|vitest\.config\.ts$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/intent-pr\.yml$)' "$changed_paths" >/dev/null; then
            echo "portable_fixtures_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "portable_fixtures_required=false" >> "$GITHUB_OUTPUT"
          fi

  # Consolidated typecheck + lint job. Previously four separate ubuntu-latest
  # jobs (typecheck-renderer, typecheck-main, typecheck-preload,
  # static-checks); as separate self-hosted jobs each would pay its own
  # checkout + pnpm install (and queue serially in the single-slot era).
  # One job on the 64-core box runs the shared setup once and all checks
  # back-to-back.
  pr-static:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Verify event routing and gate failures without application dependencies
        run: python3 -I -B scripts/test-ci-event-policy.py

  checks:
    name: Type Check & Lint
    # Skipped at job level when the diff is release-PR-shaped (fast_path ==
    # 'true'; see release-fast-path — safe because this is a non-matrix job
    # and only "CI Gate" is a required context). Fail-safe: skips only when
    # the output is exactly 'true'; a release-fast-path failure leaves the
    # output empty and full CI runs. The route.result guard preserves the
    # pre-existing behavior that a route failure skips this job (`!cancelled()`
    # alone would run it without runner labels); the gate still fails on such
    # a skip unless the fast path was taken.
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        id: pnpm_setup
        # Registry timeouts can exhaust the installer's fetch retries before
        # signature verification (intent-hq/intent#6200). Replay setup once;
        # the second attempt must pass the same identity validation and pin.
        continue-on-error: true
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Wait before retrying pnpm setup
        if: steps.pnpm_setup.outcome == 'failure'
        run: sleep 10
      - name: Retry pnpm setup
        if: steps.pnpm_setup.outcome == 'failure'
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        # Every Linux runner (GitHub-hosted or an intent-cache container) starts with
        # an empty pnpm store, so always restore it from the Actions cache.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Cold-checkout gate: runs the agent-facing `lint` gate BEFORE any
      # generate:* step, on exactly the tree a fresh clone (or an interrupted
      # compile) has — no src/shared/paraglide, no src/preload/index.ts, no
      # src/main/build-config.generated.ts. Every gate that needs generated
      # output must self-provision it (hash-gated, idempotent) instead of
      # failing on an unrelated-looking error such as knip's "Unresolved
      # imports (779)" for $shared/paraglide (intent-hq/cloudlands-fe#2368
      # review thread). This is the only `pnpm run lint` step in the job: the
      # ESLint / knip file set is identical before and after generation (ESLint
      # ignores the generated paths via .gitignore + eslint.config.js, knip via
      # gitignore + its `project` excludes; the i18n checks read only
      # messages/*.json and ENFORCED_DIRS), so a post-generation rerun would
      # add wall time without coverage. The Prettier check (`format:check`) is
      # part of this gate too, and the generated paths are Prettier-ignored
      # (.prettierignore plus Prettier's default .gitignore handling), so
      # running it before generation loses no coverage.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 -I -B scripts/test-ci-event-policy.py
      - name: Cold-checkout gates
        run: pnpm run lint
      - name: Generate build config
        run: pnpm run generate:build-config
      - name: Generate IPC channels
        run: pnpm run generate:ipc-channels
      - name: Generate i18n messages
        run: pnpm run generate:i18n
      - name: Svelte check
        # svelte-check holds the whole renderer program in one process. Measured
        # with --trace-gc (intent-hq/intent#5211, 8.1k files): ~3.85 GB live after a
        # full GC, ~4.06 GB committed, peak RSS ~4.3 GiB — identical within 20 MB on
        # main and on the cloudlands-fe#2533 merge tree that OOMed. At the job-wide
        # 4 GB cap V8 sits in its near-limit "reduce" mark-compact loop and aborts on
        # timing, so this step alone gets ~2x the measured need; other steps keep
        # the job cap (intent-hq/intent#3352). Both runner classes (intent-cache,
        # about 48 GB per slot, and the 32 GB burst runner) have ample RAM. run-svelte-check.mjs prints the peak RSS of
        # every run so the margin stays visible before it is exhausted again.
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run check
      - name: Type check (renderer)
        run: pnpm run type-check
      - name: Type check (preload)
        run: pnpm exec tsc --noEmit -p tsconfig.preload.json
      - name: Accessibility lint
        run: bash scripts/check-accessibility.sh
      # Architecture gates are added to `lint:architecture` in package.json (run
      # by both this step and `verify:changed`), never as separate workflow steps.
      - name: Architecture validation
        run: pnpm run validate:architecture
      - name: Build main process
        run: pnpm run build:main
      - name: Verify main process has no devDependency imports
        run: |
          # svelte is a devDependency stripped from packaged builds.
          # Hide it and try importing files reachable from the main-
          # process entry. If any module in the chain transitively
          # resolves 'svelte', Node fails with ERR_MODULE_NOT_FOUND —
          # the same crash that occurs inside the packaged app.asar.
          #
          # We cannot import dist/main/index.js directly because it
          # requires 'electron' (unavailable in plain Node), which may
          # error out *before* the resolver reaches the svelte path,
          # producing a false pass (this is exactly the bug that let
          # PR #654 through). Instead we import the specific service
          # modules that sit on the boundary between the main process
          # and renderer-only dependencies.
          mv node_modules/svelte node_modules/svelte.HIDDEN

          FAILED=0
          for MODULE in \
            dist/features/agent/services/stream-manager.js \
            dist/features/agent/main/consolidated-backend.service.js \
            dist/features/agent/main/agent-backend-handler.service.js; do

            EXIT_CODE=0
            OUTPUT=$(node --input-type=module \
              -e "await import('./$MODULE'); process.exit(0);" \
              2>&1) || EXIT_CODE=$?

            if [ "$EXIT_CODE" -ne 0 ] && grep -q "Cannot find package 'svelte'" <<<"$OUTPUT"; then
              echo "FAIL: $MODULE"
              echo "$OUTPUT" | head -3
              FAILED=1
            fi
          done

          mv node_modules/svelte.HIDDEN node_modules/svelte

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Main-process modules transitively import svelte. This will crash packaged builds."
            exit 1
          fi

          echo "✓ No svelte imports found in main-process module graph."

  build-web:
    name: Build (web)
    # Moved from m1mac to the self-hosted Linux runners so the single-slot
    # Mac is free for release/signing work.
    # Skipped at job level on release-fast-path PRs — see the checks job's
    # comment for the full skip/fail-safe rationale.
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      # The full production renderer build needs more heap than the other
      # jobs; 4096 OOMed, and with sourcemaps the heap flakily grew past
      # the 8192 cap on the old 2-core / 7 GB ubuntu-latest runner
      # (~7.7 GB at death, monorepo#1074), which forced
      # INTENT_DISABLE_SOURCEMAPS=1. Sourcemaps stay enabled everywhere this
      # job routes now: 8192 OOMed on a 64-core self-hosted host (more build
      # work in parallel), so the cap is 16384 — within an intent-cache
      # slot's ~48 GB and the burst runner's 32 GB (never burst this job to
      # anything smaller).
      NODE_OPTIONS: '--max-old-space-size=16384'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web renderer
        run: pnpm run build:web
      - name: Verify web build output
        run: |
          test -f dist/web/index.html || {
            echo "::error::dist/web/index.html missing — web build did not produce the SPA fallback."
            exit 1
          }
          echo "✓ dist/web/index.html present."

  test:
    # Four-way Vitest shard matrix (two-way since intent-hq/monorepo#4260;
    # four-way because each of two legs took ~26 min on an intent-cache heavy
    # slot and ~23 min on gh-linux-8x against the 30-min timeout, runs
    # 39243214256 / 39265196837). The legs route like the other heavy jobs
    # (slots first, hosted overflow). The job ran
    # unsharded while the box had a single runner slot (shards would have
    # queued serially there, each paying its own checkout/install); with two
    # self-hosted slots plus the burst route that rationale is stale, and the
    # unit step is the workflow's long pole (p50 ~7.5 min, p90 ~18 min on
    # the burst runner) against ~0.5 min of per-leg setup. Vitest's
    # --shard=N/4 is a stable partition of the sorted test-file list, so
    # the four legs cover the full suite exactly once (shard-completeness
    # proof in the #4260 follow-up PR). Integration tests moved to the
    # separate unsharded test-integration job so they still run exactly
    # once.
    # Known trade-off: vitest.config.ts caps CI workers per JOB (min(16,
    # cores/2), monorepo#3082), so concurrent legs on one self-hosted host
    # can run a multiple of that fork count (plus the now-concurrent test-integration
    # job). Per-leg wall time halves the exposure window and the 60s CI
    # test timeout gives slack; if #3082-class load flakes reappear, halve
    # the vitest.config.ts worker cap when --shard is in play.
    # Skipped at job level on release-fast-path PRs — see the checks job's
    # comment for the full skip/fail-safe rationale (a job-level skip
    # reports 'skipped' for the whole matrix; no per-leg required contexts
    # exist — "CI Gate" is the only required check).
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    strategy:
      # Let the sibling shard finish so one flaky leg doesn't hide the
      # other leg's results (same rationale as test-ct).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      # Same 4 GB cap as the pre-split job; each leg now accumulates half
      # the per-worker state, so this only gains headroom (the CT jobs'
      # OOM lesson — monorepo#3352 — was a job-wide 8 GB cap, not this).
      NODE_OPTIONS: '--max-old-space-size=4096'
      LINT_BASELINE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      TRANSFER_SELECTION_FIXTURE_ROOT: ${{ github.workspace }}/.cache/transfer-selection-contract/docs/protocol/fixtures/transfer-selection
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python for script regression tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Checkout shared transfer-selection fixtures
        uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: main
          path: .cache/transfer-selection-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/protocol/fixtures/transfer-selection/
            /scripts/
      - name: Fetch baseline comparison commit
        run: |
          if [ -n "$LINT_BASELINE_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$LINT_BASELINE_BASE_REF"
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Read backend Keychain fixture pin
        id: backend-keychain-fixtures
        run: node scripts/backend-keychain-fixtures.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Checkout pinned backend Keychain contract
        uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: ${{ steps.backend-keychain-fixtures.outputs.sourceCommit }}
          path: .cache/backend-keychain-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/protocol/fixtures/backend-keychain/v1/
            /scripts/backend-keychain-contract.mjs
      - name: Verify backend Keychain fixture provenance
        env:
          SOURCE_COMMIT: ${{ steps.backend-keychain-fixtures.outputs.sourceCommit }}
        run: >-
          node .cache/backend-keychain-contract/scripts/backend-keychain-contract.mjs verify
          --source-root .cache/backend-keychain-contract --source-commit "$SOURCE_COMMIT"
          --component cloudlands-fe --component-root .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate IPC channels
        # src/preload/index.ts is gitignored and generated from the preload
        # template + IPC registry (same shape as the generate:i18n steps).
        # The unit suites no longer read it, but each shard regenerates it
        # so a leg never depends on test internals to stay self-contained.
        run: pnpm run generate:ipc-channels
      - name: Unit tests
        run: |
          contract_sha=$(git -C .cache/transfer-selection-contract rev-parse HEAD)
          echo "Transfer selection contract: intent-hq/intent@$contract_sha"
          echo "Transfer selection contract: intent-hq/intent@$contract_sha" >> "$GITHUB_STEP_SUMMARY"
          node scripts/transfer-selection-fixtures.mjs
          pnpm run test:unit --shard=${{ matrix.shard }}/4

  test-portable-fixtures:
    name: Portable Fixtures (macOS ARM64, ${{ matrix.zone.name }})
    needs: [release-fast-path]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.release-fast-path.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' && needs.release-fast-path.outputs.portable_fixtures_required != 'false' }}
    runs-on: macos-26-xlarge
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        zone:
          - { name: UTC, tz: UTC }
          - { name: Los_Angeles, tz: America/Los_Angeles }
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Record native fixture environment
        run: |
          set -euo pipefail
          mkdir -p .cache/portable-fixtures
          {
            git rev-parse HEAD
            sw_vers
            uname -sm
            node --version
            pnpm --version
            printf 'TMPDIR=%s\n' "$TMPDIR"
            ifconfig lo0
          } | tee .cache/portable-fixtures/environment.log
          test "$(uname -m)" = arm64
          test "$(node -p process.arch)" = arm64
          if ifconfig lo0 | grep -E 'inet 127\.0\.0\.2 ' >/dev/null; then
            echo 'Fixture validation requires ordinary loopback without a 127.0.0.2 alias'
            exit 1
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run portable fixture suites
        env:
          TZ: ${{ matrix.zone.tz }}
        run: |
          set -euo pipefail
          printf 'TZ=%s\n' "$TZ" | tee .cache/portable-fixtures/tests.log
          pnpm run test:unit \
            src/features/dev-console/TrafficInspector.test.ts \
            src/features/backend/main/__tests__/isolated-test-package.test.ts \
            src/main/isolated-test-profile.test.ts \
            src/features/backend/main/backend-connection.test.ts \
            --maxWorkers=2 2>&1 | tee -a .cache/portable-fixtures/tests.log
      - name: Retain native fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-fixtures-${{ matrix.zone.name }}-${{ github.run_attempt }}
          path: .cache/portable-fixtures/
          retention-days: 7
          if-no-files-found: error

  test-integration:
    # The integration suite from the pre-split Unit & Integration Tests job
    # (intent-hq/monorepo#4260): unsharded, runs exactly once. Kept as its
    # own routed job rather than a step on a unit shard so neither leg is
    # asymmetrically longer and a unit-shard flake can't hide integration
    # results. The suite itself is short (~1 min); setup dominates.
    # MERGE-QUEUE-ONLY (see the trigger comment): skipped on pull_request
    # — the gate accepts that skip unconditionally — and run only on
    # merge_group, where the gate requires success EXCEPT on a
    # release-shaped entry (fast_path == 'true'), whose job-level skip the
    # gate accepts via that output. The route.result guard is kept so a
    # route failure still skips the job (and fails the gate in the queue:
    # fail-safe).
    name: Integration Tests
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate i18n messages
        # The integration vitest config has no paraglideVitePlugin (unlike
        # vitest.config.ts, whose plugin writes src/shared/paraglide as a
        # side effect); the pre-split job got the compiled messages from
        # the unit step running first in the same checkout. Standalone,
        # the job must compile them explicitly.
        run: pnpm run generate:i18n
      - name: Integration tests
        run: pnpm run test:integration

  # Browser suites run selectively on PRs; nightly-browser-tests.yml runs all.
  # Keep route as a direct guard so failed routing and fork PRs stay fail-safe.
  test-ct:
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.release-fast-path.outputs.ct_required == 'true' && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: ct

  test-playwright:
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.release-fast-path.outputs.root_playwright_required == 'true' && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: root

  test-electron:
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.release-fast-path.outputs.electron_required == 'true' && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: electron

  # Monorepo consumer checks (intent-hq/intent#4558, #5479, #5489, #5497):
  # the monorepo's docs-check job compares the pinned submodules against
  # docs/protocol/ (method catalog, event catalog, protocol→FE field parity,
  # docs-check, check-makefile-targets), so a cloudlands-fe change that
  # breaks one of those turned monorepo main red — or stalled the rolling
  # auto/submodule-bump PR — only after it had merged here. This calls the
  # monorepo's reusable workflow, which runs the same runner
  # (scripts/consumer-checks.sh) with THIS PR head in place of the
  # packages/cloudlands-fe pin, so the breakage is red on the PR first. Fix
  # order when red: the checks compare against monorepo main and tolerate
  # docs that lead the pin, so land the monorepo docs PR its step summary
  # names, then re-run all jobs or push (re-running only failed jobs keeps
  # the monorepo commit `@main` resolved to on the first attempt). Keep
  # `@main`: a SHA pin also pins those docs, so a docs-first fix needed a
  # hand pin bump (intent-hq/intentd#2476). check-mcp-bindings is advisory in the
  # called workflow, and a failed monorepo checkout is fail-soft there
  # (warning, job green), so a monorepo outage never blocks this repo.
  # Runs on pull_request AND merge_group; the caller's own `if:` carries
  # the same-repo guard (fork-PR hardening note). Actions-read permission and
  # the declared routing/cache secrets support the shared runner routing and
  # queue-only connected runtime proof; PRs run static consumer checks.
  monorepo-consumer-checks:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
      INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
    uses: intent-hq/intent/.github/workflows/consumer-checks.yml@main
    with:
      component: cloudlands-fe
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # CI Gate is the required context on both events. PRs require metadata,
  # static consumer contracts and routing policy. Queue entries require builds,
  # tests and every relevant browser/native suite. Only validated release-only
  # diffs or explicit irrelevant-path outputs can skip queued work. Route and
  # classification failures never authorize skips. Forks get a red gate.
  gate:
    name: CI Gate
    # Lightweight job on a standard GitHub-hosted Linux runner.
    runs-on: ubuntu-24.04
    permissions: {}
    # Deliberately UNGUARDED (the one exception to the fork-PR hardening
    # note): a job skipped by its own `if:` reports a skipped conclusion,
    # which SATISFIES a required status check — a skipped gate would leave a
    # fork PR mergeable, resting the hardening entirely on close-fork-prs.yml.
    # Instead the gate always runs (it has permissions:{}, no checkout, and
    # executes no fork code, so this is safe): on fork PRs the needed jobs
    # are skipped by their guards, so the required "CI Gate" context fails
    # naturally — a red fail-safe backstop even if the close workflow is
    # disabled, delayed, or fails.
    if: always()
    needs:
      [
        route,
        release-fast-path,
        pr-static,
        pr-title,
        conflict-markers,
        checks,
        build-web,
        test,
        test-integration,
        test-portable-fixtures,
        test-ct,
        test-playwright,
        test-electron,
        monorepo-consumer-checks,
      ]
    steps:
      - name: Check results
        env:
          FAST_PATH: ${{ needs.release-fast-path.outputs.fast_path }}
          PORTABLE_FIXTURES_REQUIRED: ${{ needs.release-fast-path.outputs.portable_fixtures_required }}
          CT_REQUIRED: ${{ needs.release-fast-path.outputs.ct_required }}
          ROOT_PLAYWRIGHT_REQUIRED: ${{ needs.release-fast-path.outputs.root_playwright_required }}
          ELECTRON_REQUIRED: ${{ needs.release-fast-path.outputs.electron_required }}
        run: |
          # route must have succeeded on every run (see the gate comment): a
          # route failure skips the heavy jobs, and a fast-path skip
          # acceptance must never stand in for that. Fork PRs skip route and
          # fail here — still red, as required.
          if [ "${{ needs.route.result }}" != "success" ]; then
            echo "route result '${{ needs.route.result }}' not acceptable — the heavy jobs cannot have run (fast_path='$FAST_PATH')"
            exit 1
          fi
          if [ "${{ needs.release-fast-path.result }}" != "success" ]; then
            echo "release-fast-path must succeed so skips are backed by a classified diff"
            exit 1
          fi
          # pr-title / conflict-markers are PR-metadata checks that only run
          # on pull_request; on merge_group they skip (already validated on
          # the PR) and the gate accepts that.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            check_pr_meta() {
              if [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
                echo "$1 result '$2' not acceptable on merge_group"
                exit 1
              fi
            }
          else
            check_pr_meta() {
              if [ "$2" != "success" ]; then
                echo "$1 result '$2' not acceptable"
                exit 1
              fi
            }
          fi
          check_pr_meta "pr-title" "${{ needs.pr-title.result }}"
          check_pr_meta "conflict-markers" "${{ needs.conflict-markers.result }}"
          # Heavy jobs required on this event: success, or skipped ONLY via the
          # release-PR fast path. Shared by the PR suites and the queue jobs.
          check_heavy() {
            if [ "$2" = "success" ]; then
              return 0
            fi
            if [ "$2" = "skipped" ] && [ "$FAST_PATH" = "true" ]; then
              echo "$1 skipped via release-PR fast path — accepted"
              return 0
            fi
            echo "$1 result '$2' not acceptable on ${{ github.event_name }} (fast_path='$FAST_PATH')"
            exit 1
          }
          # PRs run the Linux policy job, static consumer contracts, type/lint
          # and unit tests before queueing. Type/lint and unit tests may skip
          # only via the release-PR fast path; the remaining heavy jobs are
          # queue-only. Failed/missing results are never intentional skips.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            check_pr_meta "pr-static" "${{ needs.pr-static.result }}"
            check_pr_meta "monorepo-consumer-checks" "${{ needs.monorepo-consumer-checks.result }}"
            check_heavy "checks" "${{ needs.checks.result }}"
            check_heavy "test" "${{ needs.test.result }}"
            case "${{ needs.build-web.result }}" in success|skipped) ;; *) exit 1 ;; esac
            case "${{ needs.test-portable-fixtures.result }}" in success|skipped) ;; *) exit 1 ;; esac
            case "${{ needs.test-ct.result }}" in success|skipped) ;; *) exit 1 ;; esac
            case "${{ needs.test-playwright.result }}" in success|skipped) ;; *) exit 1 ;; esac
            case "${{ needs.test-electron.result }}" in success|skipped) ;; *) exit 1 ;; esac
            case "${{ needs.test-integration.result }}" in success|skipped) ;; *) exit 1 ;; esac
            exit 0
          fi
          case "${{ needs.pr-static.result }}" in success|skipped) ;; *) exit 1 ;; esac
          # Queued heavy jobs (checks / build-web / test): success, or
          # skipped ONLY via the release-PR fast path (check_heavy above).
          check_heavy "checks" "${{ needs.checks.result }}"
          check_heavy "build-web" "${{ needs.build-web.result }}"
          check_heavy "test" "${{ needs.test.result }}"
          # Native fixture validation runs on relevant queue entries.
          # Missing classification or an unexpected skip must not certify portability.
          if [ "$PORTABLE_FIXTURES_REQUIRED" != "true" ] && [ "$PORTABLE_FIXTURES_REQUIRED" != "false" ]; then
            echo "portable fixture relevance is missing or invalid"
            exit 1
          fi
          portable_result="${{ needs.test-portable-fixtures.result }}"
          if [ "$portable_result" != "success" ]; then
            if [ "$portable_result" != "skipped" ] || { [ "$FAST_PATH" != "true" ] && [ "$PORTABLE_FIXTURES_REQUIRED" != "false" ]; }; then
              echo "portable fixtures result '$portable_result' not acceptable"
              exit 1
            fi
          fi
          check_heavy "test-integration" "${{ needs.test-integration.result }}"
          # Queue classification must be present even when a job reports success.
          check_browser() {
            if [ "$3" != "true" ] && [ "$3" != "false" ]; then
              echo "$1 relevance output '$3' is missing or invalid"
              exit 1
            fi
            if [ "$2" = "success" ]; then return 0; fi
            if [ "$2" = "skipped" ] && { [ "$FAST_PATH" = "true" ] || [ "$3" = "false" ]; }; then
              echo "$1 skipped via release fast path or irrelevant diff — accepted"
              return 0
            fi
            echo "$1 result '$2' not acceptable (required='$3', fast_path='$FAST_PATH')"
            exit 1
          }
          check_browser "test-ct" "${{ needs.test-ct.result }}" "$CT_REQUIRED"
          check_browser "test-playwright" "${{ needs.test-playwright.result }}" "$ROOT_PLAYWRIGHT_REQUIRED"
          check_browser "test-electron" "${{ needs.test-electron.result }}" "$ELECTRON_REQUIRED"
          # monorepo-consumer-checks: success outright on both events (see
          # the gate comment) — no fast-path or event-based skip acceptance.
          if [ "${{ needs.monorepo-consumer-checks.result }}" != "success" ]; then
            echo "monorepo-consumer-checks result '${{ needs.monorepo-consumer-checks.result }}' not acceptable"
            exit 1
          fi
