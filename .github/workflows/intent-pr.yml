name: Intent PR Checks

on:
  pull_request:
    branches: ['main']

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Burst the heavy jobs to GH-hosted larger runners when more than this many
  # self-hosted Linux jobs are queued/running ahead of this run (see the route
  # job). Jobs still blocked on `needs` are invisible to the jobs API, so a
  # queued run ahead of us may undercount — with 8 tinybox slots, clearing
  # this threshold means every slot is occupied and a genuine backlog is
  # queued behind them. Bursted jobs don't carry the self-hosted+Linux
  # labels and stop counting toward the depth, so the system naturally falls
  # back to tinybox as it frees up.
  LINUX_BURST_THRESHOLD: 8

jobs:
  # Decides where the heavy jobs (checks / build-web / test) run: the local
  # tinybox runner normally, or GH-hosted larger runners when the tinybox
  # queue is backed up (ported from intentd's ci.yml route job). Runs on a
  # small GH-hosted runner so the burst decision is independent of the
  # tinybox queue: probing from tinybox would queue behind the very backlog
  # it measures (and deadlock entirely with tinybox offline). The probe fails
  # open to tinybox on API errors; if the job itself fails (runner outage,
  # timeout), the routed jobs are skipped and need a re-run — a deliberate
  # trade-off. The seconds-long jobs (pr-title / conflict-markers / gate) are
  # not routed — they pin directly to ubuntu-latest.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions queue; job-level so the other jobs don't inherit it.
      actions: read
    outputs:
      linux_labels: ${{ steps.decide.outputs.linux_labels }}
      linux_burst: ${{ steps.decide.outputs.linux_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
        with:
          # tinybox serves several repos on one runner slot, so the probe
          # wants to size the queue across all of them — but the default
          # GITHUB_TOKEN is repo-scoped and can only see cloudlands-fe. Set
          # the CI_QUEUE_READ_TOKEN secret (fine-grained PAT with
          # actions:read on the sibling repos) to enable cross-repo counting;
          # without it those repos are skipped and contribute 0.
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            const tinybox = ["self-hosted", "Linux", "X64"];
            // All three heavy jobs burst to the 8-core / 32 GB runner:
            // build-web needs well over 8 GB of heap with sourcemaps on
            // (documented OOM history, monorepo#1074), and 32 GB clears its
            // 16 GB Node heap cap comfortably.
            const burst = ["gh-linux-8x"];
            const threshold = parseInt(process.env.THRESHOLD || "8", 10);
            // Count self-hosted Linux jobs that are queued or running in
            // queued/in-progress runs: a running job occupies a tinybox
            // slot just as much as a queued one. GH-hosted jobs —
            // including this route job and bursted heavy jobs — don't match
            // the self-hosted+Linux label filter, so they never inflate the
            // depth.
            const owner = context.repo.owner;
            const repos = ["intentd", "cloudlands-fe", "monorepo"];
            let depth = 0;
            for (const repo of repos) {
              try {
                for (const status of ["queued", "in_progress"]) {
                  const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 20 });
                  for (const run of runs.data.workflow_runs.filter(r => r.id !== context.runId).slice(0, 10)) {
                    const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
                    depth += jobs.data.jobs.filter(j => (j.status === "queued" || j.status === "in_progress") && j.labels.includes("self-hosted") && j.labels.includes("Linux")).length;
                  }
                }
              } catch (e) {
                core.info(`queue probe skipped ${repo}: ${e.message}`);
              }
            }
            const useBurst = depth > threshold;
            core.info(`linux queue depth=${depth} threshold=${threshold} burst=${useBurst}`);
            core.setOutput("linux_labels", JSON.stringify(useBurst ? burst : tinybox));
            core.setOutput("linux_burst", String(useBurst));

  pr-title:
    name: Validate PR Title
    # Seconds-long job: pinned to the smallest GH-hosted runner rather than
    # routed — not worth a tinybox slot or a burst decision.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Intermittent TLS failures reaching api.github.com can kill this action
      # sub-second, before it validates anything — a spurious red that reads
      # like a bad title (intent-hq/monorepo#2098). Tolerate a first-attempt
      # failure and retry once; the retry is authoritative, so a genuinely
      # bad title still fails the job.
      - uses: amannn/action-semantic-pull-request@v6
        id: title_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
      - name: Wait before retrying title validation
        if: steps.title_check.outcome == 'failure'
        run: sleep 15
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.title_check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (ported from intent-hq/intentd#591; the intentd#588
  # incident: release-plz pushed a branch with '<' x7 / '>' x7 marker lines in
  # CHANGELOG.md, Cargo.lock and Cargo.toml, and no check caught it). Matches
  # the exact line forms git emits — seven '<' or '>' followed by a space and
  # a label — and counts a bare seven-'=' line only when the same file also
  # has both of the other two, so Markdown setext headings / code snippets
  # don't false-positive.
  conflict-markers:
    name: Conflict Markers
    # Seconds-long job: pinned to ubuntu-latest (see pr-title).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Release-PR fast path (ported from intentd's ci.yml release-fast-path job;
  # intent-hq/monorepo#1374): release-please PRs change only version strings +
  # changelog (CHANGELOG.md / package.json / .release-please-manifest.json),
  # so the built/tested code is identical to what main already validated and
  # the heavy jobs (checks / build-web / test) add no signal — their wall time
  # just delays the release. This job diffs the PR against its base and emits
  # fast_path=true only when the diff has exactly the release shape (files ⊆
  # {CHANGELOG.md, package.json, .release-please-manifest.json}, pure
  # modifications, and every non-changelog change is a uniform old→new
  # version-string flip; see scripts/release-pr-fast-path.mjs). The diff shape
  # is the ONLY signal — never branch name or author — so a PR can't spoof its
  # way past the heavy checks: any real code change breaks the shape.
  # Fail-safe, not fail-open: the heavy jobs skip only when the output is
  # exactly 'true' (script error, missing output, or job failure leaves it
  # empty and falls back to full CI), and pr-title / conflict-markers / route
  # / gate still run on every PR. Unlike intentd's matrix build job, all three
  # heavy jobs here are non-matrix and the only required context is "CI Gate"
  # (which always runs), so a job-level skip is safe.
  release-fast-path:
    name: Release PR Fast Path
    # Seconds-long job: pinned to ubuntu-latest (see pr-title).
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Evaluate diff shape
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Script contract: prints fast_path=true|false; non-zero exit means
          # no-match. Never fail this step — a broken checker must degrade to
          # full CI, not block the PR.
          out=$(node scripts/release-pr-fast-path.mjs "$BASE_SHA" HEAD) || {
            echo "release-pr-fast-path.mjs exited non-zero — falling back to full CI"
            out="fast_path=false"
          }
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^fast_path=(true|false)$' | tail -n1 || true)
          echo "${line:-fast_path=false}" >> "$GITHUB_OUTPUT"

  # Consolidated typecheck + lint job. Previously four separate ubuntu-latest
  # jobs (typecheck-renderer, typecheck-main, typecheck-preload,
  # static-checks); as separate self-hosted jobs each would pay its own
  # checkout + pnpm install (and queue serially in the single-slot era).
  # One job on the 64-core box runs the shared setup once and all checks
  # back-to-back.
  checks:
    name: Type Check & Lint
    # Skipped at job level when the diff is release-PR-shaped (fast_path ==
    # 'true'; see release-fast-path — safe because this is a non-matrix job
    # and only "CI Gate" is a required context). Fail-safe: skips only when
    # the output is exactly 'true'; a release-fast-path failure leaves the
    # output empty and full CI runs. The route.result guard preserves the
    # pre-existing behavior that a route failure skips this job (`!cancelled()`
    # alone would run it without runner labels); the gate still fails on such
    # a skip unless the fast path was taken.
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
          # Per-runner-instance dest: concurrent tinybox slots share $HOME and
          # race on the default ~/setup-pnpm (monorepo#1239).
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: Setup Node.js
        # cache: 'pnpm' only on the burst path — ephemeral GH-hosted runners
        # start cold, while tinybox's persistent pnpm store makes the GH
        # Actions cache tarball round-trip pure overhead (burst-gated, like
        # intentd's rust-cache pattern).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ needs.route.outputs.linux_burst == 'true' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate build config
        run: pnpm run generate:build-config
      - name: Generate IPC channels
        run: pnpm run generate:ipc-channels
      - name: Generate i18n messages
        run: pnpm run generate:i18n
      - name: Svelte check
        run: pnpm run check
      - name: Type check (renderer)
        run: pnpm run type-check
      - name: Type check (preload)
        run: pnpm exec tsc --noEmit -p tsconfig.preload.json
      - name: ESLint
        run: pnpm run lint
      - name: Accessibility lint
        run: bash scripts/check-accessibility.sh
      - name: workspace:* dispatcher gate
        run: node scripts/check-workspace-event-dispatchers.mjs
      - name: Architecture validation
        run: pnpm run validate:architecture
      - name: Build main process
        run: pnpm run build:main
      - name: Verify main process has no devDependency imports
        run: |
          # svelte is a devDependency stripped from packaged builds.
          # Hide it and try importing files reachable from the main-
          # process entry. If any module in the chain transitively
          # resolves 'svelte', Node fails with ERR_MODULE_NOT_FOUND —
          # the same crash that occurs inside the packaged app.asar.
          #
          # We cannot import dist/main/index.js directly because it
          # requires 'electron' (unavailable in plain Node), which may
          # error out *before* the resolver reaches the svelte path,
          # producing a false pass (this is exactly the bug that let
          # PR #654 through). Instead we import the specific service
          # modules that sit on the boundary between the main process
          # and renderer-only dependencies.
          mv node_modules/svelte node_modules/svelte.HIDDEN

          FAILED=0
          for MODULE in \
            dist/features/agent/services/stream-manager.js \
            dist/features/agent/main/consolidated-backend.service.js \
            dist/features/agent/main/agent-backend-handler.service.js; do

            EXIT_CODE=0
            OUTPUT=$(node --input-type=module \
              -e "await import('./$MODULE'); process.exit(0);" \
              2>&1) || EXIT_CODE=$?

            if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "Cannot find package 'svelte'"; then
              echo "FAIL: $MODULE"
              echo "$OUTPUT" | head -3
              FAILED=1
            fi
          done

          mv node_modules/svelte.HIDDEN node_modules/svelte

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Main-process modules transitively import svelte. This will crash packaged builds."
            exit 1
          fi

          echo "✓ No svelte imports found in main-process module graph."

  build-web:
    name: Build (web)
    # Moved from m1mac to the self-hosted Linux runner (tinybox, 64 cores /
    # 125 GB) so the single-slot Mac is free for release/signing work.
    # Skipped at job level on release-fast-path PRs — see the checks job's
    # comment for the full skip/fail-safe rationale.
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      # The full production renderer build needs more heap than the other
      # jobs; 4096 OOMed, and with sourcemaps the heap flakily grew past
      # the 8192 cap on the old 2-core / 7 GB ubuntu-latest runner
      # (~7.7 GB at death, monorepo#1074), which forced
      # INTENT_DISABLE_SOURCEMAPS=1. Sourcemaps stay enabled everywhere this
      # job routes now: 8192 OOMed even on the 125 GB tinybox (the 64-core
      # box runs more build work in parallel), so the cap is 16384 — within
      # tinybox's RAM and the burst runner's 32 GB (gh-linux-8x; never burst
      # this job to anything smaller).
      NODE_OPTIONS: '--max-old-space-size=16384'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
          # Per-runner-instance dest (see checks).
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: Setup Node.js
        # cache: 'pnpm' only on the burst path (see checks).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ needs.route.outputs.linux_burst == 'true' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web renderer
        run: pnpm run build:web
      - name: Verify web build output
        run: |
          test -f dist/web/index.html || {
            echo "::error::dist/web/index.html missing — web build did not produce the SPA fallback."
            exit 1
          }
          echo "✓ dist/web/index.html present."

  test:
    # Unsharded on the self-hosted Linux runner (tinybox): shards would each
    # pay their own checkout/install overhead (and queued serially in the
    # single-slot era), so one job stays cheaper — vitest parallelism uses
    # the 64 cores within the single job.
    # Skipped at job level on release-fast-path PRs — see the checks job's
    # comment for the full skip/fail-safe rationale.
    name: Unit & Integration Tests
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
          # Per-runner-instance dest (see checks).
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: Setup Node.js
        # cache: 'pnpm' only on the burst path (see checks).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ needs.route.outputs.linux_burst == 'true' && 'pnpm' || '' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit
      - name: Integration tests
        run: pnpm run test:integration

  # Playwright component tests (*.ct.spec.ts via playwright-ct.config.ts;
  # monorepo#2091). Pinned to ubuntu-latest rather than routed: browser
  # provisioning needs `playwright install --with-deps` (sudo apt), which the
  # self-hosted tinybox runner doesn't offer. The suite has grown to ~350
  # tests across ~56 files running serially (workers: 1 on CI — deliberate),
  # so a single job straddled the 30-min budget (monorepo#2887); it is split
  # into a 2-way shard matrix instead (Playwright shards by file), putting
  # each leg at roughly half the serial runtime. Browsers are installed
  # via the run-ct-tests.mjs launcher so their version matches the CT-aligned
  # playwright runner (1.58.x, NOT the repo's top-level playwright — see
  # monorepo#1586), and the binary cache is keyed on that same version.
  # Skipped at job level on release-fast-path PRs — see the checks job's
  # comment for the full skip/fail-safe rationale.
  test-ct:
    name: Component Tests (shard ${{ matrix.shard }}/2)
    needs: [release-fast-path]
    if: ${{ !cancelled() && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # Let the sibling shard finish so one flaky leg doesn't hide the other
      # leg's result.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Per-shard budget: a healthy leg runs ~9-13 min (half of the ~18-26 min
    # serial suite), so 30 min leaves >2x headroom for retry bursts and slow
    # runners.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
      # The full CT Vite bundle transforms more than 7,400 modules and needs
      # headroom while Rollup renders chunks.
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        # Always GH-hosted (never tinybox), so the pnpm cache is always
        # worthwhile — unlike the routed jobs' burst-gated cache.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate i18n messages
        # The CT bundle imports paraglide messages; the compiled output is
        # gitignored. (build-config / ipc-channels are main-process-only and
        # not needed by the CT vite build.)
        run: pnpm run generate:i18n
      - name: Resolve CT playwright version
        id: ct-playwright
        run: echo "version=$(node scripts/run-ct-tests.mjs --print-playwright-version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.ct-playwright.outputs.version }}
      - name: Harden apt against mirror stalls
        # The runner image prefers the azure.archive.ubuntu.com mirror, which
        # has stalled mid-transfer until the 30-min job budget expired —
        # twice, before any test ran (monorepo#2832). The image routes apt
        # through mirror+file indirection (/etc/apt/sources.list.d/*.sources
        # says mirror+file:/etc/apt/apt-mirrors.txt; the azure hostname lives
        # ONLY in that mirror list), so drop the azure entry from the list —
        # the canonical archive.ubuntu.com + security.ubuntu.com fallbacks
        # remain. The plain-hostname rewrite over the sources files is kept
        # as a fail-safe in case a future image drops the indirection. Also
        # bound every fetch: without an explicit Acquire timeout a
        # dead-but-open connection can hang apt indefinitely — and the second
        # recorded hang was on archive.ubuntu.com itself, so the timeout (not
        # the mirror swap) is the load-bearing bound. Belt-and-braces with
        # the step timeout below.
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "apt-mirrors.txt now:" && cat /etc/apt/apt-mirrors.txt
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"
          done
          if grep -Rq 'azure\.archive\.ubuntu\.com' /etc/apt; then
            echo "::warning::azure.archive.ubuntu.com still referenced under /etc/apt — mirror swap ineffective (Acquire bounds still apply)"
          fi
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-bounded-acquire >/dev/null
      - name: Install Playwright browsers
        # --with-deps runs even on a cache hit (OS packages aren't cached),
        # but the browser download itself is skipped when already present.
        # Step-level timeout so an apt/download stall the Acquire bounds
        # somehow miss fails here in minutes — with logs attributing the
        # failure to this step — instead of eating the 30-min job budget
        # (monorepo#2832). Normal runs take ~1-2 min.
        timeout-minutes: 8
        run: node scripts/run-ct-tests.mjs --install-browsers --with-deps chromium
      - name: Component tests
        # list for readable logs; html feeds the failure artifact below (it
        # never auto-opens when CI is set).
        run: pnpm run test:ct --shard=${{ matrix.shard }}/2 --reporter=list,html
      - name: Upload playwright report
        # Also on cancellation, so a timeout overrun still leaves the report
        # and traces behind for diagnosis (monorepo#2887).
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ct-report-${{ matrix.shard }}-of-2
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single required status check for branch protection: fans in pr-title,
  # conflict-markers, and the heavy jobs (checks / build-web / test /
  # test-ct). pr-title / conflict-markers must succeed outright on every PR.
  # The heavy jobs must succeed outright too, EXCEPT on release-fast-path PRs
  # (fast_path == 'true'), where their job-level skip is the expected outcome
  # (see release-fast-path). The acceptance keys on the fast-path OUTPUT —
  # never on the skipped status itself — so a skip from any other cause (a
  # route failure, or a failed release-fast-path job leaving the output
  # empty) still fails the gate: fail-safe, not fail-open (mirrors intentd's
  # event/shape-aware gate reasoning, adapted to this workflow's
  # pull_request-only trigger). test-ct is a shard matrix: its needs.result
  # aggregates the legs (success only when every shard passes; a job-level
  # skip reports 'skipped' for the whole matrix, same as before).
  gate:
    name: CI Gate
    # Seconds-long job: pinned to ubuntu-latest (see pr-title).
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    needs: [release-fast-path, pr-title, conflict-markers, checks, build-web, test, test-ct]
    steps:
      - name: Check results
        env:
          FAST_PATH: ${{ needs.release-fast-path.outputs.fast_path }}
        run: |
          if [ "${{ needs.pr-title.result }}" != "success" ] || \
             [ "${{ needs.conflict-markers.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Heavy jobs: success, or skipped ONLY via the release-PR fast path.
          check_heavy() {
            if [ "$2" = "success" ]; then
              return 0
            fi
            if [ "$2" = "skipped" ] && [ "$FAST_PATH" = "true" ]; then
              echo "$1 skipped via release-PR fast path — accepted"
              return 0
            fi
            echo "$1 result '$2' not acceptable (fast_path='$FAST_PATH')"
            exit 1
          }
          check_heavy "checks" "${{ needs.checks.result }}"
          check_heavy "build-web" "${{ needs.build-web.result }}"
          check_heavy "test" "${{ needs.test.result }}"
          check_heavy "test-ct" "${{ needs.test-ct.result }}"
