# ==========================================================================
# DEPRECATED: This workflow is superseded by intent-app-release.yml.
# Do NOT use this workflow for new releases. It is retained for reference
# only and will be removed in a future cleanup.
# ==========================================================================

name: "[DEPRECATED] Intent - Build and Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.3)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      skip_upload:
        description: 'Skip upload to CDN'
        required: false
        default: false
        type: boolean

# Ensure only one release workflow runs at a time
concurrency:
  group: intent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Build macOS (arm64 universal build with code signing & notarization)
  # ==========================================================================
  build-macos:
    runs-on: macos-14 # Apple Silicon runner for faster builds
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm run version:set -- ${{ inputs.version }}

      - name: Create .env file
        run: |
          cat > .env << EOF
          SENTRY_DSN="${{ secrets.INTENT_SENTRY_DSN }}"
          SENTRY_RELEASE="intent@${{ inputs.version }}"
          SENTRY_AUTH_TOKEN="${{ secrets.INTENT_SENTRY_AUTH_TOKEN }}"
          SEGMENT_WRITE_KEY="${{ secrets.INTENT_SEGMENT_WRITE_KEY }}"
          EOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ inputs.version }}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import code signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.INTENT_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.INTENT_MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.INTENT_KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build and package macOS app
        run: npm run dist:mac
        env:
          # Increase Node.js memory limit for large builds
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Code signing
          CSC_LINK: ${{ secrets.INTENT_MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.INTENT_MACOS_CERTIFICATE_PWD }}
          # Notarization
          APPLE_ID: ${{ secrets.INTENT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.INTENT_APPLE_APP_SPECIFIC_PASSWORD_V2 }}
          APPLE_TEAM_ID: ${{ secrets.INTENT_APPLE_TEAM_ID }}
          # GitHub token for electron-builder
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        run: npm run generate:release-notes
        continue-on-error: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.yml
            dist-electron/release-notes*.json
          retention-days: 30

  # ==========================================================================
  # Upload to CDN (GCP primary + AWS migration)
  # ==========================================================================
  upload:
    needs: build-macos
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_upload }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist-electron

      - name: List artifacts
        run: ls -la dist-electron/

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.INTENT_GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INTENT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INTENT_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.INTENT_AWS_REGION }}

      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "channel=${{ inputs.channel }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == *"-beta"* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == *"-alpha"* ]]; then
            echo "channel=alpha" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

      - name: Upload to CDN
        run: bash scripts/upload-release.sh ${{ steps.channel.outputs.channel }}
        env:
          # Version override (package.json not updated in this job)
          RELEASE_VERSION: ${{ inputs.version }}
          # GCP
          GCS_BUCKET: ${{ secrets.INTENT_GCS_BUCKET }}
          GCP_PROJECT: ${{ secrets.INTENT_GCP_PROJECT }}
          CLOUD_CDN_URL_MAP: ${{ secrets.INTENT_CLOUD_CDN_URL_MAP }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          # AWS (for migration)
          AWS_REGION: ${{ secrets.INTENT_AWS_REGION }}
          S3_BUCKET: ${{ secrets.INTENT_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.INTENT_CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Upload summary
        run: |
          VERSION="${{ inputs.version }}"
          CHANNEL=${{ steps.channel.outputs.channel }}
          echo "## 🚀 Release Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Channel:** $CHANNEL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download URLs" >> $GITHUB_STEP_SUMMARY
          echo "- [Apple Silicon Mac](https://cdn.augmentcode.com/$CHANNEL/Intent-latest-arm64.dmg)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: dist-macos

      - name: Notify Slack
        if: success()
        run: |
          VERSION="${{ inputs.version }}"
          CHANNEL=${{ steps.channel.outputs.channel }}
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ Intent v${VERSION} released to ${CHANNEL} channel\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*✅ Intent Release Successful*\n\n*Version:* v${VERSION}\n*Channel:* ${CHANNEL}\n*Triggered by:* ${{ github.actor }}\"
                  }
                }
              ]
            }" \
            ${{ secrets.INTENT_SLACK_WEBHOOK_URL }}
