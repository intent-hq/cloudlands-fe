name: Intent Smoke Tests

on:
  workflow_dispatch:
    inputs:
      build_source:
        description: 'Where to get the app build'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - cdn
      cdn_channel:
        description: 'CDN channel (only used when build_source=cdn)'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - stable
  workflow_call:
    inputs:
      build_source:
        description: 'Where to get the app build'
        required: true
        type: string
      cdn_channel:
        description: 'CDN channel (only used when build_source=cdn)'
        required: false
        default: 'alpha'
        type: string

concurrency:
  group: intent-smoke-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: inputs.build_source != 'cdn'
    runs-on: macos-14
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore node_modules cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules cache
        if: success() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Compute build cache key
        id: build-cache-key
        run: |
          echo "hash=${{ hashFiles('src/main/**', 'src/preload/**', 'src/lib/**', 'src/features/**', 'src/routes/**', 'src/shared/**', 'src/types/**', 'src/utils/**', 'src/assets/**', 'src/app.*', 'src/hooks.client.ts', 'src/tailwind-references.css', 'package.json', 'package-lock.json', 'electron-builder.yml', 'vite.config.mjs', 'postcss.config.mjs', 'tsconfig*.json', 'svelte.config.js', 'tailwind.config.js', 'build/**', 'static/**', 'resources/**') }}" >> $GITHUB_OUTPUT

      - name: Restore Electron build cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: dist-electron/
          key: electron-build-${{ runner.os }}-${{ steps.build-cache-key.outputs.hash }}

      - name: Build packaged app
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac

      - name: Save Electron build cache
        if: success() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-electron/
          key: electron-build-${{ runner.os }}-${{ steps.build-cache-key.outputs.hash }}

      - name: Upload Electron build
        uses: actions/upload-artifact@v4
        with:
          name: electron-build
          path: dist-electron/
          retention-days: 1

  test:
    name: Test (${{ matrix.provider }})
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [auggie, claude-code, codex, opencode]
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
      AUGMENT_SESSION_AUTH: ${{ secrets.AUGMENT_SESSION_AUTH }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INTENT_SMOKE_TEST: ${{ secrets.INTENT_SMOKE_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore node_modules cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download Electron build (from artifact)
        if: inputs.build_source != 'cdn'
        uses: actions/download-artifact@v4
        with:
          name: electron-build
          path: dist-electron/

      - name: Download Electron build (from CDN)
        if: inputs.build_source == 'cdn'
        run: |
          CHANNEL="${{ inputs.cdn_channel }}"
          DMG_URL="https://cdn.augmentcode.com/${CHANNEL}/Intent-latest-arm64.dmg"
          echo "📥 Downloading ${CHANNEL} build from CDN..."
          curl -fSL -o intent.dmg "$DMG_URL"
          echo "📦 Mounting DMG..."
          hdiutil attach intent.dmg -nobrowse -mountpoint /tmp/intent-dmg
          echo "📂 Copying app to dist-electron/mac-arm64/..."
          mkdir -p dist-electron/mac-arm64
          cp -R "/tmp/intent-dmg/Intent by Augment.app" "dist-electron/mac-arm64/Intent by Augment.app"
          hdiutil detach /tmp/intent-dmg
          rm -f intent.dmg
          echo "✅ CDN build (${CHANNEL}) ready"

      - name: Fix executable permissions
        run: |
          find dist-electron -path "*/MacOS/*" -type f -exec chmod +x {} +
          find dist-electron -name "*.sh" -type f -exec chmod +x {} +
          # Fix permissions on native module binaries (lost during artifact upload/download)
          find dist-electron -name "*.node" -type f -exec chmod +x {} +
          find dist-electron -name "spawn-helper" -type f -exec chmod +x {} +
          find dist-electron -path "*/app.asar.unpacked/*" -name "fontlist" -type f -exec chmod +x {} +

      - name: Configure git credentials for e2e test repo
        if: env.INTENT_SMOKE_TEST != ''
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${INTENT_SMOKE_TEST}@github.com" >> ~/.git-credentials

      - name: Install and authenticate auggie
        if: matrix.provider == 'auggie' && env.AUGMENT_SESSION_AUTH != ''
        run: |
          npm install -g @augmentcode/auggie
          mkdir -p ~/.augment
          echo '${{ env.AUGMENT_SESSION_AUTH }}' > ~/.augment/session.json

      - name: Verify auggie auth
        if: matrix.provider == 'auggie' && env.AUGMENT_SESSION_AUTH != ''
        run: auggie --version

      - name: Install claude-code
        if: matrix.provider == 'claude-code' && env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Install codex
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        run: npm install -g @openai/codex

      - name: Authenticate codex CLI
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        run: echo "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Verify codex login
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        run: codex login status

      - name: Verify codex CLI works end-to-end
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        timeout-minutes: 2
        run: codex exec "Respond with just the word ok" --sandbox read-only

      - name: Install opencode
        if: matrix.provider == 'opencode' && env.ANTHROPIC_API_KEY != ''
        run: npm install -g opencode-ai

      - name: Run smoke tests
        run: npx playwright test --config=e2e/build-smoke.config.ts --grep "${{ matrix.provider }}" --grep-invert "multi-provider"
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report-${{ matrix.provider }}
          path: e2e-reports/
          retention-days: 7

      - name: Cleanup e2e test branches and PRs
        if: always() && env.INTENT_SMOKE_TEST != ''
        env:
          GH_TOKEN: ${{ secrets.INTENT_SMOKE_TEST }}
        run: |
          gh pr list --repo augmentcode/intent-e2e-test --state open --json number,headRefName \
            | jq -r '.[] | select(.headRefName | startswith("e2e-test-")) | .number' \
            | xargs -I {} gh pr close {} --repo augmentcode/intent-e2e-test --delete-branch || true

  test-multi-provider:
    if: always() && needs.build.result == 'success'
    name: Test (multi-provider)
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
      AUGMENT_SESSION_AUTH: ${{ secrets.AUGMENT_SESSION_AUTH }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore node_modules cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download Electron build (from artifact)
        if: inputs.build_source != 'cdn'
        uses: actions/download-artifact@v4
        with:
          name: electron-build
          path: dist-electron/

      - name: Download Electron build (from CDN)
        if: inputs.build_source == 'cdn'
        run: |
          CHANNEL="${{ inputs.cdn_channel }}"
          DMG_URL="https://cdn.augmentcode.com/${CHANNEL}/Intent-latest-arm64.dmg"
          echo "📥 Downloading ${CHANNEL} build from CDN..."
          curl -fSL -o intent.dmg "$DMG_URL"
          echo "📦 Mounting DMG..."
          hdiutil attach intent.dmg -nobrowse -mountpoint /tmp/intent-dmg
          echo "📂 Copying app to dist-electron/mac-arm64/..."
          mkdir -p dist-electron/mac-arm64
          cp -R "/tmp/intent-dmg/Intent by Augment.app" "dist-electron/mac-arm64/Intent by Augment.app"
          hdiutil detach /tmp/intent-dmg
          rm -f intent.dmg
          echo "✅ CDN build (${CHANNEL}) ready"

      - name: Fix executable permissions
        run: |
          find dist-electron -path "*/MacOS/*" -type f -exec chmod +x {} +
          find dist-electron -name "*.sh" -type f -exec chmod +x {} +
          # Fix permissions on native module binaries (lost during artifact upload/download)
          find dist-electron -name "*.node" -type f -exec chmod +x {} +
          find dist-electron -name "spawn-helper" -type f -exec chmod +x {} +
          find dist-electron -path "*/app.asar.unpacked/*" -name "fontlist" -type f -exec chmod +x {} +

      - name: Install and authenticate auggie
        if: env.AUGMENT_SESSION_AUTH != ''
        run: |
          npm install -g @augmentcode/auggie
          mkdir -p ~/.augment
          echo '${{ env.AUGMENT_SESSION_AUTH }}' > ~/.augment/session.json

      - name: Verify auggie auth
        if: env.AUGMENT_SESSION_AUTH != ''
        run: auggie --version

      - name: Install claude-code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Install codex
        if: env.OPENAI_API_KEY != ''
        run: npm install -g @openai/codex

      - name: Authenticate codex CLI
        if: env.OPENAI_API_KEY != ''
        run: echo "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Verify codex login
        if: env.OPENAI_API_KEY != ''
        run: codex login status

      - name: Verify codex CLI works end-to-end
        if: env.OPENAI_API_KEY != ''
        timeout-minutes: 2
        run: codex exec "Respond with just the word ok" --sandbox read-only

      - name: Install opencode
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g opencode-ai

      - name: Run smoke tests
        run: npx playwright test --config=e2e/build-smoke.config.ts --grep "multi-provider"
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report-multi-provider
          path: e2e-reports/
          retention-days: 7


  ui-smoke-tests:
    name: UI Smoke Tests (Mock Agent)
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
      INTENT_SMOKE_TEST: ${{ secrets.INTENT_SMOKE_TEST }}
      GITHUB_API_TOKEN: ${{ secrets.INTENT_SMOKE_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Electron build (from artifact)
        if: inputs.build_source != 'cdn'
        uses: actions/download-artifact@v4
        with:
          name: electron-build
          path: dist-electron/

      - name: Download Electron build (from CDN)
        if: inputs.build_source == 'cdn'
        run: |
          CHANNEL="${{ inputs.cdn_channel }}"
          DMG_URL="https://cdn.augmentcode.com/${CHANNEL}/Intent-latest-arm64.dmg"
          echo "📥 Downloading ${CHANNEL} build from CDN..."
          curl -fSL -o intent.dmg "$DMG_URL"
          echo "📦 Mounting DMG..."
          hdiutil attach intent.dmg -nobrowse -mountpoint /tmp/intent-dmg
          echo "📂 Copying app to dist-electron/mac-arm64/..."
          mkdir -p dist-electron/mac-arm64
          cp -R "/tmp/intent-dmg/Intent by Augment.app" "dist-electron/mac-arm64/Intent by Augment.app"
          hdiutil detach /tmp/intent-dmg
          rm -f intent.dmg
          echo "✅ CDN build (${CHANNEL}) ready"

      - name: Fix executable permissions
        run: |
          find dist-electron -path "*/MacOS/*" -type f -exec chmod +x {} +
          find dist-electron -name "*.sh" -type f -exec chmod +x {} +
          find dist-electron -name "*.node" -type f -exec chmod +x {} +
          find dist-electron -name "spawn-helper" -type f -exec chmod +x {} +
          find dist-electron -path "*/app.asar.unpacked/*" -name "fontlist" -type f -exec chmod +x {} +

      - name: Run mock agent chat tests
        id: chat-tests
        continue-on-error: true
        run: npx playwright test --config=e2e/build-smoke.config.ts e2e/build-smoke-agent-chat.e2e.ts --reporter=list
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Run multi-agent tests
        id: multi-agent-tests
        continue-on-error: true
        run: npx playwright test --config=e2e/build-smoke.config.ts e2e/build-smoke-multi-agent.e2e.ts --reporter=list
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Run commit flow tests
        id: commit-tests
        continue-on-error: true
        run: npx playwright test --config=e2e/build-smoke.config.ts e2e/build-smoke-commit.e2e.ts --reporter=list
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Run follow-up message tests
        id: followup-tests
        continue-on-error: true
        run: npx playwright test --config=e2e/build-smoke.config.ts e2e/build-smoke-followup.e2e.ts --reporter=list
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Run navigation tests
        id: navigation-tests
        continue-on-error: true
        run: npx playwright test --config=e2e/build-smoke.config.ts e2e/build-smoke-navigation.e2e.ts --reporter=list
        env:
          RUNNING_IN_TERMINAL: '1'

      - name: Check test results
        if: always()
        run: |
          if [ "${{ steps.chat-tests.outcome }}" = "failure" ] || \
             [ "${{ steps.multi-agent-tests.outcome }}" = "failure" ] || \
             [ "${{ steps.commit-tests.outcome }}" = "failure" ] || \
             [ "${{ steps.followup-tests.outcome }}" = "failure" ] || \
             [ "${{ steps.navigation-tests.outcome }}" = "failure" ]; then
            echo "❌ One or more test suites failed:"
            echo "  chat-tests: ${{ steps.chat-tests.outcome }}"
            echo "  multi-agent-tests: ${{ steps.multi-agent-tests.outcome }}"
            echo "  commit-tests: ${{ steps.commit-tests.outcome }}"
            echo "  followup-tests: ${{ steps.followup-tests.outcome }}"
            echo "  navigation-tests: ${{ steps.navigation-tests.outcome }}"
            exit 1
          fi
          echo "✅ All test suites passed"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report-ui-mock
          path: e2e-reports/
          retention-days: 7

