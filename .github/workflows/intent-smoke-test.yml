name: Intent Smoke Tests

on:
  workflow_dispatch:

concurrency:
  group: intent-smoke-test
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: macos-14
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules cache
        if: always() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Compute build cache key
        id: build-cache-key
        run: |
          echo "hash=${{ hashFiles('src/main/**', 'src/preload/**', 'src/lib/**', 'src/features/**', 'src/routes/**', 'src/shared/**', 'src/types/**', 'src/utils/**', 'src/assets/**', 'src/app.*', 'src/hooks.client.ts', 'src/tailwind-references.css', 'package.json', 'package-lock.json', 'electron-builder.yml', 'vite.config.mjs', 'postcss.config.mjs', 'tsconfig*.json', 'svelte.config.js', 'tailwind.config.js', 'build/**', 'static/**', 'resources/**') }}" >> $GITHUB_OUTPUT

      - name: Restore Electron build cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: dist-electron/
          key: electron-build-${{ runner.os }}-${{ steps.build-cache-key.outputs.hash }}

      - name: Build packaged app
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac

      - name: Save Electron build cache
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-electron/
          key: electron-build-${{ runner.os }}-${{ steps.build-cache-key.outputs.hash }}

      - name: Upload Electron build
        uses: actions/upload-artifact@v4
        with:
          name: electron-build
          path: dist-electron/
          retention-days: 1

  test:
    name: Test (${{ matrix.provider }})
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [auggie, claude-code, codex, opencode]
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
      AUGMENT_SESSION_AUTH: ${{ secrets.AUGMENT_SESSION_AUTH }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download Electron build
        uses: actions/download-artifact@v4
        with:
          name: electron-build
          path: dist-electron/

      - name: Fix executable permissions
        run: |
          find dist-electron -path "*/MacOS/*" -type f -exec chmod +x {} +
          find dist-electron -name "*.sh" -type f -exec chmod +x {} +

      - name: Install and authenticate auggie
        if: matrix.provider == 'auggie' && env.AUGMENT_SESSION_AUTH != ''
        run: |
          npm install -g @augmentcode/auggie
          mkdir -p ~/.augment
          echo '${{ env.AUGMENT_SESSION_AUTH }}' > ~/.augment/session.json

      - name: Verify auggie auth
        if: matrix.provider == 'auggie' && env.AUGMENT_SESSION_AUTH != ''
        run: auggie --version

      - name: Install claude-code
        if: matrix.provider == 'claude-code' && env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Install codex
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        run: npm install -g @openai/codex

      - name: Authenticate codex CLI
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        run: echo "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Verify codex login
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        run: codex login status

      - name: Verify codex CLI works end-to-end
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        timeout-minutes: 2
        run: codex exec "Respond with just the word ok" --sandbox read-only

      - name: Detect available codex model
        if: matrix.provider == 'codex' && env.OPENAI_API_KEY != ''
        timeout-minutes: 3
        run: |
          for model in gpt-5.3-codex gpt-5.2-codex gpt-5.1-codex gpt-5-codex; do
            echo "Trying model: $model"
            if codex exec --model "$model" "Respond with just ok" --sandbox read-only 2>&1; then
              echo "CODEX_SMOKE_MODEL=codex:$model/low" >> $GITHUB_ENV
              echo "✅ Using model: $model"
              exit 0
            fi
            echo "❌ $model not available"
          done
          echo "⚠️ No codex model available — test will likely fail"

      - name: Install opencode
        if: matrix.provider == 'opencode' && env.ANTHROPIC_API_KEY != ''
        run: npm install -g opencode-ai

      - name: Run smoke tests
        run: npx playwright test --config=e2e/build-smoke.config.ts --grep "${{ matrix.provider }}"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report-${{ matrix.provider }}
          path: e2e-reports/
          retention-days: 7
