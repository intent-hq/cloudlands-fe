name: Intent - Manual Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows-build:
    name: Test Windows Build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << 'EOF'
          SENTRY_DSN=""
          SENTRY_RELEASE="test"
          SENTRY_AUTH_TOKEN=""
          SEGMENT_WRITE_KEY=""
          EOF

      - name: Build Windows
        run: npm run dist:win
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post summary
        shell: bash
        run: |
          echo "## Windows Test Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist-electron/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No dist-electron/ directory found" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ This is an unsigned test build — not uploaded or distributed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml
          retention-days: 7
          if-no-files-found: warn
