name: Intent - Manual Windows Build

on:
  workflow_dispatch:
    inputs:
      integrated_signing:
        description: 'Enable Azure Artifact Signing (requires approved account, identity and credentials)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-windows-build:
    name: Test Windows Build
    # gh-windows-16x: org hosted runner (16-core/64 GB, runner group 1, same
    # group as gh-linux-16x), fixed at the runner level to the Windows Server
    # 2022 image (see release-alpha.yml build-windows for why Server 2022).
    runs-on: gh-windows-16x
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # On Windows runners C:\WINDOWS\system32\bash.EXE (the WSL stub)
      # shadows Git Bash in PATH, and WSL bash can't execute the
      # runner's Windows-path step scripts. Prepend Git's bin dir so every
      # later `shell: bash` step resolves Git Bash instead (same workaround
      # as intentd's ci.yml build job).
      - name: Put Git Bash first on PATH
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          # Space-free per-run dest: hosted Windows runner names can contain
          # spaces and pnpm/action-setup@v6 breaks on space-containing paths
          # on Windows (pnpm/action-setup#261), so runner.name cannot be
          # used here (same as release-alpha.yml build-windows). run_id +
          # run_attempt keeps the dest unique per run.
          dest: ~/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node.js
        # No cache: 'pnpm' — this job previously ran on a non-ephemeral
        # self-hosted runner with a persistent pnpm store, making the GH
        # Actions cache tarball round-trip redundant. On the hosted
        # gh-windows-16x runner each job is a fresh VM with no persistent
        # store, so this is a candidate for cache: 'pnpm' — left as-is here
        # since only the runner target was migrated by this change.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stages the pinned intentd release (intentd.version) at resources/sidecar;
      # fails fast when the pinned release or its Windows asset doesn't exist.
      # PATH prefix: the hosted runner's PATH resolves GNU tar (Git's usr/bin),
      # which can't read the .zip release asset ("This does not look like a
      # tar archive", run 31310028897; the old self-hosted runner resolved
      # bsdtar and didn't need this). Prefer the System32 bsdtar, which
      # handles .zip natively — same workaround as release-alpha.yml
      # build-windows (intent-hq/monorepo#1282). Scoped to this step so bash
      # keeps resolving to Git Bash (see PATH workaround above).
      # intent-hq/intentd is public: the default token covers the release reads
      # (no PAT needed).
      - name: Fetch pinned intentd sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: PATH="/c/Windows/System32:$PATH" node scripts/fetch-sidecar.cjs

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build Windows
        id: build_windows
        shell: pwsh
        env:
          # 12288: the bundle's peak heap outgrew the old 8192 cap even with
          # sourcemaps disabled (monorepo#1340) — run 31310837286 JS-heap-OOM'd
          # at ~7.9 GB under 8192 on gh-windows-16x. Mirrors the release-alpha
          # build-windows leg; the 16x runner's 64 GB RAM gives ample headroom.
          NODE_OPTIONS: '--max-old-space-size=12288'
          # Sourcemap generation multiplies rollup's peak heap past the cap
          # (monorepo#1074/#1282/#1340). Nothing consumes the 'hidden'
          # production maps in these builds, so skip them like release-alpha.
          INTENT_DISABLE_SOURCEMAPS: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Points at the sidecar staged by fetch-sidecar.cjs; copy-sidecar.cjs
          # detects the pre-staged binary and leaves it in place.
          INTENTD_BIN: ${{ github.workspace }}\resources\sidecar\intentd.exe
          # Credentials are available only to an explicitly signed packaging step.
          INTENT_WINDOWS_SIGNING_MODE: ${{ inputs.integrated_signing && 'azure' || 'unsigned' }}
          INTENT_WINDOWS_AZURE_ENDPOINT: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_AZURE_ENDPOINT || '' }}
          INTENT_WINDOWS_AZURE_ACCOUNT_NAME: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_AZURE_ACCOUNT_NAME || '' }}
          INTENT_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME || '' }}
          INTENT_WINDOWS_PUBLISHER_NAME: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_PUBLISHER_NAME || '' }}
          INTENT_WINDOWS_PUBLISHER_SUBJECT: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_PUBLISHER_SUBJECT || '' }}
          AZURE_TENANT_ID: ${{ inputs.integrated_signing && vars.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.integrated_signing && vars.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.integrated_signing && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          node -e "require('./scripts/windows-builder.cjs')()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path dist-electron) { Remove-Item -Recurse -Force dist-electron }
          pnpm run dist:win --config scripts/windows-builder.cjs --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows artifacts
        id: verify_windows
        shell: powershell
        env:
          INTENT_WINDOWS_SIGNING_MODE: ${{ inputs.integrated_signing && 'azure' || 'unsigned' }}
          INTENT_WINDOWS_AZURE_ENDPOINT: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_AZURE_ENDPOINT || '' }}
          INTENT_WINDOWS_AZURE_ACCOUNT_NAME: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_AZURE_ACCOUNT_NAME || '' }}
          INTENT_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME || '' }}
          INTENT_WINDOWS_PUBLISHER_NAME: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_PUBLISHER_NAME || '' }}
          INTENT_WINDOWS_PUBLISHER_SUBJECT: ${{ inputs.integrated_signing && vars.INTENT_WINDOWS_PUBLISHER_SUBJECT || '' }}
        run: |
          node scripts/verify-windows-artifacts.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Summary & artifacts ───────────────────────────────────────────
      - name: Post summary
        if: always()
        shell: bash
        run: |
          echo "## Windows Manual Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build_windows.outcome }}" != "success" ]; then
            echo "❌ Build failed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.verify_windows.outcome }}" != "success" ]; then
            echo "❌ Artifact verification failed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.integrated_signing }}" != "true" ]; then
            echo "⚠️ Unsigned build completed (signing not requested)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Azure artifact checks passed; native install/update acceptance pending." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist-electron/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No dist-electron/ directory." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/*.yml
            !dist-electron/builder-*.yml
            dist-electron/windows-verification.json
          retention-days: 30
          if-no-files-found: error
