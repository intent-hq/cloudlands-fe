name: Intent - Manual Windows Build

on:
  workflow_dispatch:
    inputs:
      integrated_signing:
        description: 'Enable integrated DigiCert/KeyLocker signing during Electron Builder packaging'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-windows-build:
    name: Test Windows Build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stages the pinned intentd release (intentd.version) at resources/sidecar;
      # fails fast when the pinned release or its Windows asset doesn't exist.
      - name: Fetch pinned intentd sidecar
        shell: bash
        env:
          INTENTD_READ_PAT: ${{ secrets.INTENTD_READ_PAT }}
        run: |
          if [ -z "$INTENTD_READ_PAT" ]; then
            echo "::error::INTENTD_READ_PAT secret is required to fetch the pinned intentd release"
            exit 1
          fi
          node scripts/fetch-sidecar.cjs

      # ── DigiCert signing setup (official action) ──────────────────────
      - name: Check integrated signing configuration
        id: integrated_signing
        if: ${{ inputs.integrated_signing }}
        shell: bash
        run: |
          missing=""
          for name in INTENT_WINDOWS_SM_HOST INTENT_WINDOWS_SM_KEYPAIR_ALIAS INTENT_WINDOWS_SM_API_KEY INTENT_WINDOWS_SM_CLIENT_CERT_FILE_B64 INTENT_WINDOWS_SM_CLIENT_CERT_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing:+$missing, }${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Integrated signing requested but missing: $missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        env:
          INTENT_WINDOWS_SM_HOST: ${{ vars.INTENT_WINDOWS_SM_HOST }}
          INTENT_WINDOWS_SM_KEYPAIR_ALIAS: ${{ vars.INTENT_WINDOWS_SM_KEYPAIR_ALIAS }}
          INTENT_WINDOWS_SM_API_KEY: ${{ secrets.INTENT_WINDOWS_SM_API_KEY }}
          INTENT_WINDOWS_SM_CLIENT_CERT_FILE_B64: ${{ secrets.INTENT_WINDOWS_SM_CLIENT_CERT_FILE_B64 }}
          INTENT_WINDOWS_SM_CLIENT_CERT_PASSWORD: ${{ secrets.INTENT_WINDOWS_SM_CLIENT_CERT_PASSWORD }}

      - name: Decode DigiCert client certificate
        if: ${{ steps.integrated_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          echo "${{ secrets.INTENT_WINDOWS_SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12

      - name: Setup DigiCert Software Trust Manager
        if: ${{ steps.integrated_signing.outputs.enabled == 'true' }}
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
        env:
          SM_HOST: ${{ vars.INTENT_WINDOWS_SM_HOST }}
          SM_API_KEY: ${{ secrets.INTENT_WINDOWS_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: D:\\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.INTENT_WINDOWS_SM_CLIENT_CERT_PASSWORD }}

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build Windows
        id: build_windows
        shell: pwsh
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Points at the sidecar staged by fetch-sidecar.cjs; copy-sidecar.cjs
          # detects the pre-staged binary and leaves it in place.
          INTENTD_BIN: ${{ github.workspace }}\resources\sidecar\intentd.exe
          INTENT_WINDOWS_ENABLE_INTEGRATED_SIGNING: ${{ steps.integrated_signing.outputs.enabled == 'true' && 'true' || '' }}
          INTENT_WINDOWS_SM_KEYPAIR_ALIAS: ${{ vars.INTENT_WINDOWS_SM_KEYPAIR_ALIAS }}
          SM_HOST: ${{ vars.INTENT_WINDOWS_SM_HOST }}
          SM_API_KEY: ${{ secrets.INTENT_WINDOWS_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: D:\\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.INTENT_WINDOWS_SM_CLIENT_CERT_PASSWORD }}
        run: |
          pnpm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Post-build validation (when signing is enabled) ───────────────
      - name: Validate latest.yml matches signed installer
        if: ${{ steps.integrated_signing.outputs.enabled == 'true' && steps.build_windows.outcome == 'success' }}
        id: latest_yml_check
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const yaml = require('js-yaml');

          const distDir = 'dist-electron';
          const latest = yaml.load(fs.readFileSync(path.join(distDir, 'latest.yml'), 'utf8'));
          const exeEntry = (latest.files || []).find(f => String(f.url || '').toLowerCase().endsWith('.exe'));
          const installerName = path.basename((exeEntry && exeEntry.url) || latest.path || '');
          if (!installerName) throw new Error('No installer found in latest.yml');

          const installerPath = path.join(distDir, installerName);
          const actualSha512 = crypto.createHash('sha512').update(fs.readFileSync(installerPath)).digest('base64');

          console.log(`Installer: ${installerName}`);
          console.log(`latest.yml sha512: ${exeEntry?.sha512 || latest.sha512}`);
          console.log(`Actual sha512:     ${actualSha512}`);

          const match = (exeEntry?.sha512 || latest.sha512) === actualSha512;
          if (!match) throw new Error('latest.yml sha512 does not match signed installer.');
          console.log('✅ Hash match confirmed.');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `installer_path=${installerPath}\n`);
          NODE

      - name: Verify Authenticode signature
        if: ${{ steps.integrated_signing.outputs.enabled == 'true' && steps.latest_yml_check.outcome == 'success' }}
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.latest_yml_check.outputs.installer_path }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath $env:INSTALLER_PATH
          Write-Host "Status: $($sig.Status)"
          Write-Host "Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($sig.Status)"
          }
          Write-Host "✅ Authenticode signature is valid."

      # ── Summary & artifacts ───────────────────────────────────────────
      - name: Post summary
        if: always()
        shell: bash
        run: |
          echo "## Windows Manual Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build_windows.outcome }}" != "success" ]; then
            echo "❌ Build failed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.integrated_signing.outputs.enabled }}" != "true" ]; then
            echo "⚠️ Unsigned build completed (signing not requested)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Signed build completed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist-electron/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No dist-electron/ directory." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml
          retention-days: 30
          if-no-files-found: warn
