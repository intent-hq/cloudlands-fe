name: Intent - Promote Windows Beta to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version to promote (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

# Only one Windows promotion at a time, never cancel in progress
concurrency:
  group: intent-windows-promote
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Windows beta artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Expected semver (e.g., 1.2.3)"
            exit 1
          fi
          echo "Version $VERSION is valid"

      - name: Verify Windows beta manifest on CDN
        run: |
          VERSION="${{ inputs.version }}"
          CDN_BASE="https://cdn.augmentcode.com/beta"

          echo "Checking Windows beta manifest (latest.yml) for v$VERSION..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CDN_BASE/latest.yml")
          if [ "$STATUS" != "200" ]; then
            echo "::error::latest.yml not found on beta CDN (HTTP $STATUS)"
            exit 1
          fi
          echo "  latest.yml: OK ($STATUS)"

          MANIFEST_VERSION=$(curl -s "$CDN_BASE/latest.yml" | grep "^version:" | sed 's/version: //')
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::latest.yml version mismatch: expected $VERSION, got $MANIFEST_VERSION"
            exit 1
          fi
          echo "  latest.yml version: $MANIFEST_VERSION (matches)"

      - name: Verify Windows installer artifacts
        run: |
          VERSION="${{ inputs.version }}"
          CDN_BASE="https://cdn.augmentcode.com/beta"
          FAILED=0

          echo "Checking Windows beta artifacts for v$VERSION..."

          # Check versioned installer
          WIN_INSTALLER="Intent by Augment Setup ${VERSION}.exe"
          ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$WIN_INSTALLER'))")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head "$CDN_BASE/$ENCODED")
          if [ "$STATUS" = "200" ]; then
            echo "  $WIN_INSTALLER: OK"
          else
            echo "::error::$WIN_INSTALLER not found on beta CDN (HTTP $STATUS)"
            FAILED=1
          fi

          # Check latest installer
          WIN_LATEST="Intent-latest-Setup.exe"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head "$CDN_BASE/$WIN_LATEST")
          if [ "$STATUS" = "200" ]; then
            echo "  $WIN_LATEST: OK"
          else
            echo "::error::$WIN_LATEST not found on beta CDN (HTTP $STATUS)"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

  smoke-test:
    name: Smoke test Windows installer
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify Windows installer size
        run: |
          CDN_BASE="https://cdn.augmentcode.com/beta"
          WIN_URL="$CDN_BASE/Intent-latest-Setup.exe"

          echo "Checking Windows installer at $WIN_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head "$WIN_URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Windows installer not found (HTTP $HTTP_STATUS)"
            exit 1
          fi

          # Get file size via Content-Length header
          FILE_SIZE=$(curl -sI "$WIN_URL" | grep -i '^content-length:' | awk '{print $2}' | tr -d '\r')

          if ! [[ "$FILE_SIZE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine Windows installer size (Content-Length: '$FILE_SIZE')"
            exit 1
          fi

          echo "Windows installer size: $FILE_SIZE bytes ($(( FILE_SIZE / 1024 / 1024 )) MB)"

          if [ "$FILE_SIZE" -lt 52428800 ]; then
            echo "::error::Windows installer is suspiciously small (< 50MB). Expected a full installer."
            exit 1
          fi

          echo "Windows installer smoke test passed"

  playwright-smoke-test:
    name: Playwright Smoke Test
    needs: validate
    uses: ./.github/workflows/intent-windows-smoke-test.yml
    with:
      build_source: cdn
      cdn_channel: beta
    secrets: inherit

  promote:
    name: Promote Windows to stable
    needs: [validate, smoke-test, playwright-smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.INTENT_GCP_SERVICE_ACCOUNT_KEY }}

      - name: Promote Windows beta to stable
        run: |
          VERSION="${{ inputs.version }}"

          echo "Promoting Windows artifacts from beta to stable..."

          # Verify the beta manifest version matches the requested version before copying
          # (guards against a race where a newer build lands between validate and promote)
          MANIFEST_VERSION=$(gcloud storage cat "gs://$GCS_BUCKET/beta/latest.yml" | grep "^version:" | sed 's/version: //')
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Beta latest.yml version mismatch: expected $VERSION, got $MANIFEST_VERSION. A newer build may have landed since validation."
            exit 1
          fi
          echo "Beta manifest version verified: $MANIFEST_VERSION"

          # Copy Windows manifest
          gcloud storage cp "gs://$GCS_BUCKET/beta/latest.yml" "gs://$GCS_BUCKET/stable/latest.yml" --quiet
          echo "Copied latest.yml"

          # Copy versioned Windows artifacts
          PRODUCT_NAME="Intent by Augment"
          WIN_EXE="${PRODUCT_NAME} Setup ${VERSION}.exe"
          WIN_BLOCKMAP="${WIN_EXE}.blockmap"

          for artifact in "$WIN_EXE" "$WIN_BLOCKMAP"; do
            if gcloud storage ls "gs://$GCS_BUCKET/beta/$artifact" &>/dev/null 2>&1; then
              gcloud storage cp "gs://$GCS_BUCKET/beta/$artifact" "gs://$GCS_BUCKET/stable/$artifact" --quiet
              echo "Copied $artifact"
            else
              echo "Warning: $artifact not found in beta"
            fi
          done

          # Copy latest installer link
          gcloud storage cp "gs://$GCS_BUCKET/beta/Intent-latest-Setup.exe" "gs://$GCS_BUCKET/stable/Intent-latest-Setup.exe" --quiet
          echo "Copied Intent-latest-Setup.exe"

          # Invalidate CDN cache for stable Windows files
          gcloud compute url-maps invalidate-cdn-cache "$CLOUD_CDN_URL_MAP" \
            --path "/stable/latest.yml" --path "/stable/Intent-latest-Setup.exe" \
            --project="$GCP_PROJECT" --quiet
          echo "CDN cache invalidated for stable Windows files"
        env:
          GCS_BUCKET: ${{ secrets.INTENT_GCS_BUCKET }}
          GCP_PROJECT: ${{ secrets.INTENT_GCP_PROJECT }}
          CLOUD_CDN_URL_MAP: ${{ secrets.INTENT_CLOUD_CDN_URL_MAP }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Verify stable manifest
        run: |
          VERSION="${{ inputs.version }}"
          CDN_BASE="https://cdn.augmentcode.com/stable"

          echo "Waiting for CDN cache to propagate..."
          sleep 10

          MANIFEST_VERSION=$(curl -s "$CDN_BASE/latest.yml" | grep "^version:" | sed 's/version: //')
          if [ -z "$MANIFEST_VERSION" ]; then
            echo "::warning::latest.yml not found on stable CDN (may still be propagating)"
          elif [ "$MANIFEST_VERSION" = "$VERSION" ]; then
            echo "  latest.yml: v$MANIFEST_VERSION (correct)"
          else
            echo "::warning::latest.yml shows v$MANIFEST_VERSION, expected v$VERSION (CDN may still be propagating)"
          fi

      - name: Post summary
        run: |
          VERSION="${{ inputs.version }}"
          echo "## Windows Stable Promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**Promoted from:** beta" >> "$GITHUB_STEP_SUMMARY"
          echo "**Channel:** stable" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Download URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Windows Installer](https://cdn.augmentcode.com/stable/Intent-latest-Setup.exe)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows beta manifest validated (latest.yml)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows installer smoke test passed (size check > 50MB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable manifest updated" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: success()
        run: |
          VERSION="${{ inputs.version }}"
          MSG="*Intent Windows Stable Promotion*\n\n*Version:* v${VERSION}\n*Promoted from:* beta\n*Channel:* stable\n*Triggered by:* ${{ github.actor }}\n\n*Windows:* <https://cdn.augmentcode.com/stable/Intent-latest-Setup.exe|Download>"
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"Intent Windows v${VERSION} promoted to stable\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${MSG}\"
                  }
                }
              ]
            }" \
            ${{ secrets.INTENT_SLACK_WEBHOOK_URL }}

