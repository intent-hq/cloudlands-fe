# Diagnostic comparison; successor execution requires reviewed source and runtime allocation.
name: Tailcat native fixture controls
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/tailcat-native.yml'
      - 'src/features/backend/main/backend-connection.test.ts'
      - 'src/features/backend/main/backend-connection.ts'
      - 'src/features/backend/main/tailcat-tunnel.ts'
      - 'src/features/backend/main/__tests__/tailcat-tunnel.test.ts'
permissions:
  contents: read
concurrency:
  group: tailcat-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  saved-tailcat:
    # This comparison measures one historical source pair. Check admission before
    # allocating matrix runners; later PRs and later commits deliberately skip it.
    # In particular, the workflow-scoping correction itself is not a new candidate.
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'intent-hq/cloudlands-fe' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') &&
      github.event.pull_request.number == 2970 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'fix/5583-native-tailcat-fixtures' &&
      github.event.pull_request.head.sha == 'c2b9afdb49403e222c9cd616fe63e887638d6abf'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Each cell gets a separate hosted job/checkout/install. Matrix order
        # is not evidence of temporal ordering or shared-host equivalence.
        include:
          - runner: macos-15-xlarge
            platform: darwin
            arch: arm64
            phase: baseline
            source_sha256: 49ae46d9df65e182b9d85e56e9ff17b8f3591d16e34bdb15d50a0b83d9cc1210
          - runner: macos-15-xlarge
            platform: darwin
            arch: arm64
            phase: diagnostic
            source_sha256: 0155a1fa7ce96222382db6ceae3f6892346ef5d13bb29da495cda874a744fdf3
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            phase: baseline
            source_sha256: 49ae46d9df65e182b9d85e56e9ff17b8f3591d16e34bdb15d50a0b83d9cc1210
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            phase: diagnostic
            source_sha256: 0155a1fa7ce96222382db6ceae3f6892346ef5d13bb29da495cda874a744fdf3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Baseline is the untouched full repository, not a swapped test file.
          # Candidate is the exact PR head, explicitly NOT the merge ref.
          ref: ${{ matrix.phase == 'baseline' && '73f2ecd94a1712ba7170264e0bedae154637ae66' || github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Record source and runtime
        timeout-minutes: 1
        env:
          EXPECT_PLATFORM: ${{ matrix.platform }}
          EXPECT_ARCH: ${{ matrix.arch }}
          EXPECT_SOURCE_SHA: ${{ matrix.source_sha256 }}
          PHASE: ${{ matrix.phase }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/tailcat-evidence
          {
            date -u
            actual_head=$(git rev-parse HEAD)
            printf 'PHASE=%s\nACTUAL_HEAD=%s\n' "$PHASE" "$actual_head"
            if [ "$PHASE" = baseline ]; then
              test "$actual_head" = 73f2ecd94a1712ba7170264e0bedae154637ae66
            else
              test "$actual_head" = "$PR_HEAD"
              test "$(git rev-parse HEAD^)" = 73f2ecd94a1712ba7170264e0bedae154637ae66
              node <<'JS'
          const {execFileSync} = require('node:child_process');
          const allowed = new Set(['src/features/backend/main/backend-connection.test.ts', '.github/workflows/tailcat-native.yml']);
          const paths = execFileSync('git', ['diff', '--name-only', '-z', 'HEAD^', 'HEAD'], {encoding:'utf8'}).split('\0').filter(Boolean);
          if (paths.some(path => !allowed.has(path))) throw new Error('Candidate contains unrelated source changes');
          JS
            fi
            test -z "$(git status --porcelain)"
            git show -s --format='%H %P' HEAD
            printf 'PR_HEAD=%s\nPR_BASE=%s\n' "$PR_HEAD" "$PR_BASE"
            uname -a
            if [ "$(uname -s)" = Darwin ]; then sw_vers; fi
            node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,execPath:process.execPath,versions:process.versions})); if(process.platform!==process.env.EXPECT_PLATFORM || process.arch!==process.env.EXPECT_ARCH || process.version!=="v24.21.0") process.exit(1)'
            pnpm --version
            test "$(pnpm --version)" = 10.30.3
            node <<'JS'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const expected = {
            'src/features/backend/main/backend-connection.test.ts': process.env.EXPECT_SOURCE_SHA,
            'src/features/backend/main/tailcat-tunnel.ts': 'd4ec660fabeabf92cbabc56e9295f8ab7ef283ed15fc837a35536a6c56d30144',
            'pnpm-lock.yaml': 'c479b9be319dfa0f868e0fedf37bd253125af9b2bf48d6d8f5c56f68381ce1a2',
          };
          for (const [file, hash] of Object.entries(expected)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            console.log(file, actual);
            if (actual !== hash) throw new Error(`Source drift in ${file}`);
          }
          JS
          } 2>&1 | tee .cache/tailcat-evidence/identity.log
      - name: Install locked dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .cache/tailcat-evidence/install.log
      - name: Prepare isolated test environment and generated sources
        id: setup
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tailcat-home" .cache/tailcat-fixtures
          mktemp -d /tmp/tc5583.XXXXXX > .cache/tailcat-evidence/tmp-root
          cat > .cache/tailcat-evidence/clean-env.sh <<'SH'
          #!/bin/bash
          set -eu
          fixture_tmp=$(cat .cache/tailcat-evidence/tmp-root)
          exec env -i PATH="$PATH" HOME="$RUNNER_TEMP/tailcat-home" \
            TMPDIR="$fixture_tmp" TMP="$fixture_tmp" TEMP="$fixture_tmp" \
            LANG=en_US.UTF-8 CI=true GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 \
            INTENT_TAILCAT_FIXTURE_EVIDENCE_DIR="$PWD/.cache/tailcat-fixtures" \
            DD_INSTRUMENT_SERVICE_WITH_APM=false "$@"
          SH
          bash .cache/tailcat-evidence/clean-env.sh pnpm run generate:build-config 2>&1 | tee .cache/tailcat-evidence/build-config.log
          bash .cache/tailcat-evidence/clean-env.sh pnpm run generate:ipc-channels 2>&1 | tee .cache/tailcat-evidence/ipc.log
          bash .cache/tailcat-evidence/clean-env.sh pnpm run generate:i18n 2>&1 | tee .cache/tailcat-evidence/i18n.log
          bash .cache/tailcat-evidence/clean-env.sh pnpm exec vitest --version 2>&1 | tee .cache/tailcat-evidence/vitest-version.log
          node -e 'if(require("vitest/package.json").version!=="4.1.11")throw new Error("Vitest version drift")'
      - name: Prepare disposable macOS loopback prerequisite
        id: loopback
        if: runner.os == 'macOS'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          printf 'pid=%s\nppid=%s\nseconds=%s\n' "$$" "$PPID" "$SECONDS" > .cache/tailcat-evidence/loopback-native-start.txt
          trap 'loopback_exit=$?; printf "exit=%s\n" "$loopback_exit" > .cache/tailcat-evidence/loopback-native-end.txt' EXIT
          receipt=.cache/tailcat-evidence/loopback
          mkdir -p "$receipt"
          printf 'run=%s\nattempt=%s\njob=%s\nrunner=%s\nenvironment=%s\nos=%s\narch=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_NAME" \
            "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$receipt/identity.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          hostname > "$receipt/hostname.txt"
          sw_vers > "$receipt/os.txt"
          /sbin/ifconfig lo0 > "$receipt/before-ifconfig.txt"
          cat > "$receipt/probe.cjs" <<'JS'
          const net = require('node:net');
          const server = net.createServer();
          const timer = setTimeout(() => {
            console.error(JSON.stringify({event:'deadline',address:'127.0.0.2'}));
            process.exit(2);
          }, 5000);
          server.once('error', error => {
            clearTimeout(timer);
            console.log(JSON.stringify({event:'error',code:error.code,address:'127.0.0.2'}));
            process.exitCode = 1;
          });
          server.listen(0, '127.0.0.2', () => {
            const address = server.address();
            server.close(error => {
              clearTimeout(timer);
              console.log(JSON.stringify({event:'closed',address,error:error?.message}));
              if (error) process.exitCode = 1;
            });
          });
          JS
          set +e
          node "$receipt/probe.cjs" > "$receipt/before-probe.json" 2>&1
          before_exit=$?
          set -e
          printf '%s\n' "$before_exit" > "$receipt/before-probe-exit.txt"
          if [ "$before_exit" -eq 0 ]; then
            printf 'already-bindable; no mutation owned\n' > "$receipt/ownership.txt"
          else
            test "$before_exit" -eq 1
            node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));if(r.code!=="EADDRNOTAVAIL")process.exit(1)' "$receipt/before-probe.json"
            if awk '$1 == "inet" && $2 == "127.0.0.2" { found = 1 } END { exit !found }' "$receipt/before-ifconfig.txt"; then
              printf 'Address was already configured but could not bind; refusing mutation.\n' >&2
              exit 1
            fi
            cp "$receipt/identity.txt" "$receipt/mutation-intent.txt"
            set +e
            # The runner owns this log; only the interface command needs sudo.
          # shellcheck disable=SC2024
          sudo -n /sbin/ifconfig lo0 inet 127.0.0.2 netmask 255.255.255.255 alias > "$receipt/add.log" 2>&1
            add_exit=$?
            set -e
            printf '%s\n' "$add_exit" > "$receipt/add-exit.txt"
            test "$add_exit" -eq 0
            cp "$receipt/identity.txt" "$receipt/added-by-this-job.txt"
            printf 'added by this disposable job; restoration required\n' > "$receipt/ownership.txt"
          fi
          /sbin/ifconfig lo0 > "$receipt/after-ifconfig.txt"
          set +e
          node "$receipt/probe.cjs" > "$receipt/after-probe.json" 2>&1
          after_exit=$?
          set -e
          printf '%s\n' "$after_exit" > "$receipt/after-probe-exit.txt"
          exit "$after_exit"
      - name: Source-bound focused cases, first attempt only
        id: focused
        env:
          PHASE: ${{ matrix.phase }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          pattern='reopens a saved Tailcat host without DNS and preserves spawn bytes'
          if [ "$PHASE" = diagnostic ]; then
            pattern="$pattern|rejects a wrong pin through a real saved Tailcat executable"
          fi
          date -u > .cache/tailcat-evidence/focused-started.txt
          set +e
          bash .cache/tailcat-evidence/clean-env.sh pnpm exec vitest run \
            src/features/backend/main/backend-connection.test.ts \
            --testNamePattern="$pattern" --maxWorkers=1 --retry=0 \
            --reporter=verbose --reporter=json --outputFile=.cache/tailcat-evidence/focused.json \
            2>&1 | tee .cache/tailcat-evidence/focused.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'vitest=%s\ntee=%s\n' "${statuses[0]}" "${statuses[1]}" > .cache/tailcat-evidence/focused-exit.txt
          date -u > .cache/tailcat-evidence/focused-ended.txt
          # A passing baseline stays passing; no expected-failure inversion.
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          node <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.cache/tailcat-evidence/focused.json', 'utf8'));
          const expected = process.env.PHASE === 'baseline' ? 2 : 8;
          if (report.numPassedTests !== expected || report.numFailedTests !== 0) {
            throw new Error(`Expected ${expected} passing focused cases, got ${report.numPassedTests}`);
          }
          JS
      - name: Full connection file and tunnel controls
        id: related
        if: success() && steps.focused.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          date -u > .cache/tailcat-evidence/related-started.txt
          set +e
          bash .cache/tailcat-evidence/clean-env.sh pnpm exec vitest run \
            src/features/backend/main/backend-connection.test.ts \
            src/features/backend/main/__tests__/tailcat-tunnel.test.ts \
            --maxWorkers=1 --retry=0 --reporter=verbose > .cache/tailcat-evidence/related.log 2>&1 &
          primary_pid=$!
          printf '%s\n' "$primary_pid" > .cache/tailcat-evidence/related-pid.txt
          wait "$primary_pid"
          primary_exit=$?
          printf 'vitest=%s\n' "$primary_exit" > .cache/tailcat-evidence/related-exit.txt
          receipt_exit=$?
          date -u > .cache/tailcat-evidence/related-ended.txt
          ended_exit=$?
          cat .cache/tailcat-evidence/related.log
          output_exit=$?
          set -e
          if [ "$primary_exit" -ne 0 ]; then exit "$primary_exit"; fi
          if [ "$receipt_exit" -ne 0 ]; then exit "$receipt_exit"; fi
          if [ "$ended_exit" -ne 0 ]; then exit "$ended_exit"; fi
          exit "$output_exit"
      - name: Restore only the loopback alias added by this job
        if: always() && runner.os == 'macOS' && steps.loopback.outcome != 'skipped'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          printf 'pid=%s\nppid=%s\nseconds=%s\n' "$$" "$PPID" "$SECONDS" > .cache/tailcat-evidence/restore-native-start.txt
          trap 'restore_exit=$?; printf "exit=%s\n" "$restore_exit" > .cache/tailcat-evidence/restore-native-end.txt' EXIT
          receipt=.cache/tailcat-evidence/loopback
          if [ ! -f "$receipt/added-by-this-job.txt" ]; then
            if [ -f "$receipt/mutation-intent.txt" ]; then
              printf 'Mutation intent exists without confirmed ownership; restoration unavailable.\n' > "$receipt/restoration.txt"
              exit 1
            fi
            printf 'No confirmed mutation by this job; nothing removed.\n' > "$receipt/restoration.txt"
            exit 0
          fi
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          printf 'run=%s\nattempt=%s\njob=%s\nrunner=%s\nenvironment=%s\nos=%s\narch=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_NAME" \
            "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH" > "$receipt/restoration-identity.txt"
          cmp "$receipt/added-by-this-job.txt" "$receipt/restoration-identity.txt"
          hostname > "$receipt/restoration-hostname.txt"
          cmp "$receipt/hostname.txt" "$receipt/restoration-hostname.txt"
          /sbin/ifconfig lo0 > "$receipt/restore-before-ifconfig.txt"
          set +e
          # The runner owns this log; only the interface command needs sudo.
          # shellcheck disable=SC2024
          sudo -n /sbin/ifconfig lo0 inet 127.0.0.2 -alias > "$receipt/remove.log" 2>&1
          remove_exit=$?
          set -e
          printf '%s\n' "$remove_exit" > "$receipt/remove-exit.txt"
          test "$remove_exit" -eq 0
          /sbin/ifconfig lo0 > "$receipt/restore-after-ifconfig.txt"
          if awk '$1 == "inet" && $2 == "127.0.0.2" { found = 1 } END { exit !found }' "$receipt/restore-after-ifconfig.txt"; then
            printf 'Owned alias still configured after removal.\n' > "$receipt/restoration.txt"
            exit 1
          fi
          set +e
          node "$receipt/probe.cjs" > "$receipt/restored-probe.json" 2>&1
          probe_exit=$?
          set -e
          printf '%s\n' "$probe_exit" > "$receipt/restored-probe-exit.txt"
          test "$probe_exit" -eq 1
          node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));if(r.code!=="EADDRNOTAVAIL")process.exit(1)' "$receipt/restored-probe.json"
          printf 'Owned alias removed; original unavailable binding restored.\n' > "$receipt/restoration.txt"
      - name: Inventory retained caches and actual fixture closure
        if: always() && steps.setup.outcome == 'success'
        timeout-minutes: 1
        env:
          PHASE: ${{ matrix.phase }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs'), path = require('node:path');
          const root = fs.readFileSync('.cache/tailcat-evidence/tmp-root', 'utf8').trim();
          const entries = fs.readdirSync(root, {withFileTypes:true}).map(entry => ({
            name:entry.name,
            directory:entry.isDirectory(),
            expectedHelperCache:entry.isDirectory() && /^(node-compile-cache|tsx-\d+)$/.test(entry.name),
          }));
          const fixtures = fs.readdirSync('.cache/tailcat-fixtures', {withFileTypes:true});
          const receipts = [], errors = [];
          for (const entry of fixtures) {
            const file = path.join('.cache/tailcat-fixtures', entry.name);
            if (!entry.isFile() || !/^tailcat-reconnect-[\w-]+\.json$/.test(entry.name)) {
              errors.push(`Retained or unknown fixture entry: ${file}`);
              continue;
            }
            try {
              const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
              receipts.push({file,receipt});
              if (receipt.closeConfirmed !== true || !Array.isArray(receipt.children) || !receipt.children.length ||
                  receipt.children.some(child => typeof child.closeMs !== 'number' ||
                    (child.code == null && child.signal == null))) errors.push(`Child closure unavailable: ${file}`);
            } catch (error) {
              errors.push(`Unreadable receipt ${file}: ${error.message}`);
            }
          }
          for (const entry of entries) {
            if (!entry.expectedHelperCache) errors.push(`Unknown temporary entry: ${path.join(root, entry.name)}`);
          }
          if (process.env.PHASE === 'diagnostic' && !receipts.length) errors.push('Diagnostic child receipts unavailable');
          const report = {root,entries,receipts,errors,
            baselineClosure:process.env.PHASE === 'baseline' ? 'not instrumented; no child-close inference' : undefined,
            retention:'No cache, fixture or receipt is deleted by this step; test failures remain independent.'};
          fs.writeFileSync('.cache/tailcat-evidence/settlement.json', JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          if (errors.length) process.exitCode = 1;
          JS
      - name: Record phase outcome, including unavailable test exit
        if: always()
        timeout-minutes: 1
        env:
          PHASE: ${{ matrix.phase }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          RELATED_OUTCOME: ${{ steps.related.outcome }}
        shell: bash
        run: |
          mkdir -p .cache/tailcat-evidence
          printf 'phase=%s\nfocused_outcome=%s\n' "$PHASE" "$FOCUSED_OUTCOME" > .cache/tailcat-evidence/outcome.txt
          printf 'related_outcome=%s\n' "$RELATED_OUTCOME" >> .cache/tailcat-evidence/outcome.txt
          if [ ! -f .cache/tailcat-evidence/related-exit.txt ]; then
            printf 'Full-suite primary exit unavailable; not a pass or cleanup proof.\n' >> .cache/tailcat-evidence/outcome.txt
          fi
          if [ ! -f .cache/tailcat-evidence/focused-exit.txt ]; then
            printf 'Test process exit unavailable; do not infer cleanup or retry permission.\n' >> .cache/tailcat-evidence/outcome.txt
          fi
      - name: Retain native and Linux receipts
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: tailcat-${{ matrix.platform }}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/tailcat-evidence/
            .cache/tailcat-fixtures/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
