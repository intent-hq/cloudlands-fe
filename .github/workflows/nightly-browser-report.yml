name: Report Nightly Browser Failures

on:
  workflow_run:
    workflows: [Nightly Browser Tests]
    types: [completed]

permissions:
  contents: read
  actions: read

# One central-tracker writer, including retries and different source runs.
concurrency:
  group: nightly-browser-issue-writer
  queue: max
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.repository == 'intent-hq/cloudlands-fe' &&
      github.event.workflow_run.head_repository.full_name == 'intent-hq/cloudlands-fe' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No dependency installation, test execution, artifact extraction or source
      # checkout from the triggering run. Both scripts are default-branch code.
      - name: Collect and validate browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/nightly-test-failures.mjs collect --run "$SOURCE_RUN_ID" --out "$RUNNER_TEMP/nightly-report"
      - name: File or update central tracker issues
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: node scripts/nightly-test-failures.mjs publish --out "$RUNNER_TEMP/nightly-report" --write
      - name: Preserve reporting evidence and retry plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-report-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-report/
          if-no-files-found: error
          retention-days: 7
