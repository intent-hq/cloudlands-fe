# Release-please (https://github.com/googleapis/release-please) in
# Release-PR mode — the Node analog of intentd's release-plz setup:
#
# - On every push to main it opens/updates a Release PR that bumps
#   `package.json` and CHANGELOG.md from conventional commits
#   (feat -> minor, fix -> patch, `type!:` / BREAKING CHANGE -> major).
# - Merging the Release PR creates the `vX.Y.Z` tag plus a GitHub Release on
#   this repo (the changelog anchor; user-facing artifacts stay on
#   `intent-hq/cloudlands-releases`).
#
# The action authenticates with the RELEASE_PAT secret instead of the default
# GITHUB_TOKEN: tags and PRs created with GITHUB_TOKEN do not trigger other
# workflows, and the release build must fire on the tag push. The PAT needs
# contents, pull-requests, AND issues write access (release-please labels its
# Release PRs via the issues API); the existing classic `repo`-scoped
# RELEASE_PAT covers all three.

name: Release-please

permissions: {}

on:
  push:
    branches: [main]

jobs:
  # The single job never uses the implicit GITHUB_TOKEN (the action
  # authenticates with the RELEASE_PAT PAT), so it inherits the top-level
  # `permissions: {}` and the implicit token stays powerless.
  release-please:
    name: Release-please
    runs-on: [self-hosted, Linux, X64]
    if: ${{ github.repository_owner == 'intent-hq' }}
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # RELEASE_PAT (not GITHUB_TOKEN) MUST be the action's token: the
          # action creates the vX.Y.Z tag + GitHub Release via the API with
          # this token, and GitHub's recursion guard suppresses workflow
          # triggers for events created with the default GITHUB_TOKEN — the
          # tag-triggered release-beta workflow would silently never fire.
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Anchor releases are betas: they carry the Pre-release badge until
      # release-stable.yml promotes the version (which clears the flag and
      # marks the version Latest). This cannot be done with the
      # `"prerelease": true` config option — release-please only honours it
      # for versions with a prerelease suffix or major 0 (manifest.ts:
      # `config.prerelease && (!!version.preRelease || version.major === 0)`),
      # and this repo releases plain 2.x versions. Fail-soft: a release that
      # stays non-prerelease is cosmetic and must never fail the workflow.
      - name: Mark anchor release as Pre-release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          REPO=intent-hq/cloudlands-fe
          if ! RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id'); then
            echo "::warning::Could not read release ${TAG} on ${REPO}; leaving its Pre-release flag untouched"
            exit 0
          fi
          if ! gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F prerelease=true >/dev/null; then
            echo "::warning::Could not mark ${TAG} on ${REPO} as Pre-release"
            exit 0
          fi
          echo "✓ ${TAG} marked as Pre-release on ${REPO}"
