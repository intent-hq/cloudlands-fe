name: Intent - Windows Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to roll back TO (e.g., 1.2.3)'
        required: true
        type: string
      reason:
        description: 'Reason for rollback (included in audit trail)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Expected semver (e.g., 1.2.3)"
            exit 1
          fi
          echo "Version $VERSION is valid"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Authenticate with GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.INTENT_GCP_SERVICE_ACCOUNT_KEY }}

      - name: Run Windows rollback
        env:
          GCS_BUCKET: ${{ secrets.INTENT_GCS_BUCKET }}
          GCP_PROJECT: ${{ secrets.INTENT_GCP_PROJECT }}
          CLOUD_CDN_URL_MAP: ${{ secrets.INTENT_CLOUD_CDN_URL_MAP }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          VERSION="${{ inputs.version }}"
          PRODUCT_NAME="Intent by Augment"
          WIN_EXE="${PRODUCT_NAME} Setup ${VERSION}.exe"

          # Authenticate
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --project="$GCP_PROJECT" --quiet

          # Verify target version Windows artifacts exist
          if ! gcloud storage stat "gs://$GCS_BUCKET/stable/$WIN_EXE" &>/dev/null; then
            echo "::error::Windows installer not found for v$VERSION: $WIN_EXE"
            exit 1
          fi
          echo "Found: $WIN_EXE"

          # Rewrite latest.yml manifest
          # Download EXE to compute sha512
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          gcloud storage cp "gs://$GCS_BUCKET/stable/$WIN_EXE" "$TMPDIR/$WIN_EXE" --quiet

          EXE_SHA512=$(openssl dgst -sha512 -binary "$TMPDIR/$WIN_EXE" | base64 | tr -d '\n')
          EXE_SIZE=$(stat -c%s "$TMPDIR/$WIN_EXE" 2>/dev/null || stat -f%z "$TMPDIR/$WIN_EXE")
          EXE_URL=$(echo "$WIN_EXE" | sed 's/ /%20/g')

          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          {
            echo "version: ${VERSION}"
            echo "files:"
            echo "  - url: ${EXE_URL}"
            echo "    sha512: ${EXE_SHA512}"
            echo "    size: ${EXE_SIZE}"
            echo "path: ${EXE_URL}"
            echo "sha512: ${EXE_SHA512}"
            echo "releaseDate: '${RELEASE_DATE}'"
          } > "$TMPDIR/latest.yml"

          gcloud storage cp "$TMPDIR/latest.yml" "gs://$GCS_BUCKET/stable/latest.yml" --content-type="application/x-yaml" --quiet

          # Update latest installer link
          gcloud storage cp "gs://$GCS_BUCKET/stable/$WIN_EXE" "gs://$GCS_BUCKET/stable/Intent-latest-Setup.exe" --quiet

          # Invalidate CDN cache
          gcloud compute url-maps invalidate-cdn-cache "$CLOUD_CDN_URL_MAP" \
            --path "/stable/latest.yml" --path "/stable/Intent-latest-Setup.exe" \
            --project="$GCP_PROJECT" --quiet

      - name: Validate rollback
        env:
          GCS_BUCKET: ${{ secrets.INTENT_GCS_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          VERSION="${{ inputs.version }}"
          echo "🔍 Validating stable latest.yml points at v$VERSION..."

          CONTENT=$(gcloud storage cat "gs://$GCS_BUCKET/stable/latest.yml" 2>/dev/null || true)
          if [ -z "$CONTENT" ]; then
            echo "::error::latest.yml not found after rollback"
            exit 1
          fi
          echo "$CONTENT"

          MANIFEST_VERSION=$(echo "$CONTENT" | grep "^version:" | awk '{print $2}')
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::latest.yml version is '$MANIFEST_VERSION', expected '$VERSION'"
            exit 1
          fi
          echo "✓ latest.yml points at v$VERSION"
          echo ""
          echo "✅ Windows rollback validation passed"

      - name: Post summary
        if: always()
        run: |
          VERSION="${{ inputs.version }}"
          REASON="${{ inputs.reason }}"
          STATUS="${{ job.status }}"

          echo "## ⚠️ Windows Emergency Rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REASON" ]; then
            echo "**Reason:** $REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Windows Stable Channel URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Windows Installer](https://cdn.augmentcode.com/stable/Intent-latest-Setup.exe)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Windows Manifest](https://cdn.augmentcode.com/stable/latest.yml)" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: always()
        run: |
          VERSION="${{ inputs.version }}"
          REASON="${{ inputs.reason }}"
          STATUS="${{ job.status }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="⚠️"
            STATUS_TEXT="completed"
          else
            EMOJI="🚨"
            STATUS_TEXT="FAILED"
          fi

          REASON_LINE=""
          if [ -n "$REASON" ]; then
            REASON_LINE="\\n*Reason:* ${REASON}"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"${EMOJI} Windows stable channel rollback to v${VERSION} ${STATUS_TEXT}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*${EMOJI} Windows Emergency Rollback — ${STATUS_TEXT}*\\n\\n*Version:* v${VERSION}\\n*Channel:* stable (Windows only)\\n*Triggered by:* ${{ github.actor }}${REASON_LINE}\"
                  }
                }
              ]
            }" \
            ${{ secrets.INTENT_SLACK_WEBHOOK_URL }}

