name: Release Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote to stable (e.g., 2.0.7)'
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release in progress
concurrency:
  group: cloudlands-stable-promotion
  cancel-in-progress: false

jobs:
  promote-to-stable:
    # Non-ephemeral self-hosted runner: all scratch files live under
    # RUNNER_TEMP (wiped by the runner between jobs) instead of /tmp, so a
    # previous run's assets can never leak into this promotion (#553).
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      # Fail fast if the self-hosted runner is missing a CLI tool the
      # promotion needs (all preinstalled on ubuntu-latest, not guaranteed
      # here) — a mid-promotion failure after assets were already uploaded
      # to the stable channel is much worse than an early abort.
      - name: Preflight required tools
        run: |
          MISSING=""
          for tool in gh jq curl awk sed sort; do
            command -v "$tool" >/dev/null 2>&1 || MISSING="$MISSING $tool"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Self-hosted runner is missing required tools:$MISSING"
            exit 1
          fi
          # Version-range computation needs GNU sort's -V
          if ! printf '1.0.0\n' | sort -V >/dev/null 2>&1; then
            echo "::error::sort on this runner does not support -V (GNU coreutils sort required)"
            exit 1
          fi
          echo "All required tools present"

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Expected stable version X.Y.Z (e.g., 2.0.7). Prerelease/build suffixes not allowed for stable promotions."
            exit 1
          fi
          echo "Stable version $VERSION is valid"

      - name: Verify versioned release exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PAT secret is required for this workflow"
            exit 1
          fi
          if ! gh release view "v${VERSION}" --repo intent-hq/cloudlands-releases >/dev/null 2>&1; then
            echo "::error::Versioned release v${VERSION} does not exist on intent-hq/cloudlands-releases"
            exit 1
          fi
          echo "Versioned release v${VERSION} exists"

      - name: Read current stable version
        id: stable_version
        run: |
          # Attempt to fetch latest-mac.yml from stable; tolerate 404 (first promotion)
          STABLE_YML_URL="https://github.com/intent-hq/cloudlands-releases/releases/download/stable/latest-mac.yml"
          PREV_STABLE=""
          
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o "$RUNNER_TEMP/stable-latest-mac.yml" "$STABLE_YML_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            PREV_STABLE=$(awk '/^version:/{print $2; exit}' "$RUNNER_TEMP/stable-latest-mac.yml" | tr -d '\r')
            if [ -z "$PREV_STABLE" ]; then
              echo "::error::Fetched stable latest-mac.yml but could not parse version"
              exit 1
            fi
            echo "Previous stable version: $PREV_STABLE"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "No prior stable release found (first promotion)"
          else
            echo "::error::Unexpected HTTP code $HTTP_CODE fetching stable latest-mac.yml"
            exit 1
          fi
          
          echo "prev_stable=$PREV_STABLE" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV_STABLE" ]; then
            echo "is_first_promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_first_promotion=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download versioned release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf "$RUNNER_TEMP/release-assets"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          gh release download "v${VERSION}" --repo intent-hq/cloudlands-releases
          echo "Downloaded assets:"
          ls -lh

      - name: Ensure stable release exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Check if 'stable' release already exists
          if gh release view stable --repo intent-hq/cloudlands-releases >/dev/null 2>&1; then
            echo "Rolling 'stable' release already exists"
          else
            echo "Creating rolling 'stable' release"
            gh release create stable \
              --repo intent-hq/cloudlands-releases \
              --title "Intent Stable Channel (Rolling)" \
              --notes "Rolling stable channel - points to the latest stable release. Auto-updater uses this." \
              --draft=false \
              --prerelease=false
          fi

      - name: Upload new assets to stable
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/release-assets"

          # Require latest-mac.yml
          if [ ! -f "latest-mac.yml" ]; then
            echo "::error::Missing required latest-mac.yml"
            exit 1
          fi

          # Build list of all downloaded assets except latest-mac.yml
          UPLOAD_FILES=()
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "latest-mac.yml" ]; then
              UPLOAD_FILES+=("$file")
            fi
          done

          # Upload all versioned assets first (no collision with existing stable assets)
          # Use --clobber for idempotency (re-running same version is safe)
          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            echo "Uploading versioned assets: ${UPLOAD_FILES[*]}"
            gh release upload stable --repo intent-hq/cloudlands-releases --clobber -- "${UPLOAD_FILES[@]}"
          fi

          # Replace latest-mac.yml last with --clobber (atomic switch of auto-updater feed)
          echo "Replacing latest-mac.yml (auto-updater feed)"
          gh release upload stable --repo intent-hq/cloudlands-releases --clobber -- latest-mac.yml

      - name: Delete previous version assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/release-assets"

          # Build allowlist of assets we just uploaded (don't delete these)
          PROMOTED_ASSETS=()
          for file in *; do
            if [ -f "$file" ]; then
              PROMOTED_ASSETS+=("$file")
            fi
          done

          # Clean up old versioned assets from stable release
          echo "Cleaning up old versioned assets (keeping newly promoted files)"
          gh release view stable --repo intent-hq/cloudlands-releases --json assets --jq '.assets[].name' | while read -r asset; do
            if [ -z "$asset" ]; then
              continue
            fi

            # Check if this asset is in our promoted list
            KEEP=false
            for promoted in "${PROMOTED_ASSETS[@]}"; do
              if [ "$asset" = "$promoted" ]; then
                KEEP=true
                break
              fi
            done

            if [ "$KEEP" = "false" ]; then
              echo "Deleting old asset: $asset"
              gh release delete-asset stable "$asset" --repo intent-hq/cloudlands-releases --yes
            else
              echo "Keeping promoted asset: $asset"
            fi
          done

      - name: Verify stable feed matches versioned release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Fetch versioned release sha512
          VERSIONED_SHA=$(curl -sfL "https://github.com/intent-hq/cloudlands-releases/releases/download/v${VERSION}/latest-mac.yml" | awk '/^sha512:/{print $2; exit}' | tr -d '\r')
          if [ -z "$VERSIONED_SHA" ]; then
            echo "::error::Failed to fetch or parse sha512 from versioned release v${VERSION}"
            exit 1
          fi

          # Retry stable feed fetch with exponential backoff (CDN propagation can take a few seconds)
          MAX_RETRIES=5
          RETRY_DELAY=2
          for i in $(seq 1 "$MAX_RETRIES"); do
            STABLE_SHA=$(curl -sL "https://github.com/intent-hq/cloudlands-releases/releases/download/stable/latest-mac.yml?t=$(date +%s)" | awk '/^sha512:/{print $2; exit}' | tr -d '\r')

            if [ -z "$STABLE_SHA" ]; then
              echo "::warning::Retry $i/$MAX_RETRIES: Failed to fetch or parse sha512 from stable release"
              if [ "$i" -lt "$MAX_RETRIES" ]; then
                sleep "$RETRY_DELAY"
                RETRY_DELAY=$((RETRY_DELAY * 2))
                continue
              else
                echo "::error::Failed to fetch stable sha512 after $MAX_RETRIES retries"
                exit 1
              fi
            fi

            if [ "$VERSIONED_SHA" = "$STABLE_SHA" ]; then
              echo "✓ Stable feed sha512 matches versioned release ($VERSIONED_SHA) [attempt $i]"
              break
            else
              echo "::warning::Retry $i/$MAX_RETRIES: sha512 mismatch - versioned: $VERSIONED_SHA, stable: $STABLE_SHA (likely CDN propagation delay)"
              if [ "$i" -lt "$MAX_RETRIES" ]; then
                sleep "$RETRY_DELAY"
                RETRY_DELAY=$((RETRY_DELAY * 2))
              else
                echo "::error::sha512 mismatch after $MAX_RETRIES retries - versioned: $VERSIONED_SHA, stable: $STABLE_SHA"
                exit 1
              fi
            fi
          done

      # The summary script ships with the repo; check out the promoted tag so the
      # script version matches the promoted release. Non-fatal: a failed checkout
      # only skips the summary section (promotion never fails because of notes).
      - name: Checkout repo at promoted tag
        id: checkout_tag
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: refs/tags/v${{ inputs.version }}

      # The self-hosted Linux runner has no system Node; the summary generator
      # below needs one. Fail-soft like the rest of the notes pipeline — a
      # setup failure only skips the summary section.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version: '22'

      # Recover the intentd pins for the consolidated delta: the promoted
      # version's manifest was downloaded with the release assets; the previous
      # stable's manifest comes from its versioned release. All fail-soft —
      # missing manifests just degrade the summary to pin line(s) or nothing.
      # continue-on-error makes the "notes never fail the promotion" guarantee
      # structural rather than relying on the shell guards staying exhaustive.
      - name: Resolve intentd pin range
        id: intentd_pins
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PREV_STABLE: ${{ steps.stable_version.outputs.prev_stable }}
        run: |
          HEAD_PIN=""
          BASE_PIN=""

          if [ -f "$RUNNER_TEMP/release-assets/release-manifest.json" ]; then
            HEAD_PIN=$(jq -r '.intentdVersion // empty' "$RUNNER_TEMP/release-assets/release-manifest.json" 2>/dev/null || true)
          fi
          if [ -z "$HEAD_PIN" ]; then
            echo "::warning::No intentdVersion in the promoted release's manifest - the consolidated intentd section will be omitted"
          fi

          if [ -n "$PREV_STABLE" ]; then
            rm -rf "$RUNNER_TEMP/prev-stable-manifest"
            mkdir -p "$RUNNER_TEMP/prev-stable-manifest"
            if gh release download "v${PREV_STABLE}" --repo intent-hq/cloudlands-releases \
                --pattern release-manifest.json --dir "$RUNNER_TEMP/prev-stable-manifest" 2>/dev/null; then
              BASE_PIN=$(jq -r '.intentdVersion // empty' "$RUNNER_TEMP/prev-stable-manifest/release-manifest.json" 2>/dev/null || true)
            fi
            if [ -z "$BASE_PIN" ]; then
              echo "::warning::No recoverable intentd pin for previous stable v${PREV_STABLE} - the summary degrades to the pin line"
            fi
          fi

          echo "head=$HEAD_PIN" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_PIN" >> "$GITHUB_OUTPUT"
          echo "intentd pin range: base='${BASE_PIN:-<none>}' head='${HEAD_PIN:-<none>}'"

      # Renders the leading summary (promoted version, previous stable, and the
      # consolidated intentd delta across the whole stable range). Fail-soft: any
      # failure just drops the summary from the aggregated notes; continue-on-error
      # makes that guarantee structural rather than relying on the shell guards.
      - name: Generate stable summary section
        continue-on-error: true
        env:
          INTENTD_TOKEN: ${{ secrets.INTENTD_READ_PAT }}
          VERSION: ${{ inputs.version }}
          PREV_STABLE: ${{ steps.stable_version.outputs.prev_stable }}
          INTENTD_HEAD: ${{ steps.intentd_pins.outputs.head }}
          INTENTD_BASE: ${{ steps.intentd_pins.outputs.base }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_tag.outcome }}
        run: |
          # Gate on the actual checkout outcome; a bare -f check could pass against
          # stale workspace contents that don't match the promoted tag
          if [ "$CHECKOUT_OUTCOME" != "success" ]; then
            echo "::warning::Checkout of promoted tag failed (outcome: $CHECKOUT_OUTCOME) - skipping summary section"
            exit 0
          fi
          if [ ! -f scripts/generate-stable-summary.mjs ]; then
            echo "::warning::scripts/generate-stable-summary.mjs not found - skipping summary section"
            exit 0
          fi

          ARGS=(--version "$VERSION" --out "$RUNNER_TEMP/stable-summary.md")
          if [ -n "$PREV_STABLE" ]; then
            ARGS+=(--prev-stable "$PREV_STABLE")
          fi
          if [ -n "$INTENTD_HEAD" ]; then
            ARGS+=(--intentd-version "$INTENTD_HEAD")
          fi
          if [ -n "$INTENTD_BASE" ]; then
            ARGS+=(--intentd-base "$INTENTD_BASE")
          fi

          if ! node scripts/generate-stable-summary.mjs "${ARGS[@]}"; then
            echo "::warning::Stable summary generation failed - continuing without the summary section"
            rm -f "$RUNNER_TEMP/stable-summary.md"
          fi

      - name: Build aggregated release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
          PREV_STABLE: ${{ steps.stable_version.outputs.prev_stable }}
          IS_FIRST: ${{ steps.stable_version.outputs.is_first_promotion }}
        run: |
          set -o pipefail
          # List all stable versioned releases (vX.Y.Z only, filtered by tag pattern)
          gh release list --repo intent-hq/cloudlands-releases --limit 1000 --json tagName \
            --jq '.[] | select(.tagName | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) | .tagName' \
            | sed 's/^v//' \
            | sort -V -r > "$RUNNER_TEMP/all-versions.txt"

          # Determine range: (prevStable, version]
          if [ "$IS_FIRST" = "true" ]; then
            # First promotion: only include the target version
            echo "$VERSION" > "$RUNNER_TEMP/range-versions.txt"
          elif [ "$PREV_STABLE" = "$VERSION" ]; then
            # Idempotent re-run: same version promoted again, use just this version
            echo "Re-promoting same version $VERSION (idempotent)"
            echo "$VERSION" > "$RUNNER_TEMP/range-versions.txt"
          else
            # Steady-state: include all versions > prevStable and <= version
            # First validate prevStable exists in the list
            if ! grep -qFx "$PREV_STABLE" "$RUNNER_TEMP/all-versions.txt"; then
              echo "::error::Previous stable version $PREV_STABLE not found in release list"
              exit 1
            fi

            # Validate VERSION exists in the list
            if ! grep -qFx "$VERSION" "$RUNNER_TEMP/all-versions.txt"; then
              echo "::error::Target version $VERSION not found in release list - ensure v$VERSION release exists"
              exit 1
            fi

            # Validate VERSION > PREV_STABLE using semver sort
            SORTED_PAIR=$(printf "%s\n%s" "$PREV_STABLE" "$VERSION" | sort -V)
            OLDER=$(echo "$SORTED_PAIR" | head -n1)
            if [ "$OLDER" != "$PREV_STABLE" ]; then
              echo "::error::Target version $VERSION is not greater than previous stable $PREV_STABLE - cannot promote an older version to stable"
              exit 1
            fi

            awk -v prev="$PREV_STABLE" -v target="$VERSION" '
              BEGIN { found_target=0; found_prev=0; }
              {
                if ($1 == target) found_target=1;
                if ($1 == prev) found_prev=1;
                if (found_target && !found_prev) print $1;
              }
            ' "$RUNNER_TEMP/all-versions.txt" > "$RUNNER_TEMP/range-versions.txt"
          fi

          # Validate we have at least one version in the range
          if [ ! -s "$RUNNER_TEMP/range-versions.txt" ]; then
            echo "::error::No versions found in range (prevStable, version] - check that both versions exist in releases"
            exit 1
          fi

          echo "Versions to include in aggregated notes:"
          cat "$RUNNER_TEMP/range-versions.txt"

          # Prepend the summary section (if generated), then the per-version bodies
          {
            if [ -f "$RUNNER_TEMP/stable-summary.md" ]; then
              cat "$RUNNER_TEMP/stable-summary.md"
              echo ""
              echo "---"
              echo ""
            fi
            while IFS= read -r ver; do
              echo "## v${ver}"
              echo ""
              gh release view "v${ver}" --repo intent-hq/cloudlands-releases --json body --jq '.body // ""'
              echo ""
            done < "$RUNNER_TEMP/range-versions.txt"
          } > "$RUNNER_TEMP/aggregated-notes.md"

          echo "Aggregated notes preview (first 20 lines):"
          head -n 20 "$RUNNER_TEMP/aggregated-notes.md"

      - name: Update stable release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release edit stable --repo intent-hq/cloudlands-releases --notes-file "$RUNNER_TEMP/aggregated-notes.md"
          echo "✓ Stable release notes updated"

      - name: Post summary
        env:
          VERSION: ${{ inputs.version }}
          PREV_STABLE: ${{ steps.stable_version.outputs.prev_stable }}
          IS_FIRST: ${{ steps.stable_version.outputs.is_first_promotion }}
        run: |
          {
            echo "## Stable Promotion"
            echo ""
            echo "**Promoted version:** v$VERSION"
            if [ "$IS_FIRST" = "true" ]; then
              echo "**Previous stable:** (none - first promotion)"
            else
              echo "**Previous stable:** v$PREV_STABLE"
            fi
            echo ""
            echo "### Download URLs"
            echo "- [Rolling stable channel](https://github.com/intent-hq/cloudlands-releases/releases/tag/stable)"
            echo "- [Auto-updater feed](https://github.com/intent-hq/cloudlands-releases/releases/download/stable/latest-mac.yml)"
            echo ""
            echo "### Verification"
            echo "- ✓ Assets copied from versioned release v$VERSION"
            echo "- ✓ sha512 verification passed"
            echo "- ✓ Aggregated release notes updated"
          } >> "$GITHUB_STEP_SUMMARY"
