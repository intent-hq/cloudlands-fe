# Promotes an existing versioned release into the rolling *stable* channel —
# the stable counterpart of promote-beta.yml. Channel model: every tag build
# publishes to the rolling 'alpha' release (release-alpha.yml); beta and
# stable are manual promotions of an existing versioned release (no new
# build). A beta-first guard fails fast when the promoted version has not
# been promoted to the beta channel yet (beta feed version >= promoted
# version); the skip_beta_check input bypasses it for emergencies.
name: Release Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote to stable (e.g., 2.0.7)'
        required: true
        type: string
      notes_base:
        description: 'Optional override of the aggregated-notes range base (e.g., 2.0.5) - rebuilds the stable notes from (notes_base, version] for manual repair'
        required: false
        type: string
      skip_beta_check:
        description: 'Skip the beta-first guard (promote to stable even if the version never reached beta) - emergency use only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Never cancel a release in progress
concurrency:
  group: cloudlands-stable-promotion
  cancel-in-progress: false

jobs:
  promote-to-stable:
    # GH-hosted larger runner (ephemeral): download/re-upload-heavy promotion
    # work. Scratch files still live under RUNNER_TEMP — harmless on an
    # ephemeral runner and it keeps the guarantee that a previous run's
    # assets can never leak into this promotion (#553) even if this ever
    # moves back to a persistent runner.
    runs-on: gh-linux-8x
    timeout-minutes: 30

    steps:
      # Fail fast if the runner is missing a CLI tool the promotion needs
      # (all preinstalled on GH-hosted images, so this is expected to always
      # pass) — a mid-promotion failure after assets were already uploaded
      # to the stable channel is much worse than an early abort.
      - name: Preflight required tools
        run: |
          MISSING=""
          for tool in gh jq curl awk sed sort; do
            command -v "$tool" >/dev/null 2>&1 || MISSING="$MISSING $tool"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Runner is missing required tools:$MISSING"
            exit 1
          fi
          # Version-range computation needs GNU sort's -V
          if ! printf '1.0.0\n' | sort -V >/dev/null 2>&1; then
            echo "::error::sort on this runner does not support -V (GNU coreutils sort required)"
            exit 1
          fi
          echo "All required tools present"

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Expected stable version X.Y.Z (e.g., 2.0.7). Prerelease/build suffixes not allowed for stable promotions."
            exit 1
          fi
          echo "Stable version $VERSION is valid"

      - name: Verify versioned release exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PAT secret is required for this workflow"
            exit 1
          fi
          if ! gh release view "v${VERSION}" --repo intent-hq/cloudlands-releases >/dev/null 2>&1; then
            echo "::error::Versioned release v${VERSION} does not exist on intent-hq/cloudlands-releases"
            exit 1
          fi
          echo "Versioned release v${VERSION} exists"

      # Beta-first guard: a version must have been promoted to the beta
      # channel before it can be promoted to stable. Runs before any asset
      # is downloaded or uploaded so a beta-skipping dispatch aborts while
      # the live stable channel is still untouched. The beta channel rolls
      # forward, so "promoted to beta" is verified as: the current beta feed
      # version is >= the promoted version.
      - name: Verify version was promoted to beta
        env:
          VERSION: ${{ inputs.version }}
          SKIP_BETA_CHECK: ${{ inputs.skip_beta_check }}
        run: |
          if [ "$SKIP_BETA_CHECK" = "true" ]; then
            echo "::warning::skip_beta_check is set - bypassing the beta-first guard for v${VERSION}"
            exit 0
          fi

          BETA_YML_URL="https://github.com/intent-hq/cloudlands-releases/releases/download/beta/latest-mac.yml"
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o "$RUNNER_TEMP/beta-latest-mac.yml" "$BETA_YML_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            BETA_VERSION=$(awk '/^version:/{print $2; exit}' "$RUNNER_TEMP/beta-latest-mac.yml" | tr -d '\r')
            if [ -z "$BETA_VERSION" ]; then
              echo "::error::Fetched beta latest-mac.yml but could not parse version - version $VERSION was never promoted to beta? Promote it to beta first (Promote Beta workflow), or re-run with skip_beta_check to bypass."
              exit 1
            fi
            # Guard against pre-channel-model beta feeds: a prerelease-suffixed
            # version (e.g. 2.0.7-beta.1, written directly by an old tag build)
            # was never promoted by the Promote Beta workflow, and sort -V
            # orders it AFTER its base version (the opposite of semver), so it
            # must be rejected before the comparison below.
            if [[ ! "$BETA_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Beta feed version '$BETA_VERSION' is not a promoted X.Y.Z version (pre-channel-model beta feed?) - version $VERSION was never promoted to beta. Promote it to beta first (Promote Beta workflow), or re-run with skip_beta_check to bypass."
              exit 1
            fi
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "::error::No beta channel feed found - version $VERSION was never promoted to beta. Promote it to beta first (Promote Beta workflow), or re-run with skip_beta_check to bypass."
            exit 1
          else
            echo "::error::Unexpected HTTP code $HTTP_CODE fetching beta latest-mac.yml"
            exit 1
          fi

          # Fail when beta version < promoted version (semver)
          if [ "$BETA_VERSION" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$BETA_VERSION" "$VERSION" | sort -V | head -n1)" = "$BETA_VERSION" ]; then
            echo "::error::Current beta version $BETA_VERSION is older than $VERSION - version $VERSION was never promoted to beta. Promote it to beta first (Promote Beta workflow), or re-run with skip_beta_check to bypass."
            exit 1
          fi
          echo "Beta-first guard passed: beta channel is at $BETA_VERSION (>= $VERSION)"

      - name: Read current stable version
        id: stable_version
        run: |
          # Attempt to fetch latest-mac.yml from stable; tolerate 404 (first promotion)
          STABLE_YML_URL="https://github.com/intent-hq/cloudlands-releases/releases/download/stable/latest-mac.yml"
          PREV_STABLE=""

          HTTP_CODE=$(curl -sL -w "%{http_code}" -o "$RUNNER_TEMP/stable-latest-mac.yml" "$STABLE_YML_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            PREV_STABLE=$(awk '/^version:/{print $2; exit}' "$RUNNER_TEMP/stable-latest-mac.yml" | tr -d '\r')
            if [ -z "$PREV_STABLE" ]; then
              echo "::error::Fetched stable latest-mac.yml but could not parse version"
              exit 1
            fi
            echo "Previous stable version: $PREV_STABLE"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "No prior stable release found (first promotion)"
          else
            echo "::error::Unexpected HTTP code $HTTP_CODE fetching stable latest-mac.yml"
            exit 1
          fi

          echo "prev_stable=$PREV_STABLE" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV_STABLE" ]; then
            echo "is_first_promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_first_promotion=false" >> "$GITHUB_OUTPUT"
          fi

      # Resolves the notes range base — the exclusive lower bound of the
      # aggregated-notes range (base, version] — before any asset is touched,
      # so a bad notes_base dispatch aborts while the live stable channel is
      # still untouched. Priority: explicit notes_base input (manual repair) >
      # on an idempotent re-run (prev == version), the notes-base marker
      # embedded in the current rolling body (so a re-run rebuilds the full
      # aggregate instead of collapsing it to one section) > previous stable.
      # Without a marker (legacy body) the notes rewrite is skipped entirely,
      # preserving the existing body.
      - name: Resolve notes range base
        id: notes_base
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
          NOTES_BASE_INPUT: ${{ inputs.notes_base }}
          PREV_STABLE: ${{ steps.stable_version.outputs.prev_stable }}
          IS_FIRST: ${{ steps.stable_version.outputs.is_first_promotion }}
        run: |
          set -o pipefail
          # $1 strictly older than $2 (semver)
          version_is_older() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]
          }

          # Guard: never move the stable channel backwards. Checked here, on
          # every path (including the notes_base override, whose own validation
          # only relates notes_base to VERSION), before any asset is touched.
          if [ "$IS_FIRST" != "true" ] && [ "$PREV_STABLE" != "$VERSION" ]; then
            if ! version_is_older "$PREV_STABLE" "$VERSION"; then
              echo "::error::Target version $VERSION is not greater than previous stable $PREV_STABLE - cannot promote an older version to stable"
              exit 1
            fi
          fi

          NOTES_BASE=""
          SKIP_NOTES=false
          if [ -n "$NOTES_BASE_INPUT" ]; then
            if [[ ! "$NOTES_BASE_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid notes_base '$NOTES_BASE_INPUT'. Expected version X.Y.Z (e.g., 2.0.5)"
              exit 1
            fi
            if ! gh release view "v${NOTES_BASE_INPUT}" --repo intent-hq/cloudlands-releases >/dev/null 2>&1; then
              echo "::error::notes_base release v${NOTES_BASE_INPUT} does not exist on intent-hq/cloudlands-releases"
              exit 1
            fi
            if ! version_is_older "$NOTES_BASE_INPUT" "$VERSION"; then
              echo "::error::notes_base $NOTES_BASE_INPUT must be older than promoted version $VERSION"
              exit 1
            fi
            NOTES_BASE="$NOTES_BASE_INPUT"
            echo "Using notes_base override: $NOTES_BASE"
          elif [ "$IS_FIRST" != "true" ] && [ "$PREV_STABLE" = "$VERSION" ]; then
            # Idempotent re-run: the stable feed already reads $VERSION, so
            # the previous-stable read cannot recover the range base. Recover
            # it from the notes-base marker in the current rolling body.
            echo "Re-promoting same version $VERSION (idempotent)"
            BODY_READ_OK=true
            STABLE_BODY=$(gh release view stable --repo intent-hq/cloudlands-releases --json body --jq '.body // ""' 2>/dev/null) || BODY_READ_OK=false
            MARKER=""
            if [ "$BODY_READ_OK" = "true" ]; then
              MARKER=$(printf '%s\n' "$STABLE_BODY" \
                | tr -d '\r' \
                | sed -n -E 's/.*<!-- notes-base: ((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) -->.*/\1/p' \
                | head -n1)
            fi
            if [ "$BODY_READ_OK" != "true" ]; then
              echo "::warning::Could not read the current stable release body - leaving the existing notes untouched"
              SKIP_NOTES=true
            elif [ -z "$MARKER" ]; then
              echo "::warning::No notes-base marker in the current stable notes - leaving the existing notes untouched"
              SKIP_NOTES=true
            elif ! gh release view "v${MARKER}" --repo intent-hq/cloudlands-releases >/dev/null 2>&1 || ! version_is_older "$MARKER" "$VERSION"; then
              echo "::warning::notes-base marker '$MARKER' is not an existing release older than $VERSION - leaving the existing notes untouched"
              SKIP_NOTES=true
            else
              NOTES_BASE="$MARKER"
              echo "Rebuilding aggregated notes from marker base: $NOTES_BASE"
            fi
          elif [ "$IS_FIRST" != "true" ]; then
            NOTES_BASE="$PREV_STABLE"
          fi

          echo "base=$NOTES_BASE" >> "$GITHUB_OUTPUT"
          echo "skip_notes=$SKIP_NOTES" >> "$GITHUB_OUTPUT"

      - name: Download versioned release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf "$RUNNER_TEMP/release-assets"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          gh release download "v${VERSION}" --repo intent-hq/cloudlands-releases
          echo "Downloaded assets:"
          ls -lh

      - name: Ensure stable release exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Check if 'stable' release already exists
          if gh release view stable --repo intent-hq/cloudlands-releases >/dev/null 2>&1; then
            echo "Rolling 'stable' release already exists"
          else
            echo "Creating rolling 'stable' release"
            gh release create stable \
              --repo intent-hq/cloudlands-releases \
              --title "Intent Stable Channel (Rolling)" \
              --notes "Rolling stable channel - points to the latest stable release. Auto-updater uses this." \
              --draft=false \
              --prerelease=false
          fi

      - name: Upload new assets to stable
        id: upload_assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/release-assets"

          # Auto-updater feed files, one per platform. latest-mac.yml is
          # required; the others are promoted when present so older mac-only
          # releases can still be promoted.
          FEED_FILES=(latest-mac.yml latest.yml latest-linux.yml latest-linux-arm64.yml)

          if [ ! -f "latest-mac.yml" ]; then
            echo "::error::Missing required latest-mac.yml"
            exit 1
          fi

          PROMOTED_FEEDS=()
          for feed in "${FEED_FILES[@]}"; do
            if [ -f "$feed" ]; then
              PROMOTED_FEEDS+=("$feed")
            else
              echo "::warning::Feed file $feed not present in v${VERSION} - skipping (release predates Windows/Linux builds?)"
            fi
          done

          # Build list of all downloaded assets except the feed files
          UPLOAD_FILES=()
          for file in *; do
            IS_FEED=false
            for feed in "${FEED_FILES[@]}"; do
              if [ "$file" = "$feed" ]; then
                IS_FEED=true
                break
              fi
            done
            if [ -f "$file" ] && [ "$IS_FEED" = "false" ]; then
              UPLOAD_FILES+=("$file")
            fi
          done

          # Upload all versioned assets first (no collision with existing stable assets)
          # Use --clobber for idempotency (re-running same version is safe)
          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            echo "Uploading versioned assets: ${UPLOAD_FILES[*]}"
            gh release upload stable --repo intent-hq/cloudlands-releases --clobber -- "${UPLOAD_FILES[@]}"
          fi

          # Replace the feed files last with --clobber (atomic switch of all
          # auto-updater feeds, after every referenced asset is in place)
          echo "Replacing auto-updater feeds: ${PROMOTED_FEEDS[*]}"
          gh release upload stable --repo intent-hq/cloudlands-releases --clobber -- "${PROMOTED_FEEDS[@]}"

          echo "promoted_feeds=${PROMOTED_FEEDS[*]}" >> "$GITHUB_OUTPUT"

      - name: Delete previous version assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/release-assets"

          # Build allowlist of assets we just uploaded (don't delete these)
          PROMOTED_ASSETS=()
          for file in *; do
            if [ -f "$file" ]; then
              PROMOTED_ASSETS+=("$file")
            fi
          done

          # Clean up old versioned assets from stable release
          echo "Cleaning up old versioned assets (keeping newly promoted files)"
          gh release view stable --repo intent-hq/cloudlands-releases --json assets --jq '.assets[].name' | while read -r asset; do
            if [ -z "$asset" ]; then
              continue
            fi

            # Check if this asset is in our promoted list
            KEEP=false
            for promoted in "${PROMOTED_ASSETS[@]}"; do
              if [ "$asset" = "$promoted" ]; then
                KEEP=true
                break
              fi
            done

            if [ "$KEEP" = "false" ]; then
              echo "Deleting old asset: $asset"
              gh release delete-asset stable "$asset" --repo intent-hq/cloudlands-releases --yes
            else
              echo "Keeping promoted asset: $asset"
            fi
          done

      - name: Verify stable feeds match versioned release
        env:
          VERSION: ${{ inputs.version }}
          PROMOTED_FEEDS: ${{ steps.upload_assets.outputs.promoted_feeds }}
        run: |
          read -ra FEEDS <<< "$PROMOTED_FEEDS"
          if [ ${#FEEDS[@]} -eq 0 ]; then
            echo "::error::No promoted feeds recorded by the upload step"
            exit 1
          fi

          for feed in "${FEEDS[@]}"; do
            echo "Verifying $feed"

            # Fetch versioned release sha512
            VERSIONED_SHA=$(curl -sfL "https://github.com/intent-hq/cloudlands-releases/releases/download/v${VERSION}/${feed}" | awk '/^sha512:/{print $2; exit}' | tr -d '\r')
            if [ -z "$VERSIONED_SHA" ]; then
              echo "::error::Failed to fetch or parse sha512 for $feed from versioned release v${VERSION}"
              exit 1
            fi

            # Retry stable feed fetch with exponential backoff (CDN propagation can take a few seconds)
            MAX_RETRIES=5
            RETRY_DELAY=2
            for i in $(seq 1 "$MAX_RETRIES"); do
              STABLE_SHA=$(curl -sL "https://github.com/intent-hq/cloudlands-releases/releases/download/stable/${feed}?t=$(date +%s)" | awk '/^sha512:/{print $2; exit}' | tr -d '\r')

              if [ -z "$STABLE_SHA" ]; then
                echo "::warning::Retry $i/$MAX_RETRIES: Failed to fetch or parse sha512 for $feed from stable release"
                if [ "$i" -lt "$MAX_RETRIES" ]; then
                  sleep "$RETRY_DELAY"
                  RETRY_DELAY=$((RETRY_DELAY * 2))
                  continue
                else
                  echo "::error::Failed to fetch stable sha512 for $feed after $MAX_RETRIES retries"
                  exit 1
                fi
              fi

              if [ "$VERSIONED_SHA" = "$STABLE_SHA" ]; then
                echo "✓ Stable $feed sha512 matches versioned release ($VERSIONED_SHA) [attempt $i]"
                break
              else
                echo "::warning::Retry $i/$MAX_RETRIES: $feed sha512 mismatch - versioned: $VERSIONED_SHA, stable: $STABLE_SHA (likely CDN propagation delay)"
                if [ "$i" -lt "$MAX_RETRIES" ]; then
                  sleep "$RETRY_DELAY"
                  RETRY_DELAY=$((RETRY_DELAY * 2))
                else
                  echo "::error::$feed sha512 mismatch after $MAX_RETRIES retries - versioned: $VERSIONED_SHA, stable: $STABLE_SHA"
                  exit 1
                fi
              fi
            done
          done

      # The summary script ships with the repo; check out the promoted tag so the
      # script version matches the promoted release. Non-fatal: a failed checkout
      # only skips the summary section (promotion never fails because of notes).
      - name: Checkout repo at promoted tag
        id: checkout_tag
        if: steps.notes_base.outputs.skip_notes != 'true'
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: refs/tags/v${{ inputs.version }}

      # Pin the Node version the summary generator below runs on (GH-hosted
      # images ship a system Node, but the pinned version keeps the output
      # reproducible). Fail-soft like the rest of the notes pipeline — a
      # setup failure only skips the summary section.
      - name: Setup Node.js
        if: steps.notes_base.outputs.skip_notes != 'true'
        uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version: '22'

      # Recover the intentd pins for the consolidated delta: the promoted
      # version's manifest was downloaded with the release assets; the range
      # base's manifest comes from its versioned release. All fail-soft —
      # missing manifests just degrade the summary to pin line(s) or nothing.
      # continue-on-error makes the "notes never fail the promotion" guarantee
      # structural rather than relying on the shell guards staying exhaustive.
      - name: Resolve intentd pin range
        id: intentd_pins
        if: steps.notes_base.outputs.skip_notes != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PREV_STABLE: ${{ steps.notes_base.outputs.base }}
        run: |
          HEAD_PIN=""
          BASE_PIN=""

          if [ -f "$RUNNER_TEMP/release-assets/release-manifest.json" ]; then
            HEAD_PIN=$(jq -r '.intentdVersion // empty' "$RUNNER_TEMP/release-assets/release-manifest.json" 2>/dev/null || true)
          fi
          if [ -z "$HEAD_PIN" ]; then
            echo "::warning::No intentdVersion in the promoted release's manifest - the consolidated intentd section will be omitted"
          fi

          if [ -n "$PREV_STABLE" ]; then
            rm -rf "$RUNNER_TEMP/prev-stable-manifest"
            mkdir -p "$RUNNER_TEMP/prev-stable-manifest"
            if gh release download "v${PREV_STABLE}" --repo intent-hq/cloudlands-releases \
                --pattern release-manifest.json --dir "$RUNNER_TEMP/prev-stable-manifest" 2>/dev/null; then
              BASE_PIN=$(jq -r '.intentdVersion // empty' "$RUNNER_TEMP/prev-stable-manifest/release-manifest.json" 2>/dev/null || true)
            fi
            if [ -z "$BASE_PIN" ]; then
              echo "::warning::No recoverable intentd pin for previous stable v${PREV_STABLE} - the summary degrades to the pin line"
            fi
          fi

          echo "head=$HEAD_PIN" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_PIN" >> "$GITHUB_OUTPUT"
          echo "intentd pin range: base='${BASE_PIN:-<none>}' head='${HEAD_PIN:-<none>}'"

      # Renders the leading summary (promoted version, previous stable, and the
      # consolidated intentd delta across the whole stable range). Fail-soft: any
      # failure just drops the summary from the aggregated notes; continue-on-error
      # makes that guarantee structural rather than relying on the shell guards.
      - name: Generate stable summary section
        if: steps.notes_base.outputs.skip_notes != 'true'
        continue-on-error: true
        env:
          # intent-hq/intentd is public; the default token covers the compare API.
          INTENTD_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREV_STABLE: ${{ steps.notes_base.outputs.base }}
          INTENTD_HEAD: ${{ steps.intentd_pins.outputs.head }}
          INTENTD_BASE: ${{ steps.intentd_pins.outputs.base }}
          CHECKOUT_OUTCOME: ${{ steps.checkout_tag.outcome }}
        run: |
          # Gate on the actual checkout outcome; a bare -f check could pass against
          # stale workspace contents that don't match the promoted tag
          if [ "$CHECKOUT_OUTCOME" != "success" ]; then
            echo "::warning::Checkout of promoted tag failed (outcome: $CHECKOUT_OUTCOME) - skipping summary section"
            exit 0
          fi
          if [ ! -f scripts/generate-stable-summary.mjs ]; then
            echo "::warning::scripts/generate-stable-summary.mjs not found - skipping summary section"
            exit 0
          fi

          ARGS=(--version "$VERSION" --out "$RUNNER_TEMP/stable-summary.md")
          if [ -n "$PREV_STABLE" ]; then
            ARGS+=(--prev-stable "$PREV_STABLE")
          fi
          if [ -n "$INTENTD_HEAD" ]; then
            ARGS+=(--intentd-version "$INTENTD_HEAD")
          fi
          if [ -n "$INTENTD_BASE" ]; then
            ARGS+=(--intentd-base "$INTENTD_BASE")
          fi

          if ! node scripts/generate-stable-summary.mjs "${ARGS[@]}"; then
            echo "::warning::Stable summary generation failed - continuing without the summary section"
            rm -f "$RUNNER_TEMP/stable-summary.md"
          fi

      # Skipped on an idempotent re-run with no recoverable range base (legacy
      # body without a notes-base marker): the existing aggregate must not be
      # clobbered.
      - name: Build aggregated release notes
        if: steps.notes_base.outputs.skip_notes != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
          NOTES_BASE: ${{ steps.notes_base.outputs.base }}
        run: |
          set -o pipefail
          # List all stable versioned releases (vX.Y.Z only, filtered by tag pattern)
          gh release list --repo intent-hq/cloudlands-releases --limit 1000 --json tagName \
            --jq '.[] | select(.tagName | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) | .tagName' \
            | sed 's/^v//' \
            | sort -V -r > "$RUNNER_TEMP/all-versions.txt"

          # Determine range: (notesBase, version]
          if [ -z "$NOTES_BASE" ]; then
            # First promotion: only include the target version
            echo "$VERSION" > "$RUNNER_TEMP/range-versions.txt"
          else
            # Include all versions > notesBase and <= version
            # First validate notesBase exists in the list
            if ! grep -qFx "$NOTES_BASE" "$RUNNER_TEMP/all-versions.txt"; then
              echo "::error::Notes range base $NOTES_BASE not found in release list"
              exit 1
            fi

            # Validate VERSION exists in the list
            if ! grep -qFx "$VERSION" "$RUNNER_TEMP/all-versions.txt"; then
              echo "::error::Target version $VERSION not found in release list - ensure v$VERSION release exists"
              exit 1
            fi

            # Validate VERSION > NOTES_BASE using semver sort
            SORTED_PAIR=$(printf "%s\n%s" "$NOTES_BASE" "$VERSION" | sort -V)
            OLDER=$(echo "$SORTED_PAIR" | head -n1)
            if [ "$OLDER" != "$NOTES_BASE" ]; then
              echo "::error::Target version $VERSION is not greater than notes range base $NOTES_BASE - cannot promote an older version to stable"
              exit 1
            fi

            awk -v prev="$NOTES_BASE" -v target="$VERSION" '
              BEGIN { found_target=0; found_prev=0; }
              {
                if ($1 == target) found_target=1;
                if ($1 == prev) found_prev=1;
                if (found_target && !found_prev) print $1;
              }
            ' "$RUNNER_TEMP/all-versions.txt" > "$RUNNER_TEMP/range-versions.txt"
          fi

          # Validate we have at least one version in the range
          if [ ! -s "$RUNNER_TEMP/range-versions.txt" ]; then
            echo "::error::No versions found in range (notesBase, version] - check that both versions exist in releases"
            exit 1
          fi

          echo "Versions to include in aggregated notes:"
          cat "$RUNNER_TEMP/range-versions.txt"

          # Lead with the notes-base marker (renders invisibly) so an
          # idempotent re-run can recover the range base, then the summary
          # section (if generated), then the per-version bodies
          {
            if [ -n "$NOTES_BASE" ]; then
              echo "<!-- notes-base: ${NOTES_BASE} -->"
            fi
            if [ -f "$RUNNER_TEMP/stable-summary.md" ]; then
              cat "$RUNNER_TEMP/stable-summary.md"
              echo ""
              echo "---"
              echo ""
            fi
            while IFS= read -r ver; do
              echo "## v${ver}"
              echo ""
              gh release view "v${ver}" --repo intent-hq/cloudlands-releases --json body --jq '.body // ""'
              echo ""
            done < "$RUNNER_TEMP/range-versions.txt"
          } > "$RUNNER_TEMP/aggregated-notes.md"

          echo "Aggregated notes preview (first 20 lines):"
          head -n 20 "$RUNNER_TEMP/aggregated-notes.md"

      - name: Update stable release notes
        if: steps.notes_base.outputs.skip_notes != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release edit stable --repo intent-hq/cloudlands-releases --notes-file "$RUNNER_TEMP/aggregated-notes.md"
          echo "✓ Stable release notes updated"

      # Channel model: versioned releases are published as Pre-releases (the
      # anchor on cloudlands-fe, the versioned release on cloudlands-releases);
      # promoting a version clears that flag and hands it the Latest badge, so
      # Latest always tracks the newest stable version. Both steps are
      # fail-soft (badges must never block a promotion) and idempotent —
      # re-promoting the same version re-applies identical flags.
      #
      # Runs before the published-date refresh below so that step observes the
      # post-promotion Latest pointer.
      - name: Mark promoted version as Latest on cloudlands-fe
        id: latest_fe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          REPO=intent-hq/cloudlands-fe
          TAG="v${VERSION}"
          MARKED=false
          if ! RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id'); then
            echo "::warning::Could not read release ${TAG} on ${REPO}; skipping Latest marking"
          elif ! gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
              -F prerelease=false -f make_latest=true >/dev/null; then
            echo "::warning::Could not mark ${TAG} as Latest on ${REPO}"
          else
            MARKED=true
            echo "✓ ${TAG} marked as Latest on ${REPO} (prerelease cleared)"
          fi
          echo "marked=$MARKED" >> "$GITHUB_OUTPUT"

      - name: Mark promoted version as Latest on cloudlands-releases
        id: latest_releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          REPO=intent-hq/cloudlands-releases
          TAG="v${VERSION}"
          MARKED=false
          if ! RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id'); then
            echo "::warning::Could not read release ${TAG} on ${REPO}; skipping Latest marking"
          elif ! gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
              -F prerelease=false -f make_latest=true >/dev/null; then
            echo "::warning::Could not mark ${TAG} as Latest on ${REPO}"
          else
            MARKED=true
            echo "✓ ${TAG} marked as Latest on ${REPO} (prerelease cleared)"
          fi
          echo "marked=$MARKED" >> "$GITHUB_OUTPUT"

      # Re-stamps published_at on the rolling stable release (GitHub renders
      # its "released N ago" from that field, which otherwise sticks at first
      # publication) by toggling draft on→off via the REST API. Reading state
      # and entering draft are fail-soft — the refresh is cosmetic and must
      # never block a promotion — but once the release is drafted its download
      # URLs (auto-updater feeds) 404, so the un-draft retries with backoff
      # and fails the job loudly if the release is left drafted.
      - name: Refresh published date on rolling stable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          REPO=intent-hq/cloudlands-releases
          TAG=stable

          # Read current state so the un-draft re-applies it (re-publishing
          # defaults make_latest to true; the stable release must keep its
          # current Latest badge behavior). With the promoted vX.Y.Z release
          # now holding Latest, this read resolves MAKE_LATEST=false and the
          # refresh leaves the badge on the version — which is the point.
          if ! STATE=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '[.id, .prerelease] | @tsv'); then
            echo "::warning::Could not read rolling '${TAG}' release state; skipping published date refresh"
            exit 0
          fi
          IFS=$'\t' read -r RELEASE_ID PRERELEASE <<< "$STATE"

          MAKE_LATEST=false
          if [ "$PRERELEASE" = "false" ]; then
            LATEST_ID=$(gh api "repos/${REPO}/releases/latest" --jq '.id' 2>/dev/null || echo "")
            if [ -z "$LATEST_ID" ]; then
              echo "::warning::Could not determine the repo's latest release; skipping published date refresh"
              exit 0
            fi
            if [ "$LATEST_ID" = "$RELEASE_ID" ]; then
              MAKE_LATEST=true
            fi
          fi

          # Enter draft (fail-soft: the release is still published if this fails)
          if ! gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=true >/dev/null; then
            echo "::warning::Could not draft rolling '${TAG}' release; skipping published date refresh"
            exit 0
          fi

          # Re-publish (mandatory from here: a drafted rolling release 404s
          # the auto-updater feed URLs)
          MAX_RETRIES=5
          RETRY_DELAY=2
          for i in $(seq 1 "$MAX_RETRIES"); do
            if gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
                -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$MAKE_LATEST" >/dev/null; then
              echo "✓ Rolling '${TAG}' release re-published (published_at refreshed; prerelease=${PRERELEASE}, make_latest=${MAKE_LATEST})"
              exit 0
            fi
            echo "::warning::Attempt $i/$MAX_RETRIES: failed to re-publish rolling '${TAG}' release"
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              sleep "$RETRY_DELAY"
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done
          echo "::error::Rolling '${TAG}' release is stuck in draft after ${MAX_RETRIES} attempts - its download URLs 404 until re-published. Fix manually: gh api -X PATCH repos/${REPO}/releases/${RELEASE_ID} -F draft=false -F prerelease=${PRERELEASE} -f make_latest=${MAKE_LATEST}"
          exit 1

      - name: Post summary
        env:
          VERSION: ${{ inputs.version }}
          PREV_STABLE: ${{ steps.stable_version.outputs.prev_stable }}
          IS_FIRST: ${{ steps.stable_version.outputs.is_first_promotion }}
          SKIP_NOTES: ${{ steps.notes_base.outputs.skip_notes }}
          PROMOTED_FEEDS: ${{ steps.upload_assets.outputs.promoted_feeds }}
          LATEST_FE: ${{ steps.latest_fe.outputs.marked }}
          LATEST_RELEASES: ${{ steps.latest_releases.outputs.marked }}
        run: |
          feed_platform() {
            case "$1" in
              latest-mac.yml) echo "macOS" ;;
              latest.yml) echo "Windows" ;;
              latest-linux.yml) echo "Linux x64" ;;
              latest-linux-arm64.yml) echo "Linux arm64" ;;
              *) echo "$1" ;;
            esac
          }

          # The Latest-marking steps are fail-soft; report which one landed
          latest_mark() {
            if [ "$1" = "true" ]; then echo "✓"; else echo "⚠"; fi
          }
          latest_suffix() {
            if [ "$1" = "true" ]; then echo ""; else echo " - FAILED, mark manually"; fi
          }

          read -ra FEEDS <<< "$PROMOTED_FEEDS"
          {
            echo "## Stable Promotion"
            echo ""
            echo "**Promoted version:** v$VERSION"
            if [ "$IS_FIRST" = "true" ]; then
              echo "**Previous stable:** (none - first promotion)"
            else
              echo "**Previous stable:** v$PREV_STABLE"
            fi
            echo ""
            echo "### Download URLs"
            echo "- [Rolling stable channel](https://github.com/intent-hq/cloudlands-releases/releases/tag/stable)"
            for feed in "${FEEDS[@]}"; do
              echo "- [Auto-updater feed ($(feed_platform "$feed"))](https://github.com/intent-hq/cloudlands-releases/releases/download/stable/${feed})"
            done
            echo ""
            echo "### Verification"
            echo "- ✓ Assets copied from versioned release v$VERSION"
            echo "- ✓ sha512 verification passed for: ${FEEDS[*]}"
            if [ "$SKIP_NOTES" = "true" ]; then
              echo "- ⚠ Release notes left untouched (idempotent re-run, no notes-base marker)"
            else
              echo "- ✓ Aggregated release notes updated"
            fi
            echo "- $(latest_mark "$LATEST_FE") v$VERSION marked Latest (Pre-release cleared) on intent-hq/cloudlands-fe$(latest_suffix "$LATEST_FE")"
            echo "- $(latest_mark "$LATEST_RELEASES") v$VERSION marked Latest (Pre-release cleared) on intent-hq/cloudlands-releases$(latest_suffix "$LATEST_RELEASES")"
          } >> "$GITHUB_STEP_SUMMARY"
