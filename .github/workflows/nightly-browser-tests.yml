name: Nightly Browser Tests

on:
  schedule:
    - cron: '17 2 * * *'
  # Always rerun the complete suites; no test/shard filters.
  workflow_dispatch:

permissions:
  contents: read

# A manual run should not cancel a nightly run and discard its evidence.
concurrency:
  group: nightly-browser-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Expected browser reports
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record expected artifacts
        run: node scripts/browser-test-artifacts.mjs manifest
      - name: Upload expected artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-manifest
          path: browser-test-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Where paid-label jobs run: a free self-hosted slot first, else WarpBuild
  # (GitHub when WarpBuild is off). See runner-route.yml.
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  test-ct:
    needs: runner-route
    # A failed route still runs the suite on its GitHub fallback label.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: ct
      cloud: ${{ needs.runner-route.outputs.cloud }}

  test-playwright:
    needs: runner-route
    # A failed route still runs the suite on its GitHub fallback label.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: root
      cloud: ${{ needs.runner-route.outputs.cloud }}

  test-electron:
    needs: runner-route
    # A failed route still runs the suite on its GitHub fallback label.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: electron
      cloud: ${{ needs.runner-route.outputs.cloud }}
