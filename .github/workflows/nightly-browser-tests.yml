name: Nightly Browser Tests

on:
  schedule:
    - cron: '17 2 * * *'
  # Always rerun the complete suites; no test/shard filters.
  workflow_dispatch:

permissions:
  contents: read

# A manual run should not cancel a nightly run and discard its evidence.
concurrency:
  group: nightly-browser-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  manifest:
    name: Expected browser reports
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record expected artifacts
        run: node scripts/browser-test-artifacts.mjs manifest
      - name: Upload expected artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-manifest
          path: browser-test-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test-ct:
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: ct

  test-playwright:
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: root

  test-electron:
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
    uses: ./.github/workflows/browser-tests.yml
    with:
      suite: electron
