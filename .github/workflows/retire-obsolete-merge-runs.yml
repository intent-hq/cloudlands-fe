name: Retire obsolete merge runs

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview obsolete runs (activation awaits credential proof)
        type: choice
        default: dry-run
        options: [dry-run]

permissions: {}
concurrency:
  group: retire-obsolete-merge-runs
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'intent-hq/cloudlands-fe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .retirement/cursor.json
          key: retirement-preview-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: retirement-preview-v1-
      - name: Probe access and preview bounded sweep
        id: retire
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/retire-obsolete-merge-runs-caller.py --probe --probe-run-id "$PROBE_RUN_ID" | tee retirement-access.json
          python3 -I -B scripts/retire-obsolete-merge-runs-caller.py --dry-run --state .retirement/cursor.json | tee retirement-decisions.json
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.retirement/cursor.json') != ''
        with:
          path: .retirement/cursor.json
          key: retirement-preview-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: retirement-*.json
          retention-days: 14
