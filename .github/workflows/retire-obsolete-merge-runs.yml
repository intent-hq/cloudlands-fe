name: Retire obsolete merge runs

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or retire provably obsolete merge-group runs
        type: choice
        default: dry-run
        options: [dry-run, apply]

permissions: {}
concurrency:
  group: retire-obsolete-merge-runs
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'intent-hq/cloudlands-fe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .retirement/cursor.json
          key: retirement-v1-${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: retirement-v1-${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}-
      - name: Check access and reconcile a bounded sweep
        id: retire
        env:
          # Evidence needs explicit bypass visibility; this existing credential is read-only.
          RETIREMENT_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
          # Only exact local run cancellation reaches this repository-scoped token.
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
          PROBE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/retire-obsolete-merge-runs-caller.py "--$MODE" --probe-run-id "$PROBE_RUN_ID" --state .retirement/cursor.json | tee retirement-decisions.json
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.retirement/cursor.json') != ''
        with:
          path: .retirement/cursor.json
          key: retirement-v1-${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: retirement-*.json
          retention-days: 14
