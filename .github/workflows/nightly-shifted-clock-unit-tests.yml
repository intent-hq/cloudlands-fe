name: Nightly Shifted-Clock Unit Tests

# Runs the unit suite with the real clock moved to an odd UTC time of day
# (src/shifted-test-clock.ts). A test that pins a fake clock and then falls back
# to the real one passes or fails depending on when CI runs: cloudlands-fe#3574
# passed its PR checks in the morning and failed 20/20 in the merge queue after
# 08:00 UTC (merge_group run 39583441525). The intent/no-fake-clock-reset-before-assertion
# lint catches the known shape before merge; this run catches the rest on schedule.
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      shifted_now:
        description: 'UTC time of day (HH:MM[:SS]) or ISO timestamp the clock reads at start'
        required: false
        default: '23:30'

permissions:
  contents: read

concurrency:
  group: nightly-shifted-clock-unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where paid-label jobs run: a free self-hosted slot first, else WarpBuild
  # (GitHub when WarpBuild is off); `cloud` skips the self-hosted step.
  # See runner-route.yml.
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
    with:
      slot_jobs: >-
        [{"key":"test-unit","label":"gh-linux-8x","minutes":15,"shards":4}]

  test-unit:
    name: Unit Tests at ${{ inputs.shifted_now || '23:30' }} UTC (shard ${{ matrix.shard }}/4)
    needs: runner-route
    # A failed route job must not block this job: it runs on its fallback label.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')[format('test-unit-{0}', matrix.shard)] || fromJSON('["gh-linux-8x"]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    env:
      GIT_TERMINAL_PROMPT: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
      TRANSFER_SELECTION_FIXTURE_ROOT: ${{ github.workspace }}/.cache/transfer-selection-contract/docs/protocol/fixtures/transfer-selection
      VITEST_SHIFTED_NOW: ${{ inputs.shifted_now || '23:30' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python for script regression tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Checkout shared transfer-selection fixtures
        uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: main
          path: .cache/transfer-selection-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/protocol/fixtures/transfer-selection/
            /scripts/
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache pnpm store
        # WarpBuild's cache on WarpBuild Linux/macOS runners, GitHub's elsewhere.
        uses: ./.github/actions/pnpm-store-cache
      - name: Read backend Keychain fixture pin
        id: backend-keychain-fixtures
        run: node scripts/backend-keychain-fixtures.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Checkout pinned backend Keychain contract
        uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: ${{ steps.backend-keychain-fixtures.outputs.sourceCommit }}
          path: .cache/backend-keychain-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/protocol/fixtures/backend-keychain/v1/
            /scripts/backend-keychain-contract.mjs
      - name: Verify backend Keychain fixture provenance
        env:
          SOURCE_COMMIT: ${{ steps.backend-keychain-fixtures.outputs.sourceCommit }}
        run: >-
          node .cache/backend-keychain-contract/scripts/backend-keychain-contract.mjs verify
          --source-root .cache/backend-keychain-contract --source-commit "$SOURCE_COMMIT"
          --component cloudlands-fe --component-root .
      - name: Read suggested-prompts case pin
        id: suggested-prompts-cases
        run: node scripts/suggested-prompts-fixtures.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Checkout pinned suggested-prompts cases
        uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: ${{ steps.suggested-prompts-cases.outputs.sourceCommit }}
          path: .cache/suggested-prompts-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/protocol/fixtures/suggested-prompts/v1/
            /scripts/suggested-prompts-contract.mjs
      - name: Verify suggested-prompts case provenance
        env:
          SOURCE_COMMIT: ${{ steps.suggested-prompts-cases.outputs.sourceCommit }}
        run: >-
          node .cache/suggested-prompts-contract/scripts/suggested-prompts-contract.mjs verify
          --source-root .cache/suggested-prompts-contract --source-commit "$SOURCE_COMMIT"
          --component cloudlands-fe --component-root .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate IPC channels
        run: pnpm run generate:ipc-channels
      - name: Unit tests at the shifted clock
        run: |
          echo "Unit suite clock shifted to $VITEST_SHIFTED_NOW UTC (VITEST_SHIFTED_NOW)" >> "$GITHUB_STEP_SUMMARY"
          node scripts/transfer-selection-fixtures.mjs
          pnpm run test:unit --shard=${{ matrix.shard }}/4
