# Custom runner labels for the self-hosted fleet, so actionlint's
# runner-label check recognizes them (everything else it treats as unknown).
self-hosted-runner:
  labels:
    - m1mac
    - tinybox
    # GH-hosted larger runner the route job bursts the heavy jobs to.
    - gh-linux-8x
    # GH-hosted larger Windows runner (16-core/64 GB, Server 2022 image) the
    # Windows release/manual-build legs run on.
    - gh-windows-16x
