# Custom runner labels for the self-hosted fleet, so actionlint's
# runner-label check recognizes them (everything else it treats as unknown).
self-hosted-runner:
  labels:
    - m1mac
    - tinybox
    # WarpBuild ephemeral runners the route job bursts to.
    - warp-ubuntu-latest-x64-2x
    - warp-ubuntu-latest-x64-16x
