self-hosted-runner:
  labels:
    # Paid size labels: runner-route.yml maps them to self-hosted slots or
    # WarpBuild (GitHub's larger runners are off; only the frozen B76
    # diagnostics still name gh-linux-8x directly). Standard GitHub labels
    # such as ubuntu-24.04 and macos-26-xlarge are built in.
    - gh-linux-8x
    - gh-linux-arm64-8x
    - gh-windows-16x
# Run by `pnpm run lint:workflows` (scripts/check-workflows.mjs). Keep every
# ignore scoped to the narrowest path and message, with its reason.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub documents `concurrency.queue: max`, which the release workflows
      # and the nightly report writer use to retain pending runs, but
      # actionlint 1.7.12 does not know the key yet:
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/member-controls-disposable.yml:
    ignore:
      # The job is disabled on purpose (`if: ${{ false }}`) until a separately
      # reviewed grant enables it; the constant condition is the control.
      - 'constant expression "false" in condition'
