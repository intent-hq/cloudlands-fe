<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: workspace-asset: workspace-file:; media-src 'self' data: blob: https: workspace-asset: workspace-file:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* workspace-file:; worker-src 'self' blob: data:;"
    />
    <title>Intent</title>
    <!-- Runtime web configuration is a same-origin deployment asset, never a Vite-bundled secret. -->
    <script src="/runtime-config.js"></script>
    <style>
      html,
      body,
      #app {
        background: transparent;
      }

      /* Splash screen to prevent blank flash during SvelteKit SPA initialization (~1s).
         Uses position:fixed to cover viewport regardless of #app's display:contents. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.15s ease-out;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      #splash-art {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Hide splash once Svelte layout mounts */
      #splash.mounted {
        opacity: 0;
        pointer-events: none;
      }
      /* Drag region available immediately so the window is draggable before Svelte mounts.
         Once Svelte's layout renders its own drag region, this one is removed. */
      #app-drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 35px;
        -webkit-app-region: drag;
        z-index: 9998;
      }
    </style>
    <script>
      // Apply theme immediately to prevent FOUC
      (function () {
        const theme = localStorage.getItem('theme') || 'system';
        const root = document.documentElement;

        if (theme === 'light') {
          root.classList.add('light');
        } else if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          // System theme
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(isDark ? 'dark' : 'light');
        }
      })();
    </script>
    <script type="module">
      // Manually import Vite client in dev mode. Production web builds
      // (build:web) are served from localhost too but have no Vite client;
      // swallow the failed import so it never trips the global
      // unhandledrejection error boundary. (Electron production builds strip
      // this script entirely via scripts/fix-production-html.js.)
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        import('/@vite/client').catch(() => {});
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-drag-region"></div>
    <div id="splash">
      <canvas id="splash-art" width="512" height="512" aria-hidden="true"> </canvas>
      <script>
        (() => {
          const canvas = document.getElementById('splash-art');
          const context = canvas.getContext('2d');
          const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const tiles = [];
          let routes = [];
          let maxRouteLength = 0;
          let seed = Math.floor(performance.timeOrigin) >>> 0;
          let width = 0;
          let height = 0;
          let columns = 0;
          let rows = 0;
          let cellWidth = 0;
          let cellHeight = 0;
          let revealStartedAt = 0;
          let nextAmbientFlip = Infinity;
          const introDuration = 2200;
          const initialRevealProgress = 0.12;
          const curvesPerTile = 7;
          const curveSpacing = 0.12;

          function random() {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            return seed / 4294967296;
          }

          function ease(progress) {
            return 1 - (1 - progress) ** 3;
          }

          function token(name, fallback) {
            return (
              getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback
            );
          }

          const dark = document.documentElement.classList.contains('dark');
          const splashLine = `hsl(${token('--foreground', dark ? '145 80% 96%' : '154 24% 14%')})`;

          function portPoint(tile, port) {
            if (port === 0) return { x: tile.cx, y: tile.cy - tile.ry };
            if (port === 1) return { x: tile.cx + tile.rx, y: tile.cy };
            if (port === 2) return { x: tile.cx, y: tile.cy + tile.ry };
            return { x: tile.cx - tile.rx, y: tile.cy };
          }

          function makeSegment(tile, from, to) {
            const fromPoint = portPoint(tile, from);
            const toPoint = portPoint(tile, to);
            const centerX = from === 1 || to === 1 ? tile.cx + tile.rx : tile.cx - tile.rx;
            const centerY = from === 2 || to === 2 ? tile.cy + tile.ry : tile.cy - tile.ry;
            const angleAt = (point) =>
              Math.atan2((point.y - centerY) / tile.ry, (point.x - centerX) / tile.rx);
            const startAngle = angleAt(fromPoint);
            let angleDelta = angleAt(toPoint) - startAngle;
            while (angleDelta > Math.PI) angleDelta -= Math.PI * 2;
            while (angleDelta < -Math.PI) angleDelta += Math.PI * 2;
            return {
              cx: centerX,
              cy: centerY,
              rx: tile.rx,
              ry: tile.ry,
              col: tile.col,
              row: tile.row,
              startAngle,
              angleDelta,
              length: (Math.PI / 2) * Math.sqrt((tile.rx ** 2 + tile.ry ** 2) / 2),
            };
          }

          function curveRadius(halfExtent, curveIndex) {
            const centeredIndex = curveIndex - (curvesPerTile - 1) / 2;
            return halfExtent * (1 + centeredIndex * curveSpacing);
          }

          function pointOnSegment(segment, progress, curveIndex) {
            const angle = segment.startAngle + segment.angleDelta * progress;
            return {
              x: segment.cx + Math.cos(angle) * curveRadius(segment.rx, curveIndex),
              y: segment.cy + Math.sin(angle) * curveRadius(segment.ry, curveIndex),
            };
          }

          const oppositePort = (port) => (port + 2) % 4;
          const pairedPort = (orient, port) => {
            if (orient === 0) return [3, 2, 1, 0][port];
            return [1, 0, 3, 2][port];
          };

          function traceRoute(startIndex, startPort) {
            const traced = [];
            const visited = new Set();
            let tileIndex = startIndex;
            let entryPort = startPort;
            while (tileIndex >= 0) {
              const key = `${tileIndex}:${entryPort}`;
              if (visited.has(key)) break;
              visited.add(key);
              const tile = tiles[tileIndex];
              const exitPort = pairedPort(tile.orient, entryPort);
              const segment = makeSegment(tile, entryPort, exitPort);
              segment.key = `${tileIndex}:${Math.min(entryPort, exitPort)}-${Math.max(entryPort, exitPort)}`;
              traced.push(segment);
              const nextCol = tile.col + (exitPort === 1 ? 1 : exitPort === 3 ? -1 : 0);
              const nextRow = tile.row + (exitPort === 2 ? 1 : exitPort === 0 ? -1 : 0);
              if (nextCol < 0 || nextCol >= columns || nextRow < 0 || nextRow >= rows) break;
              tileIndex = nextRow * columns + nextCol;
              entryPort = oppositePort(exitPort);
            }
            return traced;
          }

          function longestRouteForLayout() {
            const starts = [];
            for (let col = 0; col < columns; col += 1) {
              starts.push([col, 0], [(rows - 1) * columns + col, 2]);
            }
            for (let row = 0; row < rows; row += 1) {
              starts.push([row * columns, 3], [row * columns + columns - 1, 1]);
            }
            return starts.reduce((longest, [tileIndex, port]) => {
              const candidate = traceRoute(tileIndex, port);
              return candidate.length > longest.length ? candidate : longest;
            }, []);
          }

          function routeCoverage(candidate) {
            const columnsCovered = new Set(candidate.map((segment) => segment.col)).size;
            const rowsCovered = new Set(candidate.map((segment) => segment.row)).size;
            return {
              columnsCovered,
              rowsCovered,
              score: (columnsCovered / columns) * (rowsCovered / rows) * 1000 + candidate.length,
            };
          }

          function buildAllRoutes() {
            const claimed = new Set();
            routes = [];
            const addRoute = (tileIndex, port) => {
              const candidate = traceRoute(tileIndex, port);
              if (!candidate.length || claimed.has(candidate[0].key)) return;
              let offset = 0;
              for (const segment of candidate) {
                claimed.add(segment.key);
                segment.offset = offset;
                offset += segment.length;
              }
              candidate.totalLength = offset;
              routes.push(candidate);
            };
            for (let col = 0; col < columns; col += 1) {
              addRoute(col, 0);
              addRoute((rows - 1) * columns + col, 2);
            }
            for (let row = 0; row < rows; row += 1) {
              addRoute(row * columns, 3);
              addRoute(row * columns + columns - 1, 1);
            }
            for (let tileIndex = 0; tileIndex < tiles.length; tileIndex += 1) {
              for (let port = 0; port < 4; port += 1) addRoute(tileIndex, port);
            }
            maxRouteLength = Math.max(...routes.map((candidate) => candidate.totalLength), 1);
          }

          function buildFullWindowRoute() {
            let bestRoute = [];
            let bestOrientations = [];
            let bestScore = -1;
            const targetLength = Math.floor(tiles.length * 0.65);
            for (let attempt = 0; attempt < 1200; attempt += 1) {
              for (const tile of tiles) tile.orient = random() > 0.5 ? 1 : 0;
              const candidate = longestRouteForLayout();
              const coverage = routeCoverage(candidate);
              if (coverage.score > bestScore) {
                bestRoute = candidate;
                bestOrientations = tiles.map((tile) => tile.orient);
                bestScore = coverage.score;
              }
              if (
                coverage.columnsCovered === columns &&
                coverage.rowsCovered === rows &&
                candidate.length >= targetLength
              )
                break;
            }
            if (!bestRoute.length) return;
            for (let index = 0; index < tiles.length; index += 1) {
              tiles[index].orient = bestOrientations[index];
            }
            buildAllRoutes();
            revealStartedAt = performance.now();
            nextAmbientFlip = revealStartedAt + introDuration + 700;
          }

          function rebuild(nextSeed = seed) {
            seed = nextSeed >>> 0;
            tiles.length = 0;
            const bounds = canvas.getBoundingClientRect();
            width = Math.round(bounds.width);
            height = Math.round(bounds.height);
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * ratio;
            canvas.height = height * ratio;
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
            columns = Math.max(4, Math.round(width / 150));
            rows = Math.max(6, Math.round((height / width) * columns));
            cellWidth = width / columns;
            cellHeight = height / rows;
            for (let row = 0; row < rows; row += 1) {
              for (let col = 0; col < columns; col += 1) {
                tiles.push({
                  col,
                  row,
                  cx: (col + 0.5) * cellWidth,
                  cy: (row + 0.5) * cellHeight,
                  rx: cellWidth / 2,
                  ry: cellHeight / 2,
                  orient: 0,
                  flipStart: -1,
                  lastFlip: -Infinity,
                });
              }
            }
            buildFullWindowRoute();
          }

          function strokeRoute(route, progress) {
            const startDistance = 0;
            const endDistance = route.totalLength * progress;
            context.beginPath();
            let hasPath = false;
            for (const segment of route) {
              const localStart = Math.max(0, (startDistance - segment.offset) / segment.length);
              const localEnd = Math.min(1, (endDistance - segment.offset) / segment.length);
              if (localEnd <= 0 || localStart >= 1 || localStart >= localEnd) continue;
              for (let curveIndex = 0; curveIndex < curvesPerTile; curveIndex += 1) {
                const point = pointOnSegment(segment, localStart, curveIndex);
                context.moveTo(point.x, point.y);
                context.ellipse(
                  segment.cx,
                  segment.cy,
                  curveRadius(segment.rx, curveIndex),
                  curveRadius(segment.ry, curveIndex),
                  0,
                  segment.startAngle + segment.angleDelta * localStart,
                  segment.startAngle + segment.angleDelta * localEnd,
                  segment.angleDelta < 0,
                );
                hasPath = true;
              }
            }
            if (hasPath) context.stroke();
          }

          function addTileCurve(cx, cy, rx, ry, startAngle, endAngle) {
            context.moveTo(cx + Math.cos(startAngle) * rx, cy + Math.sin(startAngle) * ry);
            context.ellipse(cx, cy, rx, ry, 0, startAngle, endAngle);
          }

          function strokeTile(tile) {
            const rx = tile.rx;
            const ry = tile.ry;
            context.beginPath();
            for (let curveIndex = 0; curveIndex < curvesPerTile; curveIndex += 1) {
              const curveRx = curveRadius(rx, curveIndex);
              const curveRy = curveRadius(ry, curveIndex);
              if (tile.orient === 0) {
                addTileCurve(-rx, -ry, curveRx, curveRy, 0, Math.PI / 2);
                addTileCurve(rx, ry, curveRx, curveRy, Math.PI, Math.PI * 1.5);
              } else {
                addTileCurve(rx, -ry, curveRx, curveRy, Math.PI / 2, Math.PI);
                addTileCurve(-rx, ry, curveRx, curveRy, Math.PI * 1.5, Math.PI * 2);
              }
            }
            context.stroke();
          }

          function drawInteractiveTiles(now) {
            if (!reducedMotion && now >= nextAmbientFlip) {
              const anchor = tiles[Math.floor(random() * tiles.length)];
              if (anchor) {
                const reach = Math.min(cellWidth, cellHeight) * 1.4;
                for (const tile of tiles) {
                  const distance = Math.hypot(tile.cx - anchor.cx, tile.cy - anchor.cy);
                  if (tile.flipStart < 0 && distance < reach) tile.flipStart = now + distance * 0.7;
                }
              }
              nextAmbientFlip = now + 1100 + random() * 1500;
            }
            for (const tile of tiles) {
              let angle = 0;
              if (tile.flipStart >= 0) {
                const progress = (now - tile.flipStart) / 420;
                if (progress >= 1) {
                  tile.orient ^= 1;
                  tile.flipStart = -1;
                  tile.lastFlip = now;
                } else if (progress > 0) angle = ease(progress) * (Math.PI / 2);
              }
              context.save();
              context.beginPath();
              context.rect(tile.cx - tile.rx, tile.cy - tile.ry, tile.rx * 2, tile.ry * 2);
              context.clip();
              context.translate(tile.cx, tile.cy);
              if (angle) context.rotate(angle);
              strokeTile(tile);
              context.restore();
            }
          }

          function draw(now = 0) {
            if (!canvas.isConnected) return;
            if (
              width !== Math.round(canvas.clientWidth) ||
              height !== Math.round(canvas.clientHeight)
            )
              rebuild();
            context.clearRect(0, 0, width, height);
            context.globalCompositeOperation = 'source-over';
            context.strokeStyle = splashLine;
            context.lineWidth = 2;
            context.lineCap = 'round';
            const introProgress = reducedMotion
              ? 1
              : Math.min(
                  1,
                  initialRevealProgress +
                    (Math.max(0, now - revealStartedAt) / introDuration) *
                      (1 - initialRevealProgress),
                );
            if (introProgress < 1) {
              const traveled = ease(introProgress) * maxRouteLength;
              for (const route of routes) {
                strokeRoute(route, Math.min(1, traveled / route.totalLength));
              }
            } else drawInteractiveTiles(now);
            context.globalCompositeOperation = 'source-over';
            if (!reducedMotion) requestAnimationFrame(draw);
          }

          function flipNear(x, y, reach) {
            if (reducedMotion || performance.now() - revealStartedAt < introDuration) return;
            const now = performance.now();
            for (const tile of tiles) {
              const distance = Math.hypot(tile.cx - x, tile.cy - y);
              if (tile.flipStart < 0 && now - tile.lastFlip > 350 && distance < reach) {
                tile.flipStart = now + distance * 0.45;
              }
            }
          }

          canvas.addEventListener('pointermove', (event) => {
            const bounds = canvas.getBoundingClientRect();
            flipNear(
              event.clientX - bounds.left,
              event.clientY - bounds.top,
              Math.min(cellWidth, cellHeight) * 0.72,
            );
          });
          canvas.addEventListener('pointerdown', (event) => {
            const bounds = canvas.getBoundingClientRect();
            flipNear(
              event.clientX - bounds.left,
              event.clientY - bounds.top,
              Math.min(cellWidth, cellHeight) * 1.8,
            );
          });

          rebuild();
          draw(performance.now());
        })();
      </script>
    </div>
    <div style="display: contents" id="app">%sveltekit.body%</div>
  </body>
</html>
