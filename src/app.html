<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: workspace-asset: workspace-file:; font-src 'self' data:; media-src 'self' data: blob: https: workspace-asset: workspace-file:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* workspace-file: workspace-asset:; worker-src 'self' blob: data:;"
    />
    <title>Intent</title>
    <!-- Runtime web configuration is a same-origin deployment asset, never a Vite-bundled secret. -->
    <script src="/runtime-config.js"></script>
    <style>
      html,
      body,
      #app {
        background: transparent;
      }

      /* Splash screen to prevent blank flash during SvelteKit SPA initialization (~1s).
         Uses position:fixed to cover viewport regardless of #app's display:contents. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.15s ease-out;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      /* Continuous vector Pulse, available before the app bundle loads. */
      #splash-mark {
        display: block;
        width: 64px;
        height: 64px;
        overflow: visible;
        color: hsl(var(--foreground, 154 24% 14%));
      }
      .dark #splash-mark {
        color: hsl(var(--foreground, 145 80% 96%));
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) #splash-mark {
          color: hsl(var(--foreground, 145 80% 96%));
        }
      }
      #splash-mark path {
        stroke: currentColor;
        stroke-width: 18.45088;
      }
      #splash-mark g:nth-child(1) {
        --pulse-x: -15.856px;
        --pulse-y: -18.903px;
      }
      #splash-mark g:nth-child(2) {
        --pulse-x: 15.8795px;
        --pulse-y: -18.9409px;
      }
      #splash-mark g:nth-child(3) {
        --pulse-x: -21.4098px;
        --pulse-y: 12.4218px;
      }
      #splash-mark g:nth-child(4) {
        --pulse-x: 21.3538px;
        --pulse-y: 12.359px;
      }
      @media (prefers-reduced-motion: no-preference) {
        #splash-mark g:not(:last-child) path {
          animation: splash-pulse 2033.333333ms linear infinite;
        }
      }
      @keyframes splash-pulse {
        0% {
          transform: translate(0px, 0px);
          animation-timing-function: cubic-bezier(0.667, 0, 0.333, 1);
        }
        49.18032787% {
          transform: translate(var(--pulse-x), var(--pulse-y));
          animation-timing-function: cubic-bezier(0.667, 0, 0.25, 1);
        }
        98.36065574%,
        100% {
          transform: translate(0px, 0px);
        }
      }
      @media (forced-colors: active) {
        #splash-mark {
          color: CanvasText;
        }
      }
      /* The startup gate dismisses the splash once the backend is ready. */
      #splash.mounted {
        opacity: 0;
        pointer-events: none;
      }
      /* Drag region available immediately so the window is draggable before Svelte mounts.
         Once Svelte's layout renders its own drag region, this one is removed. */
      #app-drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 35px;
        -webkit-app-region: drag;
        z-index: 9998;
      }
    </style>
    <script>
      // Apply theme immediately to prevent FOUC
      (function () {
        const theme = localStorage.getItem('theme') || 'system';
        const root = document.documentElement;

        if (theme === 'light') {
          root.classList.add('light');
        } else if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          // System theme
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(isDark ? 'dark' : 'light');
        }
      })();
    </script>
    <script type="module">
      // Manually import Vite client in dev mode. Production web builds
      // (build:web) are served from localhost too but have no Vite client;
      // swallow the failed import so it never trips the global
      // unhandledrejection error boundary. (Electron production builds strip
      // this script entirely via scripts/fix-production-html.js.)
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        import('/@vite/client').catch(() => {});
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-drag-region"></div>
    <div id="splash">
      <svg
        id="splash-mark"
        width="64"
        height="64"
        viewBox="0 0 256 256"
        fill="none"
        aria-hidden="true"
      >
        <g transform="translate(0.03 26.84)">
          <path
            d="M92.148293 3.803071L112.21 58.92178C117.575582 73.663539 101.604204 87.065138 88.018096 79.221207L37.220352 49.893204"
          />
        </g>
        <g transform="translate(-0.03 27.04)">
          <path
            d="M221.41417 49.978045L170.616426 79.306048C157.030318 87.149979 141.05894 73.74838 146.424522 59.006621L166.486229 3.887912"
          />
        </g>
        <g transform="translate(-0.43 26.09)">
          <path
            d="M24.769303 119.698155L82.534231 109.51261C97.983713 106.788469 108.40846 124.844303 98.324395 136.861921L60.621011 181.795086"
          />
        </g>
        <g transform="translate(-0.03 27.01)">
          <path
            d="M195.378989 181.795086L157.675605 136.861921C147.59154 124.844303 158.016287 106.788469 173.465769 109.51261L231.230697 119.698155"
          />
        </g>
        <g transform="translate(0 27)">
          <path d="M128 135.5954L128 208.081" />
        </g>
      </svg>
    </div>
    <div style="display: contents" id="app">%sveltekit.body%</div>
  </body>
</html>
