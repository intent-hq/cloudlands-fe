<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="stylesheet" href="%sveltekit.assets%/intent-mark/pulse.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: workspace-asset: workspace-file:; media-src 'self' data: blob: https: workspace-asset: workspace-file:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* workspace-file:; worker-src 'self' blob: data:;"
    />
    <title>Intent</title>
    <!-- Runtime web configuration is a same-origin deployment asset, never a Vite-bundled secret. -->
    <script src="/runtime-config.js"></script>
    <style>
      html,
      body,
      #app {
        background: transparent;
      }

      /* Splash screen to prevent blank flash during SvelteKit SPA initialization (~1s).
         Uses position:fixed to cover viewport regardless of #app's display:contents. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.15s ease-out;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      /* Exact Pulse frames, loaded independently of the app bundle. */
      #splash-mark {
        display: block;
        width: 64px;
        height: 64px;
        overflow: visible;
        color: hsl(var(--foreground, 154 24% 14%));
      }
      .dark #splash-mark {
        color: hsl(var(--foreground, 145 80% 96%));
      }
      #splash-mark-viewport {
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      @media (forced-colors: active) {
        #splash-mark {
          color: CanvasText;
        }
      }
      /* The startup gate dismisses the splash once the backend is ready. */
      #splash.mounted {
        opacity: 0;
        pointer-events: none;
      }
      /* Drag region available immediately so the window is draggable before Svelte mounts.
         Once Svelte's layout renders its own drag region, this one is removed. */
      #app-drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 35px;
        -webkit-app-region: drag;
        z-index: 9998;
      }
    </style>
    <script>
      // Apply theme immediately to prevent FOUC
      (function () {
        const theme = localStorage.getItem('theme') || 'system';
        const root = document.documentElement;

        if (theme === 'light') {
          root.classList.add('light');
        } else if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          // System theme
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(isDark ? 'dark' : 'light');
        }
      })();
    </script>
    <script type="module">
      // Manually import Vite client in dev mode. Production web builds
      // (build:web) are served from localhost too but have no Vite client;
      // swallow the failed import so it never trips the global
      // unhandledrejection error boundary. (Electron production builds strip
      // this script entirely via scripts/fix-production-html.js.)
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        import('/@vite/client').catch(() => {});
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-drag-region"></div>
    <div id="splash">
      <svg
        id="splash-mark"
        width="64"
        height="64"
        viewBox="0 0 256 256"
        fill="none"
        aria-hidden="true"
      >
        <foreignObject width="256" height="256">
          <div id="splash-mark-viewport"><div class="intent-pulse-frames"></div></div>
        </foreignObject>
      </svg>
    </div>
    <div style="display: contents" id="app">%sveltekit.body%</div>
  </body>
</html>
