<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: workspace-asset: workspace-file:; media-src 'self' data: blob: https: workspace-asset: workspace-file:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* workspace-file:; worker-src 'self' blob: data:;"
    />
    <title>Intent</title>
    <!-- Runtime web configuration is a same-origin deployment asset, never a Vite-bundled secret. -->
    <script src="/runtime-config.js"></script>
    <style>
      html,
      body,
      #app {
        background: transparent;
      }

      /* Splash screen to prevent blank flash during SvelteKit SPA initialization (~1s).
         Uses position:fixed to cover viewport regardless of #app's display:contents. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.15s ease-out;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      /* Inline IntentMarkLoader pulse variant, visible before the app bundle loads. */
      #splash-mark {
        display: block;
        width: 64px;
        height: 64px;
        overflow: visible;
        color: hsl(var(--foreground, 154 24% 14%));
      }
      .dark #splash-mark {
        color: hsl(var(--foreground, 145 80% 96%));
      }
      #splash-mark path {
        stroke: currentColor;
        stroke-width: 18;
        stroke-linecap: butt;
        stroke-linejoin: miter;
      }
      #splash-mark path:nth-child(1) {
        --pulse-x: -11px;
        --pulse-y: -20px;
      }
      #splash-mark path:nth-child(2) {
        --pulse-x: 11px;
        --pulse-y: -20px;
      }
      #splash-mark path:nth-child(3) {
        --pulse-x: -21px;
        --pulse-y: 8px;
      }
      #splash-mark path:nth-child(4) {
        --pulse-x: 21px;
        --pulse-y: 8px;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(var(--pulse-x), var(--pulse-y));
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #splash-mark path:not(:last-child) {
          animation: splash-pulse 2033.333ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
      }
      @media (forced-colors: active) {
        #splash-mark {
          color: CanvasText;
        }
      }
      /* The startup gate dismisses the splash once the backend is ready. */
      #splash.mounted {
        opacity: 0;
        pointer-events: none;
      }
      /* Drag region available immediately so the window is draggable before Svelte mounts.
         Once Svelte's layout renders its own drag region, this one is removed. */
      #app-drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 35px;
        -webkit-app-region: drag;
        z-index: 9998;
      }
    </style>
    <script>
      // Apply theme immediately to prevent FOUC
      (function () {
        const theme = localStorage.getItem('theme') || 'system';
        const root = document.documentElement;

        if (theme === 'light') {
          root.classList.add('light');
        } else if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          // System theme
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(isDark ? 'dark' : 'light');
        }
      })();
    </script>
    <script type="module">
      // Manually import Vite client in dev mode. Production web builds
      // (build:web) are served from localhost too but have no Vite client;
      // swallow the failed import so it never trips the global
      // unhandledrejection error boundary. (Electron production builds strip
      // this script entirely via scripts/fix-production-html.js.)
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        import('/@vite/client').catch(() => {});
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app-drag-region"></div>
    <div id="splash">
      <svg
        id="splash-mark"
        width="64"
        height="64"
        viewBox="0 0 256 208"
        fill="none"
        aria-hidden="true"
      >
        <path d="M76 8L94 61C99 76 92 83 78 77L27 48" />
        <path d="M180 8L162 61C157 76 164 83 178 77L229 48" />
        <path d="M16 104L68 96C83 94 89 102 79 114L45 157" />
        <path d="M240 104L188 96C173 94 167 102 177 114L211 157" />
        <path d="M128 126L128 184" />
      </svg>
    </div>
    <div style="display: contents" id="app">%sveltekit.body%</div>
  </body>
</html>
