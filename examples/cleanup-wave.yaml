# Final Cleanup Wave - Agent System
# 4 packages to complete the agent system refactor

name: "Final Agent System Cleanup"
description: "Fix remaining TypeScript errors, implement recovery, and validate integration"

packages:
  - id: "cleanup_a_typescript"
    title: "Package A - TypeScript Error Fixes"
    description: "Fix branded type casting errors in agent-backend-adapter.ts (lines 89-90) and enum usage in unified-agent-handlers.test.ts (line 53). Read CLEANUP_PACKAGE_A_TYPESCRIPT.md for detailed instructions. Cast MessageId and StreamId properly using MessageId() and StreamId() functions. Use AgentStatus enum instead of string literal. Run npm run check to verify fixes."

  - id: "cleanup_b_managers"
    title: "Package B - Manager Implementation"
    description: "Complete manager implementation in managers/index.ts. Read CLEANUP_PACKAGE_B_MANAGERS.md for details. Define MessageManagerConfig, StorageConfig, and MonitoringConfig types. Import or create MessageManager and MonitoringManager classes. Fix StreamManager reference and dispose function. Implement singleton pattern. Run npm run check to verify."

  - id: "cleanup_c_recovery"
    title: "Package C - Recovery Implementation"
    description: "Complete stream recovery in session-manager.ts (lines 535, 975) and stats retrieval in browser/index.ts (line 379). Read CLEANUP_PACKAGE_C_RECOVERY.md for instructions. Implement recovery service calls, uncomment and fix recovery update code, add IPC handler for stats. Run npm run check to verify."

  - id: "cleanup_d_integration"
    title: "Package D - Integration & Validation"
    description: "THIS PACKAGE DEPENDS ON A, B, C COMPLETING FIRST. Read CLEANUP_PACKAGE_D_INTEGRATION.md. Run full TypeScript check (npm run check), run test suite (npm test), verify agent creation/resumption/streaming flows work. Create integration tests. Document any remaining issues in PROGRESS_CLEANUP_PACKAGE_D.md."

# Configuration
# Run A, B, C in parallel, then D sequentially
max_parallel: 3
timeout_minutes: 30
output_dir: "logs/cleanup-{timestamp}"

# Prompts between waves (not needed for single wave)
inter_wave_prompts: []
