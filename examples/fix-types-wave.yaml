name: 'TypeScript Error Fixes - Wave 4'
description: 'Fix 625+ TypeScript errors from Waves 2-3 across services, clients, and shared code'
max_parallel: 8

# Sequential prompts for each package
package_prompts:
  - name: 'work'
    prompt: |
      Don't make changes outside that folder.

      Task: {title}

      {description}

      {context}

  - name: 'review'
    prompt: |
      Review the work completed for: {title}

      Verify:
      - All TypeScript errors fixed
      - No new errors introduced
      - Type annotations are correct
      - Code quality is maintained
      - Tests pass

# Prompts that run between waves
inter_wave_prompts:
  - name: 'consolidation'
    prompt: |
      Consolidation check for Wave 4 - TypeScript Error Fixes

      Verify all packages completed successfully:
      {package_list}

      Run: npm run check
      Generate: WAVE_4_CONSOLIDATION_REPORT.md

      Document:
      - Total errors fixed
      - Remaining errors (if any)
      - Quality metrics
      - Recommendations for next wave

packages:
  - id: 'fix-types-services-agent'
    title: 'Fix types in services/agent'
    description: |
      Fix TypeScript errors in agent service files:
      - services/agent/agent-factory.ts
      - services/agent/agent-launcher.ts
      - services/agent/agent-state.ts
      - services/agent/agent-orchestrator.ts

      Focus on:
      - Type annotations for function parameters and returns
      - Interface implementations
      - Generic type parameters
      - Union type handling
      - Error type definitions

      Run: npm run check to verify fixes

  - id: 'fix-types-services-persistence'
    title: 'Fix types in services/persistence'
    description: |
      Fix TypeScript errors in persistence service:
      - services/persistence/persistence-service.ts
      - services/persistence/session-registry.ts
      - services/persistence/message-accumulator.ts

      Focus on:
      - Database type definitions
      - Query result types
      - Session state types
      - Message storage types

  - id: 'fix-types-services-streaming'
    title: 'Fix types in services/streaming'
    description: |
      Fix TypeScript errors in streaming service:
      - services/streaming/stream-manager.ts
      - services/streaming/message-streamer.ts
      - services/streaming/event-emitter.ts

      Focus on:
      - Stream type definitions
      - Event handler types
      - Callback function signatures

  - id: 'fix-types-clients-vscode'
    title: 'Fix types in clients/vscode'
    description: |
      Fix TypeScript errors in VSCode extension:
      - clients/vscode/src/extension.ts
      - clients/vscode/src/commands/
      - clients/vscode/src/providers/
      - clients/vscode/src/ui/

      Focus on:
      - VSCode API type compatibility
      - Command handler signatures
      - Provider interface implementations

  - id: 'fix-types-clients-webviews'
    title: 'Fix types in clients/common/webviews'
    description: |
      Fix TypeScript errors in webview components:
      - clients/common/webviews/src/components/
      - clients/common/webviews/src/stores/
      - clients/common/webviews/src/utils/

      Focus on:
      - Svelte component types
      - Store types
      - Event handler types

  - id: 'fix-types-clients-sidecar'
    title: 'Fix types in clients/sidecar'
    description: |
      Fix TypeScript errors in sidecar client:
      - clients/sidecar/src/
      - clients/sidecar/libs/

      Focus on:
      - IPC message types
      - Handler function signatures
      - State management types

  - id: 'fix-types-shared'
    title: 'Fix types in shared utilities'
    description: |
      Fix TypeScript errors in shared code:
      - src/shared/
      - src/utils/
      - src/types/
      - src/lib/

      Focus on:
      - Utility function signatures
      - Type definitions
      - Helper function types

  - id: 'fix-types-tests'
    title: 'Fix types in test files'
    description: |
      Fix TypeScript errors in all test files:
      - All __tests__ directories
      - All .test.ts and .test.tsx files
      - Test utilities and factories
      - Mock implementations

      Focus on:
      - Test function signatures
      - Mock type definitions
      - Assertion types
      - Test setup types
