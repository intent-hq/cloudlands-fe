# Wave 4: Actual Fixes for TypeScript Errors and Test Failures
# Reality-based approach to fix 511 TypeScript errors and 102 test failures

title: "Wave 4 - Actual TypeScript and Test Fixes"
description: "Fix the real issues found in audit: 511 TypeScript errors and 102 test failures"

packages:
  # Group A: Type System Fixes (Parallel)
  - id: "a1_type_casting"
    name: "Type Casting & Imports"
    description: "Fix branded type casting, missing imports, and enum usage"

  - id: "a2_property_access"
    name: "Property Access Fixes"
    description: "Fix ~100 'Property X does not exist on type never' errors"

  - id: "a3_type_mismatches"
    name: "Type Mismatch Fixes"
    description: "Fix Date vs string, missing properties, timestamp issues"

  # Group B: Service Fixes (Parallel after A)
  - id: "b1_managers"
    name: "Manager Implementation"
    description: "Fix managers/index.ts errors and implement missing managers"

  - id: "b2_test_env"
    name: "Test Environment Fixes"
    description: "Fix ProseMirror document errors and test environment issues"

  - id: "b3_integration"
    name: "Integration Fixes"
    description: "Complete recovery TODOs and fix service integration"

  # Group C: Validation (Sequential after A & B)
  - id: "c1_test_fixes"
    name: "Test Suite Fixes"
    description: "Fix remaining test failures after type fixes"

  - id: "c2_validation"
    name: "Final Validation"
    description: "Verify all fixes and create honest status report"

# Sequential prompts for each package
package_prompts:
  - prompt: |
      You are working on {title}: {description}

      Package: {package_name}
      Description: {package_description}

      CRITICAL RULES:
      1. Work ONLY in experimental/amelia/workspaces directory
      2. Report ACTUAL results, not intended results
      3. Run verification commands and include output
      4. If you can't fix something, document it

      Current Reality:
      - 511 TypeScript errors blocking compilation
      - 102 test failures
      - System is NOT production ready despite previous claims

  - prompt: |
      VERIFICATION REQUIREMENTS:

      Before starting, run and record:
      ```bash
      npm run check 2>&1 | grep "Error:" | wc -l
      ```
      Record this number: ___

      After completing work, run and record:
      ```bash
      npm run check 2>&1 | grep "Error:" | wc -l
      ```
      Record this number: ___

      You MUST show actual reduction in errors.

  - prompt: |
      Package-Specific Instructions:

      For A1 (Type Casting):
      - Fix MessageId, StreamId, WorkspaceId casting
      - Fix missing module imports
      - Fix enum usage (e.g., 'active' → AgentStatus.Active)
      - Focus on files: agent-backend-adapter.ts, test files

      For A2 (Property Access):
      - Fix "Property X does not exist on type 'never'" errors
      - Add null checks and optional chaining
      - Fix DOM element access in Svelte components
      - Add type guards where needed

      For A3 (Type Mismatches):
      - Fix Date vs string issues (use .toISOString())
      - Add missing required properties
      - Fix AgentMessage timestamp issues
      - Update test fixtures

      For B1 (Managers):
      - Fix src/features/agent/managers/index.ts
      - Define MessageManagerConfig, StorageConfig, MonitoringConfig
      - Import or create missing manager classes
      - Fix singleton patterns

      For B2 (Test Environment):
      - Fix ProseMirror document reference errors
      - Add proper DOM mocking for tests
      - Fix unhandled promise rejections
      - Add cleanup in afterEach hooks

      For B3 (Integration):
      - Complete recovery TODOs in session-manager.ts
      - Fix stats retrieval in browser/index.ts
      - Connect services properly
      - Fix IPC type mismatches

      For C1 (Test Fixes):
      - Run: npm test 2>&1 | grep "failed" | wc -l
      - Fix failing tests systematically
      - Update test fixtures for new types
      - Skip truly broken tests with explanation

      For C2 (Validation):
      - Run full npm run check - must show significant reduction
      - Run full npm test - document results
      - Create honest assessment of what's fixed vs remaining

  - prompt: |
      Create progress documentation:

      Create file: PROGRESS_WAVE_4_PACKAGE_{package_id}.md

      Include:
      1. Starting metrics (actual numbers)
      2. Work performed (specific files and changes)
      3. Ending metrics (actual numbers)
      4. Actual error reduction achieved
      5. Blockers encountered
      6. Time taken

      Example format:
      ```
      # Progress Report - {package_name}

      ## Starting State
      - TypeScript errors: [actual number from npm run check]
      - Test failures: [actual number from npm test]

      ## Changes Made
      - Fixed X type casting issues in Y files
      - Added null checks to Z components
      - [List actual changes]

      ## Ending State
      - TypeScript errors: [actual number]
      - Test failures: [actual number]
      - Error reduction: [percentage]

      ## Blockers
      - [Any issues that couldn't be resolved]
      ```

# No inter-wave prompts for single wave
inter_wave_prompts: []

# Configuration
max_parallel: 3
timeout_minutes: 45
output_dir: "logs/wave-4-{timestamp}"

# Dependencies
dependencies:
  b1_managers: ["a1_type_casting", "a2_property_access", "a3_type_mismatches"]
  b2_test_env: ["a1_type_casting", "a2_property_access", "a3_type_mismatches"]
  b3_integration: ["a1_type_casting", "a2_property_access", "a3_type_mismatches"]
  c1_test_fixes: ["b1_managers", "b2_test_env", "b3_integration"]
  c2_validation: ["c1_test_fixes"]
